syntax = "proto3";

package agentsam.knowledge.v1;

// Numeric values intentionally match google.rpc.Code / gRPC canonical status codes.
enum ErrorCode {
  ERROR_CODE_OK = 0;
  ERROR_CODE_CANCELLED = 1;
  ERROR_CODE_UNKNOWN = 2;
  ERROR_CODE_INVALID_ARGUMENT = 3;
  ERROR_CODE_DEADLINE_EXCEEDED = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_ALREADY_EXISTS = 6;
  ERROR_CODE_PERMISSION_DENIED = 7;
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  ERROR_CODE_FAILED_PRECONDITION = 9;
  ERROR_CODE_ABORTED = 10;
  ERROR_CODE_OUT_OF_RANGE = 11;
  ERROR_CODE_UNIMPLEMENTED = 12;
  ERROR_CODE_INTERNAL = 13;
  ERROR_CODE_UNAVAILABLE = 14;
  ERROR_CODE_DATA_LOSS = 15;
  ERROR_CODE_UNAUTHENTICATED = 16;
}

// Transport representation of the canonical AgentSam ErrorEnvelope. String
// vocabulary is deliberate: SDK reason/severity/source catalogs evolve faster
// than protobuf enum releases, while code retains the canonical gRPC mapping.
message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  string reason = 4;
  optional uint32 http_status = 5;
  optional uint32 retry_after_ms = 6;
  optional string provider = 7;
  optional string provider_code = 8;

  optional string severity = 9;
  optional string source_kind = 10;
  optional string source_name = 11;
  optional string source_service = 12;
  optional string resolution_owner = 13;
  optional string domain = 14;
  optional string tool = 15;
  optional string stage = 16;
  optional string remediation_action = 17;
  optional string remediation_message = 18;
  optional string fingerprint = 19;
  optional string trace_id = 20;
  optional string transport = 21;
  optional string resource_json = 22;
  optional string native_json = 23;
  optional string environment_json = 24;
  optional string details_json = 25;
  optional uint32 occurrence_count = 26;
  optional string request_id = 27;
  optional uint32 schema_version = 28;
}
