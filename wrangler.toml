# Canonical Cloudflare Worker for the agentsam-sdk product contract.
# Portable SDK code owns logical binding/env names; this deployment selects
# Inner Animal Media's physical D1/R2 resources for the SDK service itself.

name = "agentsam-sdk"
account_id = "ede6590ac0d2fb7daf155b35653457b2"
main = "worker/index.js"
compatibility_date = "2026-09-11"
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "inneranimalmedia-business"
database_id = "cf87b717-d4e2-4cf8-bab0-a81268e32d49"

[[r2_buckets]]
binding = "WEBSITE_ASSETS"
bucket_name = "agentsam-os-blueprint-content"

[vars]
IAM_ORIGIN = "https://inneranimalmedia.com"

# IAM_CLIENT_ID is a public OAuth runtime variable, but it is registration-specific
# and must be set only after an agentsam-sdk OAuth client is minted.
#
# Server-only secrets are installed through Cloudflare secret storage, never git:
#   IAM_CLIENT_SECRET
#   AGENTSAM_SDK_KEY
#   AGENTSAM_BRIDGE_KEY
#
# Deprecated migration aliases must not be configured on new deployments:
#   IAM_OAUTH_ISSUER
#   AGENTSAM_SDK_TOKEN
