[package]
name = "agentsam-machine-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic repository and asset perception primitives for AgentSam."
license = "MIT"
repository = "https://github.com/SamPrimeaux/agentsam-sdk"
homepage = "https://github.com/SamPrimeaux/agentsam-sdk/tree/main/native/agentsam-machine"
readme = "README.md"
keywords = ["agents", "repository", "inspection", "deterministic", "tooling"]
categories = ["development-tools"]

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.23"
