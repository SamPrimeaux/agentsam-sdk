[package]
name = "agentsam-machine-cli"
version = "0.1.0"
edition = "2021"
description = "Deterministic native repository inspection CLI for AgentSam."
license = "MIT"
repository = "https://github.com/SamPrimeaux/agentsam-sdk"
homepage = "https://github.com/SamPrimeaux/agentsam-sdk/tree/main/native/agentsam-machine"
readme = "README.md"
keywords = ["agents", "repository", "inspection", "cli", "deterministic"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agentsam-machine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
agentsam-machine-core = { version = "0.1.0", path = "../core" }
