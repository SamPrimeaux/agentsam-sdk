boundaries:
  sdk_provides:
    - portable_modules
    - cli_and_scaffolds
    - reusable_contracts
    - local_tooling
    - optional_service_building_blocks
  host_provides:
    - authenticated_user_context
    - authorization_and_policy
    - provider_credentials
    - production_storage_configuration
    - production_tool_execution_policy
    - model_orchestration
    - deployment_bindings
  workspace_policy: >-
    Workspace identifiers are optional host/application context, not a universal SDK
    authorization requirement. Portable SDK contracts must not hard-code tenant,
    workspace, provider, or repository-specific identity assumptions.
  no_false_success: true

knowledge_contracts:
  root: protocol/knowledge
  format: json_schema
  contracts:
    - source.schema.json
    - document.schema.json
    - chunk.schema.json
    - repository.schema.json
    - retrieval-query.schema.json
    - retrieval-hit.schema.json
    - context-pack.schema.json
    - ingest-receipt.schema.json
    - index-config.schema.json
  notes:
    - AST relationships are syntactic and may remain unresolved.
    - Embeddings are opt-in rather than required for initial indexing.
    - Source provenance is retained across saved generations.

security_contract:
  secrets_in_repository: false
  repairs:
    default_mode: plan
    apply_requires_clean_git: true
    isolated_branch_and_worktree: true
    verification_required: true
    auto_publish: false
    auto_deploy: false
  supported_dependency_graph: npm_lockfile
  unsupported_managers_are_incomplete: true

release:
  root_sdk:
    target_version: "2.6.12"
    state: candidate
    registry: npm
    current_latest: "2.6.8"
    current_alpha: "2.0.0-alpha.identity.12"
    candidate_base_head: 2d7c8214809bf9a947f6151e9745d98695892f46
    published_at_utc: "2026-10-02T05:00:55.232Z"
    published_git_head: f6b9ffa44f48b07fc6f172210e26c5dc23646778
    dist_integrity: "sha512-7UIZeM2i79nky3vCKkA1nh2t5SpuojqaVV3S/6w7NxcLQc7FFii9lF0uK/4iqNhK2C26DrylR9KkUqAhfHuQCA=="
    git_tag: v2.6.8
    verification_command: npm run verify:release
    publish_mode: manual
  identity:
    publish_separately: true
  python:
    publish_to_pypi: false

verification:
  required:
    - node_sdk_tests
    - identity_tests
    - package_exports
    - bootstrap
    - npm_pack_dry_run
    - installed_tarball_consumer_proof
    - knowledge_package_proof
    - python_tests
    - complete_dependency_scan
    - merkle_bound_trust_boundary_scan
  command: npm run verify:release

layout:
  src: Node SDK, CLI commands, local runtime helpers, knowledge, security, and UI helpers
  packages: private/focused workspaces including identity and shell-kit
  protocol: shared portable contracts and ownership rules
  python: bundled Python repository/data tooling and optional Rich terminal renderer lab
  services: optional service runtimes such as knowledge and CAD
  templates: project and UI scaffold templates
  docs: product, release, security, and developer documentation
  test: Node verification suites
