name: AgentSam SDK CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/agentsam-go-worker/runtime/go.mod
          cache: false

      - name: Install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"

      # Included-app manifests invoke npm ci during release staging.
      # Validate the actual CAD lockfile here rather than discovering drift
      # after a successful SDK verification and before production deploy.
      - name: Verify CAD included-app clean install
        run: npm ci --prefix apps/cad-creator --ignore-scripts --no-audit --no-fund

      # npm ci alone does not check Vite asset imports: compile the real CAD UI.
      - name: Verify CAD clean frontend build
        run: npm run build -w @inneranimalmedia/agentsam-cad-frontend --prefix apps/cad-creator -- --base=/cad-creator/

      - name: Verify Campaign D1 schema, backfills and scoped API
        run: npm --prefix packages/agentsam-campaign test

      - name: Verify app-scoped Cloudflare SDK dependency links
        run: node --test apps/local-studio/scripts/ensure-aliased-deps.test.mjs

      - name: Verify packaged Console navigation before dependency gate
        run: node --test --test-name-pattern='Local Studio owns|platform home|AgentSam app|Growth appearance|legacy /cli|desktop Console' apps/local-studio/scripts/packaged-console-mount.test.mjs

      - name: Verify isolated SAM OS and host-installed authoring discovery
        run: node --test test/cli/sam-os.test.mjs test/integration/universal-authoring-os.test.mjs

      - name: UI authoring contract tests
        run: node --test scripts/ui-quality/*.test.mjs

      - name: UI default theme contrast
        run: node scripts/ui-quality/contrast.mjs

      - name: UI changed-source gate
        if: github.event_name == 'pull_request'
        run: node scripts/ui-quality/check-source.mjs --changed-from "origin/$GITHUB_BASE_REF"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: CAD Python quality (pinned ty + Ruff)
        run: npm run verify:cad-python

      - name: Verify AgentSam registry and CLI contract
        run: npm run verify:registry

      - name: Dependency health
        run: node src/security/cli.mjs check --log "$RUNNER_TEMP/npm-ci.log" --json > "$RUNNER_TEMP/dependency-health.json"

      - name: Verify canonical errors package resolution
        run: |
          node --input-type=module - <<'NODE'
          const resolved = import.meta.resolve('@inneranimalmedia/agentsam-errors');
          console.log(resolved);

          if (!resolved.includes('/packages/agentsam-errors/src/index.js')) {
            throw new Error(`unexpected agentsam-errors resolution: ${resolved}`);
          }
          NODE

      - name: Verify stable release-train and dependency publication order
        run: |
          npm run release:train:check
          node scripts/sdk-release-publish.mjs --plan

      - name: Verify SDK
        run: npm run verify

      # Prevent typed CAD operations and public asset access from silently
      # regressing while UI branches/docs are being merged.
      - name: Verify CAD runtime modes, authorizations and asset boundary
        run: |
          node --test test/integration/cad-operator-capabilities.test.mjs test/integration/cad-run-modes.test.mjs
          node --test apps/local-studio/backend/worker/cad-chess-assets.test.mjs

      # Settings-specific rendered evidence complements the general UI contract
      # checks above and blocks shipping when browser interaction/AA checks fail.
      # Root npm ci uses source workspaces. Studio's standalone install instead
      # requires every pinned public package and a matching published lock.
      - name: Verify complete published Studio prerequisites
        run: |
          node apps/local-studio/scripts/check-first-party-registry.mjs --require
          node apps/local-studio/scripts/verify-npm10-lock.mjs

      - name: Install Studio browser-test dependencies
        run: npm ci --prefix apps/local-studio --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and OS libraries
        run: npm exec --prefix apps/local-studio -- playwright install --with-deps chromium

      - name: Verify packaged Settings UI quality
        run: npm run quality:ui
        env:
          UI_QUALITY_OUTPUT: ${{ runner.temp }}/agentsam-ui-quality

      - name: Install Go Worker dependencies
        run: npm ci --prefix apps/agentsam-go-worker

      - name: Verify Go runtime
        run: npm --prefix apps/agentsam-go-worker run verify:go

      - name: Verify Go linux/amd64 container
        run: npm --prefix apps/agentsam-go-worker run verify:container

      - name: Verify Cloudflare Worker + Container config
        run: npm --prefix apps/agentsam-go-worker run verify:worker

      - name: Verify Go service distribution isolation
        run: npm run verify:go-distribution

      - name: Verify installed package in unrelated repositories
        run: npm run verify:knowledge-package

      - name: Verify Python tools
        run: npm run test:python

      - name: Prepare Python 3.12 for site.scrape
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install site.scrape Python dependencies
        run: python -m pip install -e packages/agentsam-site-scrape

      - name: Verify site.scrape evidence and redirect boundary
        run: npm run test:site-scrape
        env:
          PYTHON: python

      - name: CLI context smoke
        run: node src/cli.js context --json

      - name: Settings UI quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentsam-ui-quality
          path: ${{ runner.temp }}/agentsam-ui-quality
          if-no-files-found: ignore
          retention-days: 14

      - name: Dependency health receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health
          path: ${{ runner.temp }}/dependency-health.json
          if-no-files-found: ignore
          retention-days: 14

  # Exercise the same release sequence operators use before deploying a Worker.
  # Verify-only SDK checks cannot detect missing included-app bundles or host assets.
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Ecommerce nested npm 11 clean install
        run: npm run install:studio --prefix apps/ecommerce-cms-agentsam
      - name: Verify Ecommerce installer tests
        run: node --test apps/ecommerce-cms-agentsam/tests/install-studio-deps.test.mjs
      - name: Build all registered included apps
        run: node apps/local-studio/scripts/build-included-apps.mjs --all
      - name: Install Local Studio build dependencies
        run: npm ci --prefix apps/local-studio --ignore-scripts --no-audit --no-fund
      - name: Assemble hosted Local Studio Worker and assets
        run: npm run build --prefix apps/local-studio
      - name: Verify hosted Worker output
        run: npm run cf:verify-output --prefix apps/local-studio
      - name: Smoke-test hosted Worker routes
        run: npm run cf:smoke:worker --prefix apps/local-studio
