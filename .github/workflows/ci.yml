name: AgentSam SDK CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: node src/security/cli.mjs run --json -- npm ci > "$RUNNER_TEMP/dependency-health.json"

      - name: Verify SDK
        run: npm run verify

      - name: CLI context smoke
        run: node src/cli.js context --json

      - name: Dependency health receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health
          path: ${{ runner.temp }}/dependency-health.json
          if-no-files-found: ignore
          retention-days: 14
