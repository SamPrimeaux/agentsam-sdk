name: AgentSam SDK CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Newer source pushes supersede stale validation runs; manual runs are preserved.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'source' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # The SDK suite, sharded so wall-clock is the slowest shard, not the sum.
  # `npm run verify` runs the same shards in sequence for local use.
  sdk:
    name: sdk (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [static, unit, cli, integration, workspaces]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SDK
        uses: ./.github/actions/sdk-setup
        with:
          studio: 'true'

      - name: Link canonical SDK source for integration tests
        if: matrix.shard == 'integration'
        run: |
          mkdir -p node_modules/@inneranimalmedia
          ln -sfn "$GITHUB_WORKSPACE" node_modules/@inneranimalmedia/agentsam-sdk
          node apps/local-studio/scripts/link-local-sdk.mjs

      - name: Verify SDK shard
        run: node scripts/with-ephemeral-tmpdir.mjs -- npm run verify:shard:${{ matrix.shard }}

      # Keep the default SDK free of OpenCV/NumPy. Exercise the actual native
      # engine only for changes to this media capability or explicit CI runs.
      - name: Detect OpenCV media changes
        id: opencv_media
        if: matrix.shard == 'integration'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" --quiet
            base="origin/$GITHUB_BASE_REF"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          changed=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git diff --name-only "$base"...HEAD | grep -qE '^(python/agentsam_sdk/media/|python/tests/test_opencv_media.py|python/pyproject.toml|src/sam/adapters/opencv-video.js|src/sam/adapters/workspace-media.js|src/sam/shell-host.js|test/integration/sam-opencv-media.test.mjs|\.github/workflows/ci.yml)'; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Verify real OpenCV video decoding and SAM-owned frame derivatives
        if: matrix.shard == 'integration' && steps.opencv_media.outputs.changed == 'true'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          python3 -m venv "$RUNNER_TEMP/sam-opencv"
          "$RUNNER_TEMP/sam-opencv/bin/python" -m pip install -e './python[opencv]'
          "$RUNNER_TEMP/sam-opencv/bin/python" -m unittest discover -s python/tests -p test_opencv_media.py -v
          AGENTSAM_OPENCV_PYTHON="$RUNNER_TEMP/sam-opencv/bin/python" node --test test/integration/sam-opencv-media.test.mjs

  checks:
    name: checks (contracts, quality, dependency health)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SDK
        uses: ./.github/actions/sdk-setup
        with:
          studio: 'false'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: CAD Python quality (pinned ty + Ruff)
        run: npm run verify:cad-python

      - name: Verify AgentSam registry and CLI contract
        run: npm run verify:registry

      - name: App boundaries
        run: npm run app:boundaries

      - name: Dependency health
        run: node src/security/cli.mjs check --log "$RUNNER_TEMP/npm-ci.log" --json > "$RUNNER_TEMP/dependency-health.json"

      - name: Verify canonical errors package resolution
        run: |
          node --input-type=module - <<'NODE'
          const resolved = import.meta.resolve('@inneranimalmedia/agentsam-errors');
          console.log(resolved);

          if (!resolved.includes('/packages/agentsam-errors/src/index.js')) {
            throw new Error(`unexpected agentsam-errors resolution: ${resolved}`);
          }
          NODE

      # The release-train guard checks manifests, lockfiles and publish order, so it
      # only runs when one of those can have changed (or when run by hand).
      - name: Detect release-train changes
        id: release_train
        run: |
          changed=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/$GITHUB_BASE_REF"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git diff --name-only "$base"...HEAD 2>/dev/null | grep -qE '(^|/)(package\.json|package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$|^scripts/(release|sdk-release|verify-registry-train)|^test/release/|^\.changeset/|^\.github/workflows/ci\.yml$'; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "release-train guard needed: $changed"

      - name: Verify release train, dependency pins and publishing safeguards
        if: steps.release_train.outputs.changed == 'true'
        run: npm run release:train:guard

      # Real-engine proof for IFC validate/diff/edit. It installs IfcOpenShell, so it only
      # runs when IFC code, its tests or this workflow change (or when run by hand).
      - name: Detect IFC authoring changes
        id: ifc_authoring
        run: |
          changed=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/$GITHUB_BASE_REF"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git diff --name-only "$base"...HEAD 2>/dev/null | grep -qE '^services/cad/(ifc|proof|typings)/|^src/lib/cad/ifc|^src/sam/operations/cad-bim-ifc|^test/(unit|integration)/cad-ifc|^\.github/workflows/ci\.yml$'; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "IFC authoring proof needed: $changed"

      - name: IFC authoring proof (real IfcOpenShell)
        if: steps.ifc_authoring.outputs.changed == 'true'
        run: |
          uv venv "$RUNNER_TEMP/ifc-venv" --python 3.11
          uv pip install --python "$RUNNER_TEMP/ifc-venv/bin/python" ifcopenshell==0.8.4.post1 numpy
          "$RUNNER_TEMP/ifc-venv/bin/python" services/cad/proof/ifc_edit_test.py
          AGENTSAM_CAD_PYTHON="$RUNNER_TEMP/ifc-venv/bin/python" node --test test/integration/cad-ifc-real.test.mjs

      - name: CLI context smoke
        run: node src/cli.js context --json

      - name: UI authoring contract tests
        run: node --test scripts/ui-quality/*.test.mjs

      - name: UI default theme contrast
        run: node scripts/ui-quality/contrast.mjs

      - name: UI changed-source gate
        if: github.event_name == 'pull_request'
        run: node scripts/ui-quality/check-source.mjs --changed-from "origin/$GITHUB_BASE_REF"

      - name: Dependency health receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health
          path: ${{ runner.temp }}/dependency-health.json
          if-no-files-found: ignore
          retention-days: 14

  apps:
    name: apps (Canvas, CAD, Console, SAM OS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SDK
        uses: ./.github/actions/sdk-setup
        with:
          studio: 'false'

      # Root-only installs must resolve Worker imports before nested app installs
      # can accidentally hide missing SDK/package dependency boundaries.
      - name: Verify clean SDK Canvas provider import
        run: node --test --test-name-pattern='real generation orchestrator' test/integration/canvas-work-runtime.test.mjs

      # Included-app manifests invoke npm ci during release staging.
      # Validate the actual CAD lockfile here rather than discovering drift
      # after a successful SDK verification and before production deploy.
      - name: Verify CAD included-app clean install
        run: npm ci --prefix apps/cad-creator --ignore-scripts --no-audit --no-fund

      # npm ci alone does not check Vite asset imports: compile the real CAD UI.
      - name: Verify CAD clean frontend build
        run: npm run build -w @inneranimalmedia/agentsam-cad-frontend --prefix apps/cad-creator -- --base=/cad-creator/

      - name: Verify Campaign D1 schema, backfills and scoped API
        run: npm --prefix packages/agentsam-campaign test

      - name: Verify canonical dashboard admin routes and navigation
        run: node --test apps/local-studio/shared/studio-admin-routes.test.mjs apps/local-studio/backend/worker/studio-navigation-preferences.test.mjs apps/local-studio/backend/worker/studio-session.test.mjs

      - name: Verify app-scoped Cloudflare SDK dependency links
        run: node --test apps/local-studio/scripts/ensure-aliased-deps.test.mjs apps/local-studio/scripts/studio-source-deps.test.mjs

      - name: Verify AgentSamForms account ownership, drafts and submissions
        run: node --test apps/local-studio/backend/worker/agentsam-forms.test.mjs

      - name: Verify packaged Console navigation before dependency gate
        run: node --test --test-name-pattern='Local Studio owns|platform home|Growth appearance|legacy /cli|desktop Console' apps/local-studio/scripts/packaged-console-mount.test.mjs

      - name: Verify isolated SAM OS and host-installed authoring discovery
        run: node --test test/cli/sam-os.test.mjs test/integration/universal-authoring-os.test.mjs

      # Canvas Work is hosted inside the standalone Local Studio workspace.
      # Its runtime imports the published SDK through that app's own lockfile,
      # not the root workspace dependency tree. Install it before root tests.
      - name: Install Studio runtime dependencies for SDK integration tests
        run: npm ci --prefix apps/local-studio --ignore-scripts --no-audit --no-fund

      - name: Link current SDK checkout for Studio integration checks
        run: node apps/local-studio/scripts/link-local-sdk.mjs

      - name: Verify account-owned AgentSam avatar preference
        run: node --test apps/local-studio/backend/worker/studio-user-preferences.test.mjs

      - name: Verify Canvas unification and focused Media behavior
        run: node --test apps/local-studio/scripts/canvas-dedupe-media-focus.test.mjs apps/local-studio/backend/worker/plugin-side-stages.test.mjs apps/local-studio/backend/worker/design-canvas-unified.test.mjs

      - name: Verify native scene and theme-scene packages
        run: |
          npm test --workspace @inneranimalmedia/iamscene
          npm test --workspace @inneranimalmedia/theme-scenes

      # Prevent typed CAD operations and public asset access from silently
      # regressing while UI branches/docs are being merged.
      - name: Verify CAD runtime modes, authorizations and asset boundary
        run: |
          node --test test/integration/cad-operator-capabilities.test.mjs test/integration/cad-run-modes.test.mjs
          node --test apps/local-studio/backend/worker/cad-chess-assets.test.mjs

  # Browser evidence for the Settings UI (fixture-driven, so it cannot see
  # authenticated screens). Runs on main and on demand, not on every pull request.
  ui:
    name: ui (Settings evidence)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SDK
        uses: ./.github/actions/sdk-setup
        with:
          studio: 'true'

      # Settings-specific rendered evidence complements the general UI contract
      # checks above and blocks shipping when browser interaction/AA checks fail.
      # Root npm ci uses source workspaces. Studio's standalone install instead
      # requires every pinned public package and a matching published lock.
      - name: Verify complete published Studio prerequisites
        run: |
          node apps/local-studio/scripts/check-first-party-registry.mjs --require
          node apps/local-studio/scripts/verify-npm10-lock.mjs

      - name: Install Chromium and OS libraries
        run: npm exec --prefix apps/local-studio -- playwright install --with-deps chromium

      - name: Verify packaged Settings UI quality
        run: npm run quality:ui
        env:
          UI_QUALITY_OUTPUT: ${{ runner.temp }}/agentsam-ui-quality

      - name: Settings UI quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentsam-ui-quality
          path: ${{ runner.temp }}/agentsam-ui-quality
          if-no-files-found: ignore
          retention-days: 14

  go:
    name: go (runtime, container, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SDK
        uses: ./.github/actions/sdk-setup
        with:
          studio: 'false'

      - name: Install Go Worker dependencies
        run: npm ci --prefix apps/agentsam-go-worker

      - name: Verify Go runtime
        run: npm --prefix apps/agentsam-go-worker run verify:go

      - name: Verify Go linux/amd64 container
        run: npm --prefix apps/agentsam-go-worker run verify:container

      - name: Verify Cloudflare Worker + Container config
        run: npm --prefix apps/agentsam-go-worker run verify:worker

      - name: Verify Go service distribution isolation
        run: npm run verify:go-distribution

  packaging:
    name: packaging (installed package, Python tools)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SDK
        uses: ./.github/actions/sdk-setup
        with:
          studio: 'false'

      - name: Verify installed package in unrelated repositories
        run: npm run verify:knowledge-package

      - name: Verify Python tools
        run: npm run test:python

      - name: Prepare Python 3.12 for site.scrape
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install site.scrape Python dependencies
        run: python -m pip install -e packages/agentsam-site-scrape

      - name: Verify site.scrape evidence and redirect boundary
        run: npm run test:site-scrape
        env:
          PYTHON: python

  # One stable required-check name for the whole suite.
  verify:
    name: verify
    if: always()
    needs: [sdk, checks, apps, ui, go, packaging]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A verification job failed or was cancelled."
            exit 1
          fi

  # Exercise the same release sequence operators use before deploying a Worker.
  # Verify-only SDK checks cannot detect missing included-app bundles or host assets.
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Ecommerce CMS test-only dependency
        run: |
          jsdom_version="$(node -p 'require("./apps/ecommerce-cms-agentsam/package.json").devDependencies.jsdom')"
          test_deps="$RUNNER_TEMP/ecommerce-cms-test-deps"
          mkdir -p "$test_deps"
          printf '{"private":true}\n' > "$test_deps/package.json"
          npm install --prefix "$test_deps" --no-save --package-lock=false --install-strategy=nested --ignore-scripts --no-audit --no-fund "jsdom@$jsdom_version"
          # Keep test-only dependencies out of the root workspace reifier.
          # Nested install keeps jsdom's own dependency tree beside the package.
          if [ ! -e "$GITHUB_WORKSPACE/node_modules/jsdom/package.json" ]; then
            ln -s "$test_deps/node_modules/jsdom" "$GITHUB_WORKSPACE/node_modules/jsdom"
          fi
          JSDOM_EXPECTED_VERSION="$jsdom_version" node -e 'const p=require("./node_modules/jsdom/package.json"); if(p.version!==process.env.JSDOM_EXPECTED_VERSION) throw new Error("ecommerce_jsdom_version_mismatch")'
      - name: Build packaged portable contracts
        run: npm run build:contracts
      - name: Check Ecommerce standalone npm prerequisites
        id: ecommerce-registry
        run: node apps/local-studio/scripts/check-first-party-registry.mjs --app-root apps/ecommerce-cms-agentsam --lock-file npm-shrinkwrap.json --standalone --github-output
      - name: Verify Ecommerce nested npm 11 clean install
        if: steps.ecommerce-registry.outputs.ready == 'true'
        run: npm run install:studio --prefix apps/ecommerce-cms-agentsam
      - name: Defer Ecommerce nested npm 11 clean install until packages are published
        if: steps.ecommerce-registry.outputs.ready != 'true'
        run: echo "::notice::Ecommerce standalone install deferred until its exact first-party packages are published and npm-shrinkwrap.json is regenerated."
      - name: Verify Ecommerce installer tests
        run: node --test apps/ecommerce-cms-agentsam/tests/install-studio-deps.test.mjs
      - name: Install Ecommerce image-processing test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/ecommerce-image-deps"
          cd "$RUNNER_TEMP/ecommerce-image-deps"
          npm init -y
          npm install --no-save --ignore-scripts --no-audit --no-fund @jsquash/jpeg@1.6.0 @jsquash/png@3.1.1 @jsquash/resize@2.1.1 @jsquash/webp@1.5.0
          rm -rf "$GITHUB_WORKSPACE/node_modules/@jsquash"
          ln -s "$RUNNER_TEMP/ecommerce-image-deps/node_modules/@jsquash" "$GITHUB_WORKSPACE/node_modules/@jsquash"
      - name: Link canonical SDK source for workspace-level Ecommerce tests
        run: |
          mkdir -p node_modules/@inneranimalmedia
          ln -sfn "$GITHUB_WORKSPACE" node_modules/@inneranimalmedia/agentsam-sdk
      - name: Verify hosted CMS account isolation and degraded status
        run: |
          node --test \
            apps/ecommerce-cms-agentsam/tests/account-context-init.test.mjs \
            apps/ecommerce-cms-agentsam/tests/account-context-request-scope.test.mjs \
            apps/ecommerce-cms-agentsam/tests/agentsam-status-degraded.test.mjs \
            apps/local-studio/backend/worker/studio-cms-assistant.test.mjs \
            apps/local-studio/backend/worker/cms-owned-sites.test.mjs \
            packages/connectors/cfoa/tests/capabilities.test.mjs
      - name: Install Local Studio build dependencies
        run: npm ci --prefix apps/local-studio --ignore-scripts --no-audit --no-fund
      - name: Reuse root dependencies for Ecommerce backend tests
        run: |
          rm -rf apps/ecommerce-cms-agentsam/node_modules apps/ecommerce-cms-agentsam/frontend/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" apps/ecommerce-cms-agentsam/node_modules
          # Do not symlink frontend/node_modules to the shared root. The
          # Local Studio staging script runs the frontend's own locked npm ci
          # when its isolated dependency tree is absent; npm ci must never
          # receive a symlink to (and remove) the root workspace node_modules.
          test -f node_modules/react/package.json
          test -f node_modules/@types/react/index.d.ts
          test -f node_modules/@inneranimalmedia/analytics-ui/package.json
      - name: Assemble hosted Local Studio Worker and assets
        run: npm run build --prefix apps/local-studio
      - name: Verify hosted Worker output
        run: npm run cf:verify-output --prefix apps/local-studio
      - name: Verify hosted Studio backend tests
        run: npm run test --workspace @inneranimalmedia/agentsam-local-studio-backend --prefix apps/local-studio
      - name: Smoke-test hosted Worker routes
        run: npm run cf:smoke:worker --prefix apps/local-studio
      - name: Install Chromium for hosted shell regression
        if: github.event_name != 'pull_request'
        working-directory: apps/local-studio
        run: npx playwright install --with-deps chromium
      - name: Verify hosted shell with restored co-worker
        if: github.event_name != 'pull_request'
        run: node apps/local-studio/scripts/smoke-restored-admin-shell.mjs
