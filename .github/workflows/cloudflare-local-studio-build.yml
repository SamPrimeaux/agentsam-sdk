name: Local Studio Cloudflare Build

on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-local-studio-build.yml'
      - 'apps/local-studio/**'
      - 'packages/agentsam-nav/**'
      - 'packages/agentsam-workbench/**'
      - 'packages/agentsam-contracts/**'
      - 'packages/agentsam-loading-scene/**'
      - 'packages/agentsam-settings/**'
      - 'packages/agentsam-analytics/**'
      - 'packages/analytics-ui/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-local-studio-build.yml'
      - 'apps/local-studio/**'
      - 'packages/agentsam-nav/**'
      - 'packages/agentsam-workbench/**'
      - 'packages/agentsam-contracts/**'
      - 'packages/agentsam-loading-scene/**'
      - 'packages/agentsam-settings/**'
      - 'packages/agentsam-analytics/**'
      - 'packages/analytics-ui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/local-studio
    steps:
      - name: Checkout SDK monorepo
        uses: actions/checkout@v4

      - name: Use Cloudflare Node/npm versions
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/local-studio/package-lock.json

      # App-only npm ci cannot install an SDK version before npm publication.
      # A candidate release defers this downstream job; never fake registry
      # integrity or silently substitute 2.6.12 for the requested 2.6.13.
      - name: Check published SDK prerequisite
        id: sdk_registry
        run: |
          SDK_VERSION=$(node -p "require('./package.json').version")
          if npm view "@inneranimalmedia/agentsam-sdk@${SDK_VERSION}" version --fetch-retries=1 >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SDK @inneranimalmedia/agentsam-sdk@${SDK_VERSION} is published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DEFERRED: Local Studio Cloudflare build requires published @inneranimalmedia/agentsam-sdk@${SDK_VERSION}; rerun after the stable npm release." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Cloudflare build deferred until the versioned SDK is actually published"
          fi

      # Never build Local Studio against an unpublished SDK or fake lock digest.
      - name: Install app-only dependencies
        if: steps.sdk_registry.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Compile Local Studio and verify Worker assets
        if: steps.sdk_registry.outputs.ready == 'true'
        run: npm run build && npm run cf:verify-output
