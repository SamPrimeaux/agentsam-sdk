name: Local Studio Cloudflare Build

on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-local-studio-build.yml'
      - 'apps/local-studio/**'
      - 'packages/agentsam-nav/**'
      - 'packages/agentsam-workbench/**'
      - 'packages/agentsam-contracts/**'
      - 'packages/agentsam-loading-scene/**'
      - 'packages/agentsam-settings/**'
      - 'packages/agentsam-analytics/**'
      - 'packages/analytics-ui/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-local-studio-build.yml'
      - 'apps/local-studio/**'
      - 'packages/agentsam-nav/**'
      - 'packages/agentsam-workbench/**'
      - 'packages/agentsam-contracts/**'
      - 'packages/agentsam-loading-scene/**'
      - 'packages/agentsam-settings/**'
      - 'packages/agentsam-analytics/**'
      - 'packages/analytics-ui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/local-studio
    steps:
      - name: Checkout SDK monorepo
        uses: actions/checkout@v4

      - name: Use Cloudflare Node/npm versions
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/local-studio/package-lock.json

      # A published SDK is insufficient: Studio independently pins public
      # packages (Campaign, IDE, Nav, etc). Respect npm integrity and never
      # downgrade or invent lockfile records to make an unready build green.
      - name: Check complete published Studio prerequisites
        id: sdk_registry
        run: node scripts/check-first-party-registry.mjs --github-output

      # Never build Local Studio against an unpublished SDK or fake lock digest.
      - name: Install app-only dependencies
        if: steps.sdk_registry.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Compile Local Studio and verify Worker assets
        if: steps.sdk_registry.outputs.ready == 'true'
        run: npm run build && npm run cf:verify-output
