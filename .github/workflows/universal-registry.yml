name: Universal registry provenance
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/registry/**'
      - 'src/cli/command-catalog.js'
      - 'python/agentsam_sdk/**'
      - 'scripts/registry/generate-universal.mjs'
      - 'skills/**'
      - 'protocol/sam/registry.seed.json'
      - 'migrations/d1/**'
      - 'package.json'
      - '.github/workflows/universal-registry.yml'
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install workspace package links for source registry resolution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed source registry matches executable manifests
        run: node scripts/registry/generate-universal.mjs --check
      - name: Focused source, Python CLI and D1 read-only tests
        run: node --test test/integration/universal-source-registry.test.mjs test/integration/universal-registry-reconcile.test.mjs
      - name: Upload D1 candidate seeds and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: universal-registry-staging
          if-no-files-found: error
          retention-days: 14
          path: |
            protocol/registry/universal-catalog.v1.json
            migrations/d1/generated/20261123_portable_cli_seed.sql
            migrations/d1/generated/20261123_source_skill_seed.sql
