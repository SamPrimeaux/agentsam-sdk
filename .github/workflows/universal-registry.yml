name: Universal registry provenance
on:
  push:
    branches:
      - fix/batch1-universal-registry-20261123
  pull_request:
    paths:
      - 'src/registry/**'
      - 'src/cli/command-catalog.js'
      - 'python/agentsam_sdk/**'
      - 'scripts/registry/generate-universal.mjs'
      - 'skills/**'
      - 'protocol/sam/registry.seed.json'
      - 'migrations/d1/**'
      - 'package.json'
      - '.github/workflows/universal-registry.yml'
permissions:
  contents: write
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate versioned source projection
        run: node scripts/registry/generate-universal.mjs --write
      - name: Check generated output is reproducible
        run: node scripts/registry/generate-universal.mjs --check
      - name: Focused source, Python CLI and D1 read-only tests
        run: node --test test/integration/universal-source-registry.test.mjs test/integration/universal-registry-reconcile.test.mjs
      - name: Persist generated source receipts on the Batch 1 branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/batch1-universal-registry-20261123'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add protocol/registry/universal-catalog.v1.json
          git add migrations/d1/generated/20261123_portable_cli_seed.sql
          git add migrations/d1/generated/20261123_source_skill_seed.sql
          if ! git diff --cached --quiet; then
            git commit -m 'build(registry): record generated source catalog and D1 staging seeds'
            git push origin HEAD:refs/heads/fix/batch1-universal-registry-20261123
          fi
      - name: Upload D1 candidate seeds and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: universal-registry-staging
          if-no-files-found: error
          retention-days: 14
          path: |
            protocol/registry/universal-catalog.v1.json
            migrations/d1/generated/20261123_portable_cli_seed.sql
            migrations/d1/generated/20261123_source_skill_seed.sql
