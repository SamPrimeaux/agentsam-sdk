name: Publish AgentSam SDK Alpha

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: node src/security/cli.mjs run --json -- npm ci > "$RUNNER_TEMP/dependency-health.json"

      - name: Require an alpha version
        run: node -e 'if (!/^\d+\.\d+\.\d+-alpha\./.test(require("./package.json").version)) throw new Error("Alpha workflow requires an alpha version; stable releases are published manually")'

      - name: Verify SDK
        run: npm run verify

      - name: Refuse existing version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published"
            exit 1
          fi

      - name: Publish alpha
        run: npm publish --tag alpha --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dependency health receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health
          path: ${{ runner.temp }}/dependency-health.json
          if-no-files-found: ignore
          retention-days: 14
