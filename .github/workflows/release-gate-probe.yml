name: Temporary 2.6.15 full release gate reproduction

on:
  pull_request:
    paths:
      - '.github/workflows/release-gate-probe.yml'
      - 'scripts/verify-public-packages.mjs'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Match release npm CLI
        run: npm install --global npm@^11.21.0
      - name: Install exact dependency graph
        run: npm ci
      - name: Install standalone dependencies
        run: |
          npm ci --prefix apps/cad-creator --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/local-studio --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/design-canvas --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/ecommerce-cms-agentsam --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/ecommerce-cms-agentsam/frontend --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agentsam-go-worker/runtime/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Run exact production release verification with failing-gate diagnostics
        run: npm run verify:release
