name: Import CAD Creator starter

on:
  push:
    branches:
      - feat/cad-creator-import

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK branch
        uses: actions/checkout@v4
        with:
          ref: feat/cad-creator-import
          fetch-depth: 0

      - name: Stop when import already exists
        id: guard
        shell: bash
        run: |
          if [ -d apps/cad-creator/backend ] && [ -f apps/cad-creator/agentsam.template.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone source CAD repo
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          rm -rf /tmp/AgentSamCadCreation
          git clone --depth=1 https://github.com/SamPrimeaux/AgentSamCadCreation.git /tmp/AgentSamCadCreation
          mkdir -p apps/cad-creator
          rsync -a --delete --exclude='.git' --exclude='node_modules' --exclude='dist' /tmp/AgentSamCadCreation/ apps/cad-creator/
          printf '%s\n' "$(git -C /tmp/AgentSamCadCreation rev-parse HEAD)" > apps/cad-creator/.agentsam-source-revision

      - name: Commit imported starter
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/cad-creator
          git commit -m "chore(cad): import AgentSamCadCreation starter"
          git push origin HEAD:feat/cad-creator-import
