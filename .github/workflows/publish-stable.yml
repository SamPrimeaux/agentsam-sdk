name: Publish AgentSam SDK stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact approved SDK train version
        required: true
        default: "2.6.13"

permissions:
  contents: read
  id-token: write

concurrency:
  group: agentsam-npm-stable
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout clean release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure npm and Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install exact dependency graph
        run: npm ci
      - name: Check approved release train
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'if(require("./package.json").version!==process.env.APPROVED_VERSION)throw Error("release_version_mismatch")'
          npm run release:train:check
          npm run release:registry:intent
          node scripts/sdk-release-publish.mjs --plan
      - name: Run release verification
        run: npm run verify:release
      - name: Clean-main publish preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release:publish:preflight
      - name: Publish pinned public dependencies and SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/sdk-release-publish.mjs --publish
      - name: Verify standalone packed SDK with published first-party dependencies
        run: AGENTSAM_REQUIRE_PUBLISHED_SDK=1 node --test test/integration/goap-packed-consumer.test.mjs
      - name: Reconcile Local Studio to newly published SDK integrity
        run: |
          npm install --package-lock-only --ignore-scripts --prefix apps/local-studio
          AGENTSAM_REQUIRE_PUBLISHED_SDK=1 node --test test/npm10-lock.test.mjs
      - name: Verify external npm consumer
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          npm view "@inneranimalmedia/agentsam-sdk@$APPROVED_VERSION" version
          mkdir -p "$RUNNER_TEMP/agentsam-consumer"
          cd "$RUNNER_TEMP/agentsam-consumer"
          npm init -y
          npm install "@inneranimalmedia/agentsam-sdk@$APPROVED_VERSION"
          node --input-type=module -e 'import("@inneranimalmedia/agentsam-sdk/cad-project-v2").then(m=>{if(m.CAD_PROJECT_V2!=="cad.project.v2")throw Error("cad_v2_export_missing");console.log("CAD_V2_INSTALLED_CONSUMER_PASS")})'
      - name: Install Ecommerce build dependencies
        run: |
          npm ci --prefix apps/ecommerce-cms-agentsam --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/ecommerce-cms-agentsam/frontend --ignore-scripts --no-audit --no-fund
      - name: Verify full Ecommerce CMS product
        run: npm --prefix apps/ecommerce-cms-agentsam run release:verify
      - name: Publish coordinated Ecommerce CMS product
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const root=require("./package.json"),product=require("./apps/ecommerce-cms-agentsam/package.json"); if(root.version!==process.env.APPROVED_VERSION||product.version!==root.version||product.private)throw Error("ecommerce_release_train_mismatch")'
          if npm view "@inneranimalmedia/ecommerce-cms-agentsam@$APPROVED_VERSION" version --fetch-retries=0 >/dev/null 2>&1; then
            echo "Ecommerce product already published at $APPROVED_VERSION"
          else
            npm publish --prefix apps/ecommerce-cms-agentsam --access public --provenance
          fi
          npm view "@inneranimalmedia/ecommerce-cms-agentsam@$APPROVED_VERSION" version
      - name: Verify Ecommerce CMS from a fresh npm installation
        env:
          APPROVED_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/ecommerce-consumer"
          cd "$RUNNER_TEMP/ecommerce-consumer"
          npm init -y
          npm install "@inneranimalmedia/ecommerce-cms-agentsam@$APPROVED_VERSION"
          node -e 'const p=require("@inneranimalmedia/ecommerce-cms-agentsam/manifest"); if(p.version!==process.env.APPROVED_VERSION||p.id!=="ecommerce-cms-agentsam") throw Error("ecommerce_manifest_mismatch");console.log("ECOMMERCE_CMS_NPM_MANIFEST_PASS")'
          test -f node_modules/@inneranimalmedia/ecommerce-cms-agentsam/dist/assets/admin/store.html
          test -f node_modules/@inneranimalmedia/ecommerce-cms-agentsam/dist/assets/admin/_spa/index.html
          echo "ECOMMERCE_FULL_ADMIN_NPM_INSTALL_PASS"
