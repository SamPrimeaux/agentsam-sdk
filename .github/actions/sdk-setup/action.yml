name: SDK setup
description: Node, Go, a clean npm install with transient-network retry, and the packaged portable contracts.
inputs:
  studio:
    description: Also install Local Studio runtime dependencies (needed by SDK integration tests).
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: npm

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: apps/agentsam-go-worker/runtime/go.mod
        cache: false

    - name: Install
      shell: bash
      run: |
        set -o pipefail
        # grpc-tools fetches its native protoc binary during installation.
        # Retry only actual network failures; never retry lockfile, auth,
        # registry-version, or deterministic package-script failures.
        for attempt in 1 2 3; do
          if npm ci 2>&1 | tee "$RUNNER_TEMP/npm-ci.log"; then
            exit 0
          fi
          if [[ "$attempt" -eq 3 ]] || ! grep -Eq 'ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND' "$RUNNER_TEMP/npm-ci.log"; then
            exit 1
          fi
          echo "Transient npm download failure; clean-install retry $((attempt + 1))/3"
          sleep "$((attempt * 5))"
        done

    - name: Build packaged portable contracts
      shell: bash
      run: npm run build:contracts

    # Canvas Work is hosted inside the standalone Local Studio workspace.
    # Its runtime imports the published SDK through that app's own lockfile,
    # not the root workspace dependency tree.
    - name: Install Studio runtime dependencies
      if: inputs.studio == 'true'
      shell: bash
      run: npm ci --prefix apps/local-studio --ignore-scripts --no-audit --no-fund
