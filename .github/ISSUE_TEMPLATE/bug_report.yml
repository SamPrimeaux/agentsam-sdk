name: "Bug — reproducible user journey"
description: "Report a regression or broken path with enough evidence to verify the repair."
title: "[Bug] "
body:
  - type: input
    id: surface
    attributes:
      label: "Affected application, interface, or operation"
      placeholder: "Product name + route or command, if known."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Start from the user's actual entry point."
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "Error messages, incorrect output, and relevant logs (redact credentials and personal data)."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior and user impact"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment and revision"
      description: "Version/SHA, OS, browser/runtime, local vs hosted, tenant scope when safe to share."
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence and regression references"
      description: "Links to tests, screenshots, videos or existing working paths. Never include secrets."
  - type: textarea
    id: acceptance
    attributes:
      label: "Repair acceptance"
      placeholder: |
        - [ ] Reproduction fails before the fix and passes afterward.
        - [ ] Permissions/error/recovery path verified.
        - [ ] Existing behavior unaffected.
        - [ ] The real installed/hosted entry point is retested.
    validations:
      required: true
