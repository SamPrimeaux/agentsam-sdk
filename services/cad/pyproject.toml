# Scoped Python quality tooling for AgentSam CAD services.
# Adapters under blender/ and freecad/ execute INSIDE those native runtimes;
# the stubs in typings/ exist so host-side checkers can resolve bpy/mathutils/
# FreeCAD/Part without installing substitute packages into a normal env.
[project]
name = "agentsam-cad-services"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["ty==0.0.88", "ruff==0.17.1"]

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# TRY004: adapters raise ValueError deliberately; callers map it to
# machine-readable failure results. Changing to TypeError would alter contracts.
# BLE001: broad handlers intentionally convert unexpected failures into
# structured {ok:false,error} responses; narrowing them would leak tracebacks.
"blender/adapter.py" = ["TRY004", "BLE001", "FURB192"]  # FURB192: min() would change empty-selection error type
"freecad/adapter.py" = ["TRY004", "BLE001", "I001"]  # I001: FreeCAD must import before Part (native load order)
"server.py" = ["TRY004", "BLE001"]
