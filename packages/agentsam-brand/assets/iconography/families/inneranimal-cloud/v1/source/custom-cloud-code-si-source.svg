<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t d">
  <title id="t">Cloud code symbol</title>
  <desc id="d">A solid cloud with code brackets and a slash cut out of it.</desc>
  <rect id="background" width="1024" height="1024" fill="var(--ia-icon-bg, #4fc414)"/>
  <g id="glyph" fill="var(--ia-icon-fg, #ffffff)" transform="translate(512 512) scale(1.15) translate(-512 -495)">
    <defs>
      <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
        <rect width="1024" height="1024" fill="#fff"/>
        <g fill="none" stroke="#000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
          <path d="M450 480 L400 530 L450 580"/>
          <path d="M574 480 L624 530 L574 580"/>
          <path d="M540 465 L484 595"/>
        </g>
      </mask>
    </defs>
    <g mask="url(#cut)">
      <rect x="290" y="560" width="460" height="100" rx="50"/>
      <circle cx="400" cy="500" r="100"/>
      <circle cx="540" cy="455" r="125"/>
      <circle cx="660" cy="520" r="90"/>
    </g>
  </g>
</svg>
