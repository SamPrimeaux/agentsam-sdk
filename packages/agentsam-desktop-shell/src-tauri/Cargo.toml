[package]
name = "agentsam-desktop-shell"
version = "0.1.0"
description = "Tauri desktop shell for AgentSam-powered brand dashboards"
authors = ["Sam Primeaux <sam@inneranimalmedia.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
reqwest = { version = "0.13", features = ["json"] }
hostname = "0.4"

[[bin]]
name = "agentsam-desktop-shell"
path = "src/main.rs"
