[package]
name = "agentsam-desktop-shell"
version = "0.1.0"
description = "Tauri desktop shell for AgentSam-powered brand dashboards"
authors = ["Inner Animal Media <sam@inneranimalmedia.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "form"] }
hostname = "0.4"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
serde_urlencoded = "0.7"
rfd = "0.15"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[[bin]]
name = "agentsam-desktop-shell"
path = "src/main.rs"
