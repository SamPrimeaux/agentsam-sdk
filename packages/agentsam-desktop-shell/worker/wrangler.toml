name = "agentsam-desktop-updates"
main = "src/index.js"
compatibility_date = "2026-09-19"

# Same D1 every other inneranimalmedia Worker binds to -- see
# inneranimalmedia/migrations/20260919_desktop_shell_releases.sql for
# the table this Worker reads/writes. No dedicated database: all
# current desktop-shell brands already run under this account, so a
# separate D1 bought no real isolation, just sprawl.
[[d1_databases]]
binding = "DB"
database_name = "inneranimalmedia-business"
database_id = "cf87b717-d4e2-4cf8-bab0-a81268e32d49"

# Set with: wrangler secret put UPDATE_PUBLISH_SECRET
# Bearer token required to POST new releases. Never commit a real value.
