name = "agentsam-desktop-updates"
main = "src/index.js"
compatibility_date = "2026-09-19"

# Same platform D1 used by the rest of AgentSam. The signed updater
# registry is intentionally fail-closed until its canonical schema is
# approved and migrated. Test-channel R2 downloads do not depend on it.
[[d1_databases]]
binding = "DB"
database_name = "inneranimalmedia-business"
database_id = "cf87b717-d4e2-4cf8-bab0-a81268e32d49"


[[r2_buckets]]
binding = "RELEASES"
bucket_name = "agent-sam"

# Set with: wrangler secret put UPDATE_PUBLISH_SECRET
# Bearer token required to POST new releases. Never commit a real value.
