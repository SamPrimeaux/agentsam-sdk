<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What can we help you do</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; background: #060808; font-family: 'Inter', system-ui, sans-serif; color: #FFFFFF">

<div style="position: absolute; left: 48px; top: 40px; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em">Inner Animal Media</div>
<a href="Onboarding.dc.html" style="position: absolute; right: 48px; top: 32px; height: 44px; padding: 0 24px; border-radius: 999px; background: #1B1E20; color: #FFFFFF; font-size: 16px; font-weight: 500; display: flex; align-items: center">Skip</a>

<div style="position: absolute; left: 0; right: 0; top: 168px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<h1 style="margin: 0; font-size: 40px; line-height: 48px; font-weight: 500; letter-spacing: -0.02em">What can we help you do?</h1>
<p style="margin: 0; font-size: 20px; line-height: 28px; color: #A1A1AA">Select all that apply. We'll tailor your setup.</p>
</div>

<div style="position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; align-items: flex-start; gap: 16px">
<a href="Checkout.dc.html" aria-label="Back" style="margin-top: 0; width: 56px; height: 56px; border-radius: 999px; background: #1B1E20; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>

<div style="width: 640px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 28px; color: #0A0A0A">
<div style="display: flex; flex-wrap: wrap; gap: 12px" role="group" aria-label="What you want to do">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font-size: 18px; font-weight: 400; display: flex; align-items: center; gap: 10px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg>{{c.label}}</button>
</sc-for>
</div>
<a href="Onboarding.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #0A0A0A; color: #FFFFFF; font-size: 16px; font-weight: 500">Continue</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: { site: true } };
}
renderVals() {
const s = this.state;
const defs = [['site', 'Build a website'], ['sell', 'Sell products'], ['agents', 'Run AI agents'], ['clients', 'Client dashboards'], ['digital', 'Sell digital products'], ['move', 'Move an existing site']];
return {
chips: defs.map(([id, label]) => {
const on = !!s.on[id];
return { label, on, bg: on ? '#0A0A0A' : '#F1F2F3', fg: on ? '#FFFFFF' : '#0A0A0A', icon: on ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 5v14M5 12h14', pick: () => this.setState({ on: { ...s.on, [id]: !on } }) };
})
};
}
}
</script>
</body>
</html>
