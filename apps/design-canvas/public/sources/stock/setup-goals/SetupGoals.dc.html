<html lang="en">
<head>
<meta charset="utf-8">
<title>What can we help you do</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#191919}
a{text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #191919; font-family: 'Inter', system-ui, sans-serif; color: #FFFFFF">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px clamp(16px, 3.4vw, 48px)">
<div style="font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em">Inner Animal Media</div>
<a href="Onboarding.dc.html" style="height: 44px; padding: 0 24px; border-radius: 999px; background: #2A2A2A; color: #FFFFFF; font-size: 16px; font-weight: 500; display: flex; align-items: center">Skip</a>
</div>

<div style="flex: 1 1 auto; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(24px, 5vw, 48px); padding: 24px clamp(16px, 4vw, 48px) 64px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<h1 style="margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.2; font-weight: 500; letter-spacing: -0.02em">What can we help you do?</h1>
<p style="margin: 0; font-size: clamp(16px, 2.4vw, 20px); line-height: 1.4; color: #ABABAB">Select all that apply. We'll tailor your setup.</p>
</div>

<div style="width: 100%; max-width: 736px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 16px">
<a href="Checkout.dc.html" aria-label="Back" style="flex: none; width: 56px; height: 56px; border-radius: 999px; background: #2A2A2A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>

<div style="flex: 1 1 320px; min-width: 0; max-width: 664px; box-sizing: border-box; background: #262626; border-radius: 28px; padding: clamp(20px, 4vw, 32px); display: flex; flex-direction: column; gap: 28px; color: #ECECEC">
<div style="display: flex; flex-wrap: wrap; gap: 12px" role="group" aria-label="What you want to do">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 52px; padding: 0 20px 0 16px; border: 0; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font-size: 16px; font-weight: 400; display: flex; align-items: center; gap: 10px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.label}}</button>
</sc-for>
</div>
<a href="Onboarding.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #238552; color: #FFFFFF; font-size: 16px; font-weight: 500">Continue</a>
</div>
</div>

</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: { site: true } };
}
renderVals() {
const s = this.state;
const defs = [['site', 'Build a website'], ['sell', 'Sell products'], ['agents', 'Run AI agents'], ['clients', 'Client dashboards'], ['digital', 'Sell digital products'], ['move', 'Move an existing site']];
return {
chips: defs.map(([id, label]) => {
const on = !!s.on[id];
return { label, on, bg: on ? '#238552' : '#303030', fg: on ? '#FFFFFF' : '#ECECEC', icon: on ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 5v14M5 12h14', pick: () => this.setState({ on: { ...s.on, [id]: !on } }) };
})
};
}
}
</script>
