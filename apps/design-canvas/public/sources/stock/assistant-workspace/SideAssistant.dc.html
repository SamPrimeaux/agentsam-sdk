<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side Assistant</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#191919}
button{font-family:inherit;color:inherit}
.hv:hover{background:var(--surface-2)}
.hv:focus-visible,.rz:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
textarea::placeholder{color:var(--text-faint)}
.rz:hover .ln,.rz:focus-visible .ln,.rz.drag .ln{background:var(--assistant-side-resize-hover);width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@media(max-width:1000px){.dock{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:var(--shadow-panel)}}
</style>
</helmet>
<div style="{{themeVars}} height: 100vh; min-height: 640px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif">

<sc-if value="{{showPage}}" hint-placeholder-val="{{ true }}">
<main style="flex: 1 1 0; min-width: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: {{pagePad}}; box-sizing: border-box; background-color: var(--canvas); background-image: radial-gradient(var(--canvas-dot) 1.2px, transparent 1.4px); background-size: 16px 16px">
<div style="width: 100%; max-width: {{pageMax}}; box-sizing: border-box; background: var(--chrome); border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--line)"><span style="font-weight: 600; font-size: 15px">Inner Animal Media</span><span style="font-size: 13px; color: var(--text-muted)">Plans · Apps · Docs</span></div>
<div style="padding: clamp(20px, 5vw, 48px) 24px; display: flex; flex-direction: column; gap: 14px"><div style="font-size: clamp(24px, 3.4vw, 36px); line-height: 1.12; font-weight: 500; letter-spacing: -0.02em; max-width: 520px">Build, deploy and run your agents</div><div style="font-size: 15px; line-height: 22px; color: var(--text-muted); max-width: 460px">One workspace for sites, stores and autonomous subagents.</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap"><span style="height: 44px; padding: 0 22px; border-radius: 999px; background: var(--action); color: var(--on-action); font-size: 14px; font-weight: 500; display: flex; align-items: center">Start free</span><span style="height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 14px; display: flex; align-items: center">See plans</span></div></div>
</div>
</main>
</sc-if>

<sc-if value="{{showLauncher}}" hint-placeholder-val="{{ false }}">
<button aria-label="Open AgentSam" onClick="{{openPanel}}" style="position: absolute; right: 20px; bottom: 20px; z-index: 25; width: 56px; height: 56px; border: 0; border-radius: 999px; background: var(--agent); color: var(--on-agent); box-shadow: var(--shadow-menu); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path></svg></button>
</sc-if>

<sc-if value="{{showPanel}}" hint-placeholder-val="{{ true }}">
<aside class="dock" aria-label="AgentSam" style="{{panelStyle}}">
<sc-if value="{{canResize}}" hint-placeholder-val="{{ true }}">
<div class="rz {{dragCls}}" role="separator" aria-orientation="vertical" aria-label="Resize assistant" aria-valuenow="{{width}}" aria-valuemin="320" aria-valuemax="560" tabindex="0" onMouseDown="{{startDrag}}" onKeyDown="{{onKey}}" style="position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 5; display: flex; justify-content: center"><span class="ln" style="width: 2px; height: 100%; background: transparent"></span></div>
</sc-if>
<sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="flex: none; height: 20px; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong)"></span></div></sc-if>

<header style="flex: none; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--assistant-side-header-border)">
<span style="width: 28px; height: 28px; border-radius: 999px; background: var(--agent); color: var(--on-agent); display: flex; align-items: center; justify-content: center; margin-right: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"></path></svg></span>
<span style="font-size: 15px; font-weight: 600; flex: 1 1 auto">AgentSam</span>
<button class="hv" aria-label="New thread" onClick="{{newThread}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
<button class="hv" aria-label="{{expandLabel}}" onClick="{{toggleExpand}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{expandIcon}}"></path></svg></button>
<button class="hv" aria-label="Collapse assistant" onClick="{{closePanel}}" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</header>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; background: var(--assistant-side-thread-surface); padding: 16px; display: flex; flex-direction: column; align-items: center">
<div style="width: 100%; max-width: {{threadMax}}; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{messages}}" as="m" hint-placeholder-count="3"><div style="align-self: {{m.align}}; max-width: 88%; box-sizing: border-box; padding: 10px 14px; border-radius: 16px; background: {{m.bg}}; font-size: 14px; line-height: 21px">{{m.text}}</div></sc-for>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 2px 4px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 13px; color: {{s.fg}}"><span style="color: {{s.ic}}; display: flex"><sc-if value="{{s.run}}" hint-placeholder-val="{{ false }}"><svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 019 9"></path></svg></sc-if><sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.500l4.500 4.500L19 7.500"></path></svg></sc-if></span>{{s.label}}</div></sc-for>
</div>
</div>
</div>

<div style="flex: none; padding: 0 12px calc(10px + var(--layout-assistant-sheet-safe-bottom, 0px)); display: flex; flex-direction: column; align-items: center">
<div style="width: 100%; max-width: {{threadMax}}">
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 2px"><sc-for list="{{ctx}}" as="c" hint-placeholder-count="3"><span style="height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); font-size: 12px; color: var(--text-muted); display: inline-flex; align-items: center">{{c.label}}</span></sc-for></div>
<div style="background: var(--assistant-side-composer-surface); border-radius: 20px; padding: 10px 10px 10px 14px; display: flex; align-items: flex-end; gap: 8px"><textarea aria-label="Message AgentSam" rows="1" placeholder="Work with AgentSam" value="{{draft}}" onInput="{{onDraft}}" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 15px; line-height: 22px; color: var(--text); padding: 10px 0"></textarea><button aria-label="Send" onClick="{{send}}" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 999px; background: {{sendBg}}; color: {{sendFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button></div>
<div style="padding-top: 8px; text-align: center; font-size: 12px; line-height: 16px; color: var(--text-faint)">AgentSam is AI and can make mistakes. Please double-check responses.</div>
</div>
</div>
</aside>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dev","light"],"default":"dev","section":"Theme"},"demo":{"editor":"enum","options":["docked","collapsed","mobile","workspace"],"default":"docked","section":"Presentation"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const demo = (props && props.demo) || 'docked';
this.state = { width: 360, open: demo !== 'collapsed', expanded: demo === 'workspace', drag: false, draft: '', sent: [], working: true };
}
renderVals() {
const s = this.state;
const set = (o) => this.setState(o);
const THEMES = {"dev": "--bg:#191919;--canvas:#141414;--canvas-dot:#2a2a2a;--chrome:#191919;--surface:#262626;--surface-2:#2a2a2a;--input:#303030;--line:#313131;--line-strong:#3a3a3a;--text:#ececec;--text-muted:#ababab;--text-faint:#8a8a8a;--brand:#238552;--brand-hover:#1f7a4b;--on-brand:#ffffff;--brand-text:#3dba7a;--brand-tint:#162a20;--brand-line:#2a5a40;--action:#238552;--action-hover:#1f7a4b;--on-action:#ffffff;--link:#3dba7a;--focus:#3dba7a;--select-tint:#162a20;--select-line:#2a5a40;--agent:#238552;--agent-hover:#1f7a4b;--on-agent:#ffffff;--agent-text:#3dba7a;--agent-tint:#162a20;--agent-line:#2a5a40;--danger:#ff8a80;--scrim:rgba(0,0,0,0.55);--semantic-surface-navigation:#191919;--semantic-text-primary:#ececec;--semantic-text-muted:#ababab;--semantic-border-default:#313131;--semantic-accent-primary:#238552;--semantic-action-primary:#238552;--assistant-shared-brand-foreground:#ececec;--assistant-shared-composer-send-background:#238552;--assistant-shared-composer-send-foreground:#ffffff;--assistant-shared-composer-send-disabled-background:#3a3a3a;--assistant-shared-composer-send-disabled-foreground:#8a8a8a;--assistant-shared-composer-control-hover:#1f7a4b;--assistant-shared-composer-mode-agent-accent:#3dba7a;--assistant-shared-composer-mode-agent-strong:#238552;--assistant-shared-composer-mode-plan-accent:#8aa8f0;--assistant-shared-composer-mode-plan-strong:#3f6fd1;--assistant-shared-composer-mode-debug-accent:#e0b255;--assistant-shared-composer-mode-debug-strong:#9a6208;--assistant-shared-composer-mode-ask-accent:#4fc3c8;--assistant-shared-composer-mode-ask-strong:#0f7f84;--assistant-shared-composer-mode-multitask-accent:#b88af4;--assistant-shared-composer-mode-multitask-strong:#8346e0;--assistant-shared-composer-mode-accent:#3dba7a;--assistant-shared-composer-mode-accent-strong:#238552;--assistant-mini-container-surface:#262626;--assistant-mini-container-raised:#2a2a2a;--assistant-mini-container-border:#3a3a3a;--assistant-mini-outline:#238552;--assistant-mini-breadcrumb-selected:#162a20;--assistant-mini-scope-selected:#262626;--assistant-mini-hint-background:#162a20;--assistant-mini-hint-border:#2a5a40;--assistant-mini-status-working:#162a20;--assistant-side-panel-surface:#191919;--assistant-side-panel-border:#313131;--assistant-side-thread-surface:#191919;--assistant-side-header-border:#313131;--assistant-side-composer-surface:#303030;--assistant-side-resize-hover:#2a5a40;--assistant-side-activity-done:#3dba7a;--assistant-workspace-canvas:#141414;--editor-assistant-target-line:#238552;--editor-assistant-target-tint:#162a20;--editor-assistant-overlay:rgba(0,0,0,0.55);--state-working:#238552;--state-success:#3dba7a;--state-error:#ff8a80;--state-listening:#238552;--state-selected:#162a20", "light": "--bg:#f4f5fa;--canvas:#fbfbfe;--canvas-dot:#d9dce8;--chrome:#ffffff;--surface:#ffffff;--surface-2:#f1f2f8;--input:#f1f2f8;--line:#e3e5ef;--line-strong:#c9ccdb;--text:#14161f;--text-muted:#5b6075;--text-faint:#6b7085;--brand:#238552;--brand-hover:#1d6f45;--on-brand:#ffffff;--brand-text:#1a7a49;--brand-tint:#e6f4ec;--brand-line:#a9d6bb;--action:#2f5bea;--action-hover:#2447c9;--on-action:#ffffff;--link:#2447c9;--focus:#2f5bea;--select-tint:#e8eeff;--select-line:#9db4f8;--agent:#238552;--agent-hover:#1d6f45;--on-agent:#ffffff;--agent-text:#1a7a49;--agent-tint:#e6f4ec;--agent-line:#a9d6bb;--danger:#c62828;--scrim:rgba(20,22,31,0.35);--semantic-surface-navigation:#ffffff;--semantic-text-primary:#14161f;--semantic-text-muted:#5b6075;--semantic-border-default:#e3e5ef;--semantic-accent-primary:#238552;--semantic-action-primary:#2f5bea;--assistant-shared-brand-foreground:#14161f;--assistant-shared-composer-send-background:#238552;--assistant-shared-composer-send-foreground:#ffffff;--assistant-shared-composer-send-disabled-background:#e3e5ef;--assistant-shared-composer-send-disabled-foreground:#6b7085;--assistant-shared-composer-control-hover:#1d6f45;--assistant-shared-composer-mode-agent-accent:#1a7a49;--assistant-shared-composer-mode-agent-strong:#238552;--assistant-shared-composer-mode-plan-accent:#2f5bea;--assistant-shared-composer-mode-plan-strong:#3f6fd1;--assistant-shared-composer-mode-debug-accent:#8a5a06;--assistant-shared-composer-mode-debug-strong:#9a6208;--assistant-shared-composer-mode-ask-accent:#0b6f74;--assistant-shared-composer-mode-ask-strong:#0f7f84;--assistant-shared-composer-mode-multitask-accent:#7f35c8;--assistant-shared-composer-mode-multitask-strong:#7a3fd0;--assistant-shared-composer-mode-accent:#1a7a49;--assistant-shared-composer-mode-accent-strong:#238552;--assistant-mini-container-surface:#ffffff;--assistant-mini-container-raised:#f1f2f8;--assistant-mini-container-border:#c9ccdb;--assistant-mini-outline:#238552;--assistant-mini-breadcrumb-selected:#e8eeff;--assistant-mini-scope-selected:#ffffff;--assistant-mini-hint-background:#e6f4ec;--assistant-mini-hint-border:#a9d6bb;--assistant-mini-status-working:#e6f4ec;--assistant-side-panel-surface:#ffffff;--assistant-side-panel-border:#e3e5ef;--assistant-side-thread-surface:#f4f5fa;--assistant-side-header-border:#e3e5ef;--assistant-side-composer-surface:#f1f2f8;--assistant-side-resize-hover:#a9d6bb;--assistant-side-activity-done:#1a7a49;--assistant-workspace-canvas:#fbfbfe;--editor-assistant-target-line:#238552;--editor-assistant-target-tint:#e6f4ec;--editor-assistant-overlay:rgba(20,22,31,0.35);--state-working:#238552;--state-success:#1a7a49;--state-error:#c62828;--state-listening:#2f5bea;--state-selected:#e8eeff"};
const demo = (this.props && this.props.demo) || 'docked';
const themeVars = THEMES[(this.props && this.props.theme) === 'light' ? 'light' : 'dev'];
const mobile = demo === 'mobile';
const clamp = (w) => Math.max(320, Math.min(560, w));
const startDrag = (e) => {
e.preventDefault();
const startX = e.clientX; const startW = s.width;
set({ drag: true });
const move = (ev) => this.setState({ width: clamp(startW + (startX - ev.clientX)) });
const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); this.setState({ drag: false }); };
window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
};
const send = () => { const t = s.draft.trim(); if (!t) return; set({ sent: [...s.sent, t], draft: '' }); };
const base = 'position:relative;box-sizing:border-box;display:flex;flex-direction:column;background:var(--assistant-side-panel-surface);color:var(--text);';
let panelStyle;
if (mobile) panelStyle = base + 'position:absolute;left:0;right:0;bottom:0;height:72%;z-index:20;border-radius:20px 20px 0 0;border-top:1px solid var(--assistant-side-panel-border);box-shadow:var(--shadow-menu);';
else if (s.expanded) panelStyle = base + 'flex:1 1 0;min-width:0;background:var(--assistant-workspace-canvas);';
else panelStyle = base + 'flex:none;width:' + s.width + 'px;max-width:92vw;border-left:1px solid var(--assistant-side-panel-border);';
const msgs = [
{ align: 'flex-end', text: 'Tighten the hero and match it to the theme.', bg: 'var(--surface-2)' },
{ align: 'flex-start', text: 'On it. I will keep the headline, reduce the vertical spacing, and use the theme tokens for the button.', bg: 'var(--surface)' },
...s.sent.flatMap((t) => [{ align: 'flex-end', text: t, bg: 'var(--surface-2)' }, { align: 'flex-start', text: 'Got it. Working on that now.', bg: 'var(--surface)' }])
];
const stepDefs = [['Read the page and theme tokens', 'done'], ['Adjusted hero spacing', 'done'], ['Updating the button style', 'run']];
const empty = !s.draft.trim();
return {
themeVars,
showPage: !s.expanded || mobile,
pagePad: mobile ? '16px' : '24px clamp(12px, 3vw, 32px)',
pageMax: mobile ? '390px' : '1100px',
showPanel: s.open, showLauncher: !s.open,
panelStyle,
canResize: !mobile && !s.expanded,
sheet: mobile,
dragCls: s.drag ? 'drag' : '', width: s.width,
startDrag,
onKey: (e) => { if (e.key === 'ArrowLeft') set({ width: clamp(s.width + 16) }); if (e.key === 'ArrowRight') set({ width: clamp(s.width - 16) }); },
newThread: () => set({ sent: [], draft: '' }),
toggleExpand: () => set({ expanded: !s.expanded }),
expandLabel: s.expanded ? 'Dock assistant' : 'Expand to workspace',
expandIcon: s.expanded ? 'M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7' : 'M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7',
closePanel: () => set({ open: false }), openPanel: () => set({ open: true }),
threadMax: s.expanded ? '760px' : '100%',
messages: msgs,
steps: stepDefs.map(([label, st]) => ({ label, run: st === 'run', done: st === 'done', fg: st === 'run' ? 'var(--text)' : 'var(--text-muted)', ic: st === 'run' ? 'var(--state-working)' : 'var(--assistant-side-activity-done)' })),
ctx: ['Page: Home', 'Selection: Hero', 'Theme tokens'].map((label) => ({ label })),
draft: s.draft, onDraft: (e) => set({ draft: e.target.value }), send,
sendBg: empty ? 'var(--assistant-shared-composer-send-disabled-background)' : 'var(--assistant-shared-composer-send-background)',
sendFg: empty ? 'var(--assistant-shared-composer-send-disabled-foreground)' : 'var(--assistant-shared-composer-send-foreground)'
};
}
}
</script>
</body>
</html>
