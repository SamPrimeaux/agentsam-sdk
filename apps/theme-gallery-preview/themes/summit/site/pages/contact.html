<body>
<div id="nav-container"></div>
<!-- Contact Page -->
<div class="page active" id="contact-page">
<div class="container">
<div class="section">
<div class="section-header">
<h2 class="section-title serif">Get in Touch</h2>
<p class="section-subtitle">
                        Ready to start your real estate journey in Alpine Region?
                    </p>
</div>
<div class="contact-content">
<div class="contact-info">
<div class="contact-item">
<div class="contact-icon">📧</div>
<div class="contact-details">
<h4>Email</h4>
<p>hello@summit.example</p>
</div>
</div>
<div class="contact-item">
<div class="contact-icon">📱</div>
<div class="contact-details">
<h4>Phone</h4>
<p>+81 070-7476-5362</p>
</div>
</div>
<div class="contact-item">
<div class="contact-icon">📍</div>
<div class="contact-details">
<h4>Location</h4>
<p>Alpine Region Prefecture, Japan</p>
<p style="font-size: 0.9rem; margin-top: 0.25rem;">長野県小諸市</p>
</div>
</div>
<div class="contact-item">
<div class="contact-icon">🏔️</div>
<div class="contact-details">
<h4>Service Areas</h4>
<p>Nozawa Onsen, Iiyama, Shinano, Myoko, Karuizawa</p>
</div>
</div>
</div>
<div class="contact-form">
<form id="contactForm" onsubmit="handleContactSubmit(event)">
<div class="form-group">
<label>Name</label>
<input id="name" required="" type="text"/>
</div>
<div class="form-group">
<label>Email</label>
<input id="email" required="" type="email"/>
</div>
<div class="form-group">
<label>Subject</label>
<input id="subject" required="" type="text"/>
</div>
<div class="form-group">
<label>Message</label>
<textarea id="message" required=""></textarea>
</div>
<button class="btn-primary" style="width: 100%;" type="submit">
                                Send Message
                            </button>
</form>
</div>
</div>
</div>
</div>
</div>
<div id="footer-container"></div>
<script src="../shared/layout.js"></script>
<script>
        async function handleContactSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;

            // TODO: Integrate with Resend API for email sending
            alert(`Thank you for your message, ${name}! Summit will get back to you soon at ${email}.`);

            document.getElementById('contactForm').reset();
        }

        async function loadComponents() {
            const navContainer = document.getElementById('nav-container');
            const footerContainer = document.getElementById('footer-container');

            try {
                const [navRes, footerRes] = await Promise.all([
                    fetch('/shared/nav.html'),
                    fetch('/shared/footer.html')
                ]);

                if (navRes.ok) navContainer.innerHTML = await navRes.text();
                if (footerRes.ok) footerContainer.innerHTML = await footerRes.text();
            } catch (error) {
                console.error('Error loading components:', error);
            }
        }

        loadComponents();
    </script>
</body>
</html>
