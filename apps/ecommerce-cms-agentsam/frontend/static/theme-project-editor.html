<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<title>Theme Draft — AgentSam CMS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f4f2}
#theme-project-editor-frame{display:block;width:100%;height:100%;border:0}
#theme-project-error{position:fixed;inset:12px 12px auto;z-index:10;max-width:760px;padding:12px 14px;border:1px solid #d99;border-radius:10px;background:#fff1f1;color:#761b1b;font:13px/1.5 system-ui;white-space:pre-wrap}
#theme-project-error[hidden]{display:none}
#theme-project-loading{position:fixed;inset:0;z-index:5;display:grid;grid-template:54px 1fr/300px 1fr;gap:8px;padding:8px;box-sizing:border-box;background:#f4f4f2}
#theme-project-loading span{border-radius:10px;background:linear-gradient(100deg,#e7e7e4,#fafaf8,#e7e7e4);background-size:200% 100%;animation:editor-loading 1.4s ease infinite}
#theme-project-loading span:first-child{grid-column:1/-1}
@keyframes editor-loading{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){#theme-project-loading span{animation:none}}
@media(max-width:680px){#theme-project-loading{grid-template-columns:80px 1fr}}
</style>
</head>
<body>
<div id="theme-project-loading" role="status" aria-label="Loading theme" aria-busy="true"><span></span><span></span><span></span></div>
<iframe id="theme-project-editor-frame" title="Theme Studio draft editor"></iframe>
<pre id="theme-project-error" role="alert" hidden></pre>
<script src="js/platform-stock-sections.js"></script>
<script type="module" src="js/theme-project-editor-bootstrap.mjs"></script>
</body>
</html>
