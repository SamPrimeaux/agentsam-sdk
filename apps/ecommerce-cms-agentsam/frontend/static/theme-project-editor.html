<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Opening Theme Studio</title>
</head>
<body>
  <p>Opening Theme Studio…</p>
  <script>
    (() => {
      const source = new URL(location.href);
      const query = source.searchParams;
      const siteId = query.get('site_id');
      const projectId = query.get('project') || query.get('project_id');
      if (query.get('new') === '1') {
        const target = new URL('/admin/theme-editor', location.origin);
        target.searchParams.set('new', '1');
        if (siteId) target.searchParams.set('site_id', siteId);
        location.replace(target.pathname + target.search);
        return;
      }
      if (!/^[A-Za-z0-9_-]{1,160}$/.test(siteId || '') || !/^[A-Za-z0-9_-]{1,160}$/.test(projectId || '')) {
        location.replace('/admin/store');
        return;
      }
      const page = query.get('page') || 'home';
      if (!/^[A-Za-z0-9_-]{1,160}$/.test(page)) {
        location.replace('/admin/store');
        return;
      }
      const target = new URL(`/admin/sites/${encodeURIComponent(siteId)}/themes/${encodeURIComponent(projectId)}/editor/${encodeURIComponent(page)}`, location.origin);
      for (const key of ['section', 'block', 'previewMode', 'stock', 'marketplace_kind', 'marketplace_key', 'showcase']) {
        const value = query.get(key);
        if (value) target.searchParams.set(key, value);
      }
      location.replace(target.pathname + target.search);
    })();
  </script>
</body>
</html>
