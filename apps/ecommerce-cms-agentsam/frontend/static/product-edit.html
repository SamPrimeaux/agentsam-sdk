const params = new URLSearchParams(location.search);
const productId = params.get("id");
const isNew = !productId;

let productSlug = "";
let dirty = false;
let saveInFlight = false;
let saveFailed = false;
let designContext = null;

let availableCollections = [];
let variantOriginals = new Map();
let variantCount = 0;
/** @type {{ id: number, url: string, filename?: string }[]} */

function slugify(text) {
  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function setDirty(next) {
  dirty = Boolean(next);
  const hint = document.getElementById("save-hint");
  const btn = document.getElementById("save-btn");
  const discard = document.getElementById("discard-btn");
  if (hint) {
    hint.textContent = saveInFlight ? "Saving…" : saveFailed ? "Save failed" :
      dirty ? "Unsaved changes" :
      isNew ? "Enter product details" : "All changes saved";
    hint.classList.toggle("is-dirty", dirty);
    hint.classList.toggle("is-error", saveFailed);
    hint.setAttribute("role", "status");
  }
  const canPublish = !isNew && document.getElementById("status-sidebar")?.value === "active" &&
    Boolean(designContext?.draft && designContext.draft.state !== "published");
  if (btn) {
    btn.disabled = (!dirty && !canPublish) || saveInFlight;
    btn.textContent = saveInFlight ? "Working…" : canPublish ? "Publish" : isNew ? "Create" : "Save";
    btn.classList.toggle("primary", canPublish || isNew);
    btn.classList.toggle("ghost", !canPublish && !isNew);
  }
  if (discard) discard.disabled = !dirty || saveInFlight;
  const publishButton = document.getElementById("publish-btn");
  if (publishButton) {
    publishButton.hidden = isNew || !designContext?.draft || designContext.draft.state === "published" ||
      document.getElementById("status-sidebar")?.value === "active";
    publishButton.disabled = saveInFlight;
  }
  const createProvider = document.getElementById("create-provider-product-btn");
  if (createProvider) {
    createProvider.disabled = dirty || saveInFlight ||
      !designContext?.draft?.prepared_media_asset_id ||
      Number(document.getElementById("price")?.value || 0) <= 0;
  }
  syncDockEdit();
}

/** Mirrors the sticky save bar into the mobile dock (admin-dock edit mode). Harmless when no dock is mounted. */
function syncDockEdit() {
  const hint = document.getElementById("save-hint");
  const btn = document.getElementById("save-btn");
  const detail = {
    active: true,
    // Short strings: the dock is ~294px wide on a 390pt phone.
    hint: isNew && !dirty ? "New product" : hint ? hint.textContent : "",
    dirty,
    canSave: Boolean(btn) && !btn.disabled,
    saveLabel: saveInFlight ? "Working…" : document.getElementById("save-btn")?.textContent || "Save",
    onSave: () => document.getElementById("save-btn")?.click(),
    discardHref: isNew ? "/admin/products" : location.pathname + location.search,
  };
  window.publishDockEdit?.(detail);
}

function imgNote(msg, kind) {
  const el = document.getElementById("img-note");
  if (!el) return;
  el.textContent = msg || "";
  el.className = "product-note" + (kind ? ` is-${kind}` : "");
  el.style.display = msg ? "block" : "none";
}

function showNote(msg, kind) {
  const el = document.getElementById("editor-action-note");
  if (!el) return;
  el.textContent = msg || "";
  el.className = "product-note product-editor-action-note" + (kind ? ` is-${kind}` : "");
  el.hidden = !msg;
  el.setAttribute("role", kind === "error" ? "alert" : "status");
  if (msg && kind === "error") {
    el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function statusBadge(status) {
  const cls =
    status === "active"
      ? "product-status-badge--active"
      : status === "archived"
        ? "product-status-badge--archived"
        : "product-status-badge--draft";
  return `<span class="product-status-badge ${cls}" id="status-badge">${status || "draft"}</span>`;
}

function updateHeaderTitle(title) {
  const h1 = document.getElementById("crumb-title");
  if (h1) h1.textContent = title || (isNew ? "New product" : "Product");
  document.title = (title || "Product") + " — Fuel & Free Time Admin";
}

function updateSeoPreview() {
  const title = document.getElementById("title")?.value.trim() || "Product title";
  const slug = document.getElementById("slug")?.value.trim() || slugify(title) || "product";
  const description = document.getElementById("description")?.value.trim() || "";
  const price = Number(document.getElementById("price")?.value || 0);
  const seoTitle = document.getElementById("seo-title-input")?.value.trim() || "";
  const seoDescription = document.getElementById("seo-description-input")?.value.trim() || "";
  document.getElementById("seo-title").textContent = seoTitle || title;
  document.getElementById("seo-url").textContent = location.origin + "/products/" + slug;
  document.getElementById("seo-desc").textContent =
    (seoDescription || description || (Number.isFinite(price) ? "$" + price.toFixed(2) + " USD" : "Product details")).slice(0, 320);
  document.getElementById("seo-title-count").textContent = seoTitle.length + " / 180";
  document.getElementById("seo-description-count").textContent = seoDescription.length + " / 320";
}

function syncStatusUi() {
  const status = document.getElementById("status-sidebar")?.value || "draft";
  const badge = document.getElementById("status-badge");
  if (badge) {
    badge.textContent = status;
    badge.className =
      "product-status-badge " +
      (status === "active"
        ? "product-status-badge--active"
        : status === "archived"
          ? "product-status-badge--archived"
          : "product-status-badge--draft");
  }
  const viewBtn = document.getElementById("view-btn");
  if (viewBtn && productSlug && status === "active") {
    viewBtn.href = `/products/${productSlug}`;
    viewBtn.style.visibility = "visible";
  } else if (viewBtn) {
    viewBtn.href = "#";
    viewBtn.style.visibility = isNew ? "hidden" : "visible";
  }
}

document.body.classList.add("console-body-bleed");

function bindDirtyFields() {
  ["title", "description", "seo-title-input", "seo-description-input", "collection", "price", "slug", "status-sidebar"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", () => {
      saveFailed = false;
      setDirty(true);
      updateSeoPreview();
      if (id === "status-sidebar") syncStatusUi();
    });
    el.addEventListener("change", () => {
      saveFailed = false;
      setDirty(true);
      updateSeoPreview();
      if (id === "status-sidebar") syncStatusUi();
    });
  });
  document.getElementById("title")?.addEventListener("input", () => {
    const slugEl = document.getElementById("slug");
    if (slugEl && !slugEl.dataset.manual) {
      slugEl.value = slugify(document.getElementById("title").value);
      updateSeoPreview();
    }
  });
  document.getElementById("slug")?.addEventListener("input", (e) => {
    e.target.dataset.manual = "1";
    updateSeoPreview();
  });
}

// ----- Media -----

function renderStagedGrid() {
  const grid = document.getElementById("staged-grid");
  if (!grid) return;
  if (!pendingImages.length) {
    grid.style.display = "none";
    grid.innerHTML = "";
    return;
  }
  grid.style.display = "grid";
  grid.innerHTML = pendingImages
    .map(
      (img, idx) => `
    <div class="product-media-staged-tile">
      <img src="${img.url}" alt="">
      <button type="button" data-staged-idx="${idx}" aria-label="Remove">×</button>
    </div>`
    )
    .join("");
  grid.querySelectorAll("[data-staged-idx]").forEach((btn) => {
    btn.addEventListener("click", () => {
      pendingImages.splice(Number(btn.dataset.stagedIdx), 1);
      renderStagedGrid();
      setDirty(true);
    });
  });
}

async function attachAssetsToProduct(assetIds) {
  for (const id of assetIds) {
    await adminFetch(`/api/admin/products/${productId}/images`, {
      method: "POST",
      body: JSON.stringify({ media_asset_id: id }),
    });
  }
}

async function openBrowseLibrary() {
  const picked = await openMediaPicker({
    title: "Attach product images",
    multi: true,
  });
  if (!picked?.length) return;

  if (isNew) {
    for (const a of picked) {
      if (!pendingImages.some((p) => p.id === a.id)) {
        pendingImages.push({ id: a.id, url: a.url, filename: a.filename });
      }
    }
    renderStagedGrid();
    setDirty(true);
    imgNote(`Added ${picked.length} image(s) — save product to attach.`, "success");
    return;
  }

  try {
    await attachAssetsToProduct(picked.map((a) => a.id));
    imgNote(`Attached ${picked.length} image(s).`, "success");
    loadImages();
  } catch (err) {
    imgNote(err.message, "error");
  }
}

function bindMediaToolbar() {
  document.getElementById("browse-library-btn")?.addEventListener("click", openBrowseLibrary);
  const fileInput = document.getElementById("file-input");
  document.getElementById("upload-images-btn")?.addEventListener("click", () => fileInput?.click());
  fileInput?.addEventListener("change", () => {
    if (fileInput.files?.length) uploadFiles(fileInput.files);
    fileInput.value = "";
  });
}

function renderMediaGrid(images) {
  const grid = document.getElementById("media-grid");
  if (!grid) return;

  if (isNew) {
    grid.innerHTML = pendingImages.length
      ? ""
      : `<div class="product-media-add" id="drop-zone" role="button" tabindex="0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Drop files to upload</span>
      <button type="button" class="product-media-browse-link" data-browse-drop>Browse library</button>
    </div>`;
    bindDropZone();
    return;
  }

  const tiles = (images || [])
    .map(
      (img) => `
    <div class="product-media-tile ${img.is_primary ? "is-primary" : ""}" data-asset-id="${img.id}">
      ${img.is_primary ? '<span class="primary-tag">Primary</span>' : ""}
      <img src="${img.url}" alt="${img.filename || ""}">
      <div class="tile-actions">
        ${img.is_primary ? "" : '<button type="button" class="btn ghost small set-primary-btn">Primary</button>'}
        <button type="button" class="btn danger small remove-btn">Remove</button>
      </div>
    </div>`
    )
    .join("");

  grid.innerHTML =
    tiles +
    `<div class="product-media-add" id="drop-zone" role="button" tabindex="0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Drop files to upload</span>
      <button type="button" class="product-media-browse-link" data-browse-drop>Browse library</button>
    </div>`;

  grid.querySelectorAll(".product-media-tile").forEach((tile) => {
    const assetId = tile.dataset.assetId;
    tile.querySelector(".set-primary-btn")?.addEventListener("click", async () => {
      await adminFetch(`/api/admin/products/${productId}/images/${assetId}/primary`, { method: "POST" });
      loadImages();
    });
    tile.querySelector(".remove-btn")?.addEventListener("click", async () => {
      await adminFetch(`/api/admin/products/${productId}/images/${assetId}`, { method: "DELETE" });
      loadImages();
    });
  });

  bindDropZone();
}

function bindDropZone() {
  const dropZone = document.getElementById("drop-zone");
  if (!dropZone || dropZone.dataset.bound) return;
  dropZone.dataset.bound = "1";

  const openUpload = () => document.getElementById("file-input")?.click();

  dropZone.addEventListener("click", (e) => {
    if (e.target.closest("[data-browse-drop]")) return;
    openUpload();
  });

  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openUpload();
    }
  });

  dropZone.querySelector("[data-browse-drop]")?.addEventListener("click", (e) => {
    e.stopPropagation();
    openBrowseLibrary();
  });

  ["dragenter", "dragover"].forEach((evt) =>
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.add("is-dragover");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-dragover");
      if (evt === "drop" && e.dataTransfer?.files?.length) uploadFiles(e.dataTransfer.files);
    })
  );
}

async function loadImages() {
  if (isNew) {
    renderStagedGrid();
    renderMediaGrid([]);
    return;
  }
  try {
    const d = await adminFetch(`/api/admin/products/${productId}/images`);
    renderMediaGrid(d.images);
  } catch (err) {
    document.getElementById("media-grid").innerHTML = `<p class="product-card-hint">${err.message}</p>`;
  }
}

async function uploadFiles(fileList) {
  const form = new FormData();
  for (const f of fileList) form.append("files", f);
  form.append("prefix", `products/${productSlug || slugify(document.getElementById("title")?.value || "misc")}/`);
  form.append("category", "product");
  form.append("folder", "products");

  try {
    const res = await fetch("/api/admin/media", {
      method: "POST",
      body: form,
      credentials: "include",
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Upload failed");

    if (isNew) {
      for (const asset of data.assets) {
        if (!pendingImages.some((p) => p.id === asset.id)) {
          pendingImages.push({ id: asset.id, url: asset.url, filename: asset.filename });
        }
      }
      renderStagedGrid();
      renderMediaGrid([]);
      setDirty(true);
      imgNote(`Uploaded ${data.assets.length} image(s) — save product to attach.`, "success");
      return;
    }

    await attachAssetsToProduct(data.assets.map((a) => a.id));
    imgNote(`Uploaded and attached ${data.assets.length} image(s).`, "success");
    loadImages();
  } catch (err) {
    imgNote(err.message, "error");
  }
}

function renderInventory(variants, supplierDraft = false) {
  const body = document.getElementById("inventory-body");
  // Supplier stock is not locally authoritative, even once SKUs have been mapped.
  // Hide the warehouse quantity table for supplier-backed products.
  const card = document.getElementById("inventory-card");
  if (card) card.hidden = Boolean(supplierDraft);
  if (!body) return;
  if (!variants.length) {
    body.innerHTML = supplierDraft
      ? '<tr><td colspan="4" class="pages-empty">Your selected sizes and colors are saved. Inventory is managed by the supplier after creation.</td></tr>'
      : '<tr><td colspan="4" class="pages-empty">No variants — inventory tracked when you add SKUs</td></tr>';
    return;
  }
  body.innerHTML = variants
    .map((v) => {
      const label = [v.size, v.color].filter(Boolean).join(" / ") || "Default";
      return `<tr>
        <td data-label="Location">Default</td>
        <td data-label="Variant">${label}</td>
        <td data-label="SKU">${v.sku}</td>
        <td data-label="Available">${v.inventory_qty}</td>
      </tr>`;
    })
    .join("");
}

// Supplier options are already selected in Studio. Before a provider product is
// created they are a read-only assortment preview, NOT local warehouse stock.
function renderSupplierSelection(container, selection) {
  if (!selection || !Array.isArray(selection.variants)) return;
  const heading = document.createElement("strong");
  heading.className = "product-supplier-selection-heading";
  heading.textContent = selection.selected_count + " variants selected in Product Studio";
  container.append(heading);
  const summary = document.createElement("p");
  summary.className = "product-card-hint";
  summary.textContent = [
    selection.sizes?.length ? selection.sizes.length + " sizes" : "",
    selection.colors?.length ? selection.colors.length + " colors" : ""
  ].filter(Boolean).join(" · ") + " · No manual SKU entry required.";
  container.append(summary);
  if (selection.unavailable_count) {
    const problem = document.createElement("p");
    problem.className = "product-note is-error";
    problem.textContent = selection.unavailable_count + " supplier combinations could not be resolved. Reopen Product Studio to reconcile them before creation.";
    container.append(problem);
  }
  const details = document.createElement("details");
  details.className = "product-supplier-selection-details";
  const summaryLabel = document.createElement("summary");
  summaryLabel.textContent = "View " + selection.variants.length + " size and color combinations";
  details.append(summaryLabel);
  const tableWrap = document.createElement("div");
  tableWrap.className = "product-supplier-selection-table-wrap";
  const table = document.createElement("table");
  table.className = "product-supplier-selection-table";
  const head = document.createElement("thead");
  const titleRow = document.createElement("tr");
  for (const label of ["Color", "Size", "Supplier SKU"]) {
    const th = document.createElement("th");
    th.textContent = label;
    titleRow.append(th);
  }
  head.append(titleRow);
  table.append(head);
  const body = document.createElement("tbody");
  for (const item of selection.variants) {
    const row = document.createElement("tr");
    for (const value of [item.color || "—", item.size || "—", item.provider_sku || "Unavailable"]) {
      const cell = document.createElement("td");
      cell.textContent = value;
      row.append(cell);
    }
    body.append(row);
  }
  table.append(body);
  tableWrap.append(table);
  details.append(tableWrap);
  container.append(details);
  const foot = document.createElement("p");
  foot.className = "product-card-hint";
  foot.textContent = "No manual variant or SKU entry needed.";
  container.append(foot);
}

function renderVariants(variants, supplierDraft = false, sellingSelection = null) {
  variantCount = variants.length;
  variantOriginals = new Map(variants.map((v) => [Number(v.id), {
    sku: v.sku || "", size: v.size || "", color: v.color || "",
    price_cents: v.price_cents == null ? null : Number(v.price_cents),
    inventory_qty: Number(v.inventory_qty || 0),
  }]));
  const empty = document.getElementById("variants-empty");
  const wrap = document.getElementById("variants-table-wrap");
  const form = document.getElementById("variant-form");
  const body = document.getElementById("variants-body");

  if (supplierDraft && variants.length) {
    // Supplier SKUs already exist and are mapped upstream. Never ask a merchant
    // to enter local warehouse quantities for 90 color/size combinations.
    wrap.style.display = "none";
    form.style.display = "none";
    empty.style.display = "block";
    empty.classList.add("has-supplier-selection");
    const sizes = [...new Set(variants.map(v => String(v.size || "").trim()).filter(Boolean))];
    const colors = [...new Set(variants.map(v => String(v.color || "").trim()).filter(Boolean))];
    const hint = empty.querySelector("p");
    if (hint) hint.textContent = "Your supplier assortment is linked. Stock is managed by Completeful.";
    const add = document.getElementById("show-variant-form");
    if (add) add.hidden = true;
    empty.querySelector(".product-supplier-selection")?.remove();
    const summary = document.createElement("div");
    summary.className = "product-supplier-selection";
    const heading = document.createElement("strong");
    heading.textContent = variants.length + " linked combinations";
    const detail = document.createElement("p");
    detail.textContent = [sizes.length ? sizes.length + " sizes" : "",
      colors.length ? colors.length + " colors" : ""].filter(Boolean).join(" · ") +
      " · No manual stock entry";
    summary.append(heading, detail);
    empty.append(summary);
    renderInventory([], true);
    return;
  }
  empty.classList.remove("has-supplier-selection");
  if (!variants.length) {
    empty.classList.toggle("has-supplier-selection", supplierDraft);
    empty.style.display = "block";
    wrap.style.display = "none";
    form.style.display = "none";
    const hint = empty.querySelector("p");
    const add = document.getElementById("show-variant-form");
    if (hint) hint.textContent = supplierDraft
      ? "Your selected supplier options are carried forward from Product Studio."
      : "Add options like size or color for separate SKUs and inventory.";
    if (add) add.hidden = supplierDraft;
    empty.querySelector(".product-supplier-selection")?.remove();
    if (supplierDraft) {
      const selectionRoot = document.createElement("div");
      selectionRoot.className = "product-supplier-selection";
      empty.append(selectionRoot);
      renderSupplierSelection(selectionRoot, sellingSelection);
    }
    renderInventory([], supplierDraft);
    return;
  }

  empty.style.display = "none";
  wrap.style.display = "block";
  form.style.display = "block";

  body.innerHTML = variants
    .map(
      (v) => `
    <tr data-id="${v.id}">
      <td data-label="SKU"><input class="v-sku" value="${v.sku}"></td>
      <td data-label="Size"><input class="v-size" value="${v.size || ""}"></td>
      <td data-label="Color"><input class="v-color" value="${v.color || ""}"></td>
      <td data-label="Price"><input class="v-price" type="number" step="0.01" value="${v.price_cents != null ? (v.price_cents / 100).toFixed(2) : ""}"></td>
      <td data-label="Qty"><input class="v-qty" type="number" value="${v.inventory_qty}"></td>
      <td class="v-actions">
        <button type="button" class="btn ghost small v-delete">Delete</button>
      </td>
    </tr>`
    )
    .join("");

  body.querySelectorAll("tr").forEach((row) => {
    const id = row.dataset.id;
    row.querySelectorAll(".v-sku, .v-size, .v-color, .v-price, .v-qty").forEach((input) => {
      input.addEventListener("input", () => {
        saveFailed = false;
        setDirty(true); // Top-right Save owns both product details and variant edits.
      });
    });
    row.querySelector(".v-delete").addEventListener("click", async () => {
      if (!confirm("Delete this variant?")) return;
      try {
        await adminFetch(`/api/admin/variants/${id}`, { method: "DELETE" });
        loadProduct();
      } catch (err) {
        variantNote(err.message, "error");
      }
    });
  });

  renderInventory(variants);
}

function renderCollections() {
  const container = document.getElementById("collections-list");
  if (!container) return;
  container.replaceChildren();
  if (!availableCollections.length) {
    const hint = document.createElement("p");
    hint.className = "product-card-hint";
    hint.textContent = "No collections yet. Create one below to organize products.";
    container.append(hint);
  }
  for (const collection of availableCollections) {
    const label = document.createElement("label");
    label.className = "product-collection-option";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selectedCollectionIds.has(Number(collection.id));
    checkbox.disabled = isNew;
    checkbox.value = String(collection.id);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) selectedCollectionIds.add(Number(collection.id));
      else selectedCollectionIds.delete(Number(collection.id));
      saveFailed = false;
      setDirty(true);
    });
    const name = document.createElement("span");
    name.textContent = collection.title;
    const status = document.createElement("small");
    status.textContent = collection.status === "active" ? "Published" : "Draft";
    label.append(checkbox, name, status);
    container.append(label);
  }
  document.getElementById("new-collection-btn").disabled = isNew;
}

async function loadCollections() {
  try {
    const { collections } = await adminFetch("/api/admin/collections");
    availableCollections = collections || [];
    renderCollections();
  } catch (error) {
    const container = document.getElementById("collections-list");
    if (container) container.textContent = "Could not load collections: " + error.message;
  }
}

function renderStudioDesign(draft, fulfillment, source = null, sellingSelection = null) {
  const card = document.getElementById("studio-design-card");
  const root = document.getElementById("studio-design-content");
  if (!card || !root) return;
  designContext = draft ? { draft, fulfillment } : null;
  card.hidden = isNew;
  root.replaceChildren();
  // Provider account integration is handled centrally. Product-specific
  // creation state must never be mislabeled as an API connection.
  if (source?.kind === "connected_provider" && fulfillment?.completeful_store_product_id) {
    const supplier = document.createElement("span");
    supplier.className = "product-design-status";
    supplier.textContent = "Completeful product ready";
    root.append(supplier);
  }
  if (!draft) {
    const guidance = document.createElement("p");
    guidance.className = "product-card-hint";
    guidance.textContent = "Add a design to make a custom product.";
    root.append(guidance);
    return;
  }


  if (!fulfillment?.completeful_store_product_id) {
    const selectionStatus = document.createElement("p");
    selectionStatus.className = "product-design-selection-summary";
    selectionStatus.textContent = sellingSelection
      ? sellingSelection.selected_count + " selected supplier variants saved · " +
        sellingSelection.resolved_count + " catalog options verified"
      : "Loading selected supplier options";
    root.append(selectionStatus);
    const explanation = document.createElement("p");
    explanation.className = "product-card-hint";
    explanation.textContent = draft.prepared_media_asset_id
      ? "Artwork ready. Set your price, then Publish to create the supplier product and storefront listing."
      : "Finish preparing your artwork in Product Studio, then return here to publish.";
    root.append(explanation);
  }
  const actions = document.createElement("div");
  actions.className = "product-design-actions";
  const edit = document.createElement("a");
  edit.className = "btn ghost small";
  edit.textContent = "Edit design";
  edit.href = "/admin/products/create/" + encodeURIComponent(draft.completeful_catalog_product_id) +
    "?resume=" + encodeURIComponent(draft.id);
  actions.append(edit);

  const linkId = fulfillment?.completeful_store_product_id;
  if (!linkId) {
    const create = document.createElement("button");
    create.type = "button";
    create.className = "btn ghost small";
    create.id = "create-provider-product-btn";
    create.textContent = "Create with Completeful";
    create.title = "Creates this product and your saved Studio variant selection in Completeful; does not publish.";
    const pending = document.createElement("p");
    pending.className = "product-card-hint product-design-next-action";
    pending.textContent = !draft.prepared_media_asset_id
      ? "Return to Product Studio to prepare artwork."
      : Number(document.getElementById("price")?.value || 0) <= 0
        ? "Enter a retail price to continue."
        : "You can create the supplier listing now, or select Active and Publish in one step.";
    actions.append(pending);
    create.addEventListener("click", async () => {
      if (dirty || saveInFlight) {
        showNote("Save product details before creating the supplier product.", "error");
        return;
      }
      if (!window.confirm("Create this product in your connected Completeful shop? This will not publish the storefront listing.")) return;
      create.disabled = true;
      create.textContent = "Creating product…";
      try {
        const result = await adminFetch(
          "/api/admin/product-studio/drafts/" + encodeURIComponent(draft.id) + "/create-product",
          { method: "POST" }
        );
        await loadProduct();
        showNote(result.already_linked ? "Supplier product already exists." :
          "Product created with Completeful. Storefront listing remains a draft.", "success");
      } catch (error) {
        showNote(error.message || "Could not create supplier product", "error");
        create.textContent = "Retry product creation";
        create.disabled = false;
      }
    });
    actions.append(create);
  }
  root.append(actions);
}

async function loadProduct() {
  if (isNew) {
    updateHeaderTitle("New product");
    updateSeoPreview();
    setDirty(false);
    loadImages();
    return;
  }

  try {
    const d = await adminFetch(`/api/admin/products/${productId}`);
    const p = d.product;
    document.getElementById("title").value = p.title;
    document.getElementById("slug").value = p.slug;
    document.getElementById("slug").dataset.manual = "1";
    productSlug = p.slug;
    document.getElementById("description").value = p.description || "";
    document.getElementById("seo-title-input").value = p.seo_title || "";
    document.getElementById("seo-description-input").value = p.seo_description || "";
    document.getElementById("collection").value = p.collection || "";
    document.getElementById("status-sidebar").value = p.status;
    document.getElementById("price").value = (p.price_cents / 100).toFixed(2);
    updateHeaderTitle(p.title);
    syncStatusUi();
    updateSeoPreview();
    renderVariants(d.variants, Boolean(d.design_draft?.completeful_catalog_product_id || d.fulfillment?.completeful_store_product_id), d.selling_selection);
    selectedCollectionIds = new Set((d.collection_ids || []).map(Number));
    renderCollections();
    renderStudioDesign(d.design_draft, d.fulfillment, d.source, d.selling_selection);
    loadImages();
    saveFailed = false;
    setDirty(false);

    const menuView = document.getElementById("menu-view");
    if (menuView && p.status === "active") menuView.href = `/products/${p.slug}`;
  } catch (err) {
    showNote(err.message, "error");
  }
}

function collectVariantChanges() {
  const changes = [];
  document.querySelectorAll("#variants-body tr[data-id]").forEach((row) => {
    const id = Number(row.dataset.id);
    const initial = variantOriginals.get(id);
    if (!initial) return;
    const rawPrice = row.querySelector(".v-price").value;
    const current = {
      sku: row.querySelector(".v-sku").value.trim(),
      size: row.querySelector(".v-size").value.trim(),
      color: row.querySelector(".v-color").value.trim(),
      price_cents: rawPrice ? Math.round(Number(rawPrice) * 100) : null,
      inventory_qty: Number(row.querySelector(".v-qty").value),
    };
    const patch = { id };
    for (const [key, value] of Object.entries(current)) {
      if (value !== initial[key]) patch[key] = value;
    }
    if (Object.keys(patch).length > 1) changes.push(patch);
  });
  return changes;
}

function updateVariantOriginals(changes) {
  for (const patch of changes) {
    const original = variantOriginals.get(Number(patch.id));
    if (original) Object.assign(original, patch);
  }
}

function collectPayload() {
  const priceVal = parseFloat(document.getElementById("price").value || "0");
  return {
    title: document.getElementById("title").value.trim(),
    slug: document.getElementById("slug").value.trim() || slugify(document.getElementById("title").value),
    description: document.getElementById("description").value.trim(),
    seo_title: document.getElementById("seo-title-input").value.trim(),
    seo_description: document.getElementById("seo-description-input").value.trim(),
    collection: document.getElementById("collection").value.trim(),
    collection_ids: [...selectedCollectionIds],
    variants: collectVariantChanges(),
    status: document.getElementById("status-sidebar").value,
    price_cents: Number.isFinite(priceVal) ? Math.round(priceVal * 100) : 0,
  };
}

async function saveProduct() {
  const payload = collectPayload();
  const publishSupplier = !isNew && payload.status === "active" &&
    Boolean(designContext?.draft && designContext.draft.state !== "published");
  const supplierDraftId = designContext?.draft?.id;
  // The local product details must be saved as a draft before provider creation.
  // Publication is explicit (Active → Publish) and is completed only after
  // supplier mapping and the server's storefront readiness checks both succeed.
  if (publishSupplier) payload.status = "draft";
  if (!payload.title) {
    showNote("Title is required.", "error");
    return;
  }

  if (publishSupplier && payload.price_cents <= 0) {
    showNote("Enter a retail price above $0 to publish.", "error");
    return;
  }
  if (publishSupplier && !designContext?.draft?.prepared_media_asset_id) {
    showNote("Finish preparing the artwork in Product Studio before publishing.", "error");
    return;
  }
  if (payload.status === "active" && !isNew && variantCount === 0 && !publishSupplier) {
    // Saving metadata is never blocked by a missing sellable option.
    // This applies to hats, accessories and other products with no size axis.
    showNote("Product details can be saved. Add a sellable option before customers can purchase.", "info");
  }

  // Keep changes made during an in-flight save unsaved until they persist.
  const saveSnapshot = JSON.stringify(payload);
  let detailsSaved = false;
  saveFailed = false;
  saveInFlight = true;
  setDirty(dirty);
  document.getElementById("save-btn").textContent = "Saving…";
  syncDockEdit();

  try {
    if (isNew) {
      const d = await adminFetch("/api/admin/products", { method: "POST", body: JSON.stringify(payload) });
      const newId = d.id;
      if (pendingImages.length) {
        const results = await Promise.allSettled(
          pendingImages.map((p) =>
            adminFetch(`/api/admin/products/${newId}/images`, {
              method: "POST",
              body: JSON.stringify({ media_asset_id: p.id }),
            })
          )
        );
        const failed = results.filter((r) => r.status === "rejected").length;
        if (failed) {
          showNote(`Product created, but ${failed} image(s) failed to attach.`, "error");
        }
      }
      window.location.href = `/admin/product-edit?id=${newId}`;
      return;
    }
    await adminFetch("/api/admin/products/" + productId, { method: "PUT", body: JSON.stringify(payload) });
    // Do not report success on an optimistic UI update; verify persisted fields.
    const verified = await adminFetch("/api/admin/products/" + productId);
    const stored = verified.product;
    if (!stored ||
      String(stored.title || "") !== payload.title ||
      String(stored.slug || "") !== payload.slug ||
      String(stored.description || "") !== payload.description ||
      String(stored.seo_title || "") !== payload.seo_title ||
      String(stored.seo_description || "") !== payload.seo_description ||
      String(stored.collection || "") !== payload.collection ||
      JSON.stringify((verified.collection_ids || []).map(Number).sort((a,b)=>a-b)) !==
        JSON.stringify(payload.collection_ids.slice().sort((a,b)=>a-b)) ||
      !payload.variants.every((patch) => {
        const row = (verified.variants || []).find((variant) => Number(variant.id) === patch.id);
        return row && Object.entries(patch).every(([field, value]) =>
          field === "id" || (value == null ? row[field] == null :
            String(row[field] ?? "") === String(value)));
      }) ||
      Number(stored.price_cents) !== payload.price_cents ||
      String(stored.status) !== payload.status) {
      throw new Error("Save did not verify against the stored product. Check the fields and retry.");
    }
    detailsSaved = true;
    if (publishSupplier) {
      showNote("Details saved. Checking your Completeful product…", "info");
      if (!verified.fulfillment?.completeful_store_product_id) {
        const result = await adminFetch(
          "/api/admin/product-studio/drafts/" + encodeURIComponent(supplierDraftId) + "/create-product",
          { method: "POST" }
        );
        const expected = Number(verified.selling_selection?.selected_count || 0);
        if (!result.already_linked && Number(result.mapped_variants) !== expected) {
          throw new Error("Completeful variant mapping is incomplete. Expected " + expected +
            " variants, received " + Number(result.mapped_variants || 0) + ".");
        }
      }
      const refreshed = await adminFetch("/api/admin/products/" + productId);
      if (!refreshed.fulfillment?.completeful_store_product_id) {
        throw new Error("Completeful did not return a linked supplier product.");
      }
      showNote("Supplier product ready. Checking the storefront listing…", "info");
      await adminFetch(
        "/api/admin/product-studio/drafts/" + encodeURIComponent(supplierDraftId) + "/publish",
        { method: "POST" }
      );
      const live = await adminFetch("/api/admin/products/" + productId);
      if (live.product?.status !== "active") {
        throw new Error("Storefront publication did not persist.");
      }
      await loadProduct();
      showNote("Published successfully with " + (live.variants?.length || 0) + " supplier variants.", "success");
      return;
    }
    productSlug = stored.slug;
    updateHeaderTitle(stored.title);
    updateSeoPreview();
    renderStudioDesign(verified.design_draft, verified.fulfillment, verified.source, verified.selling_selection);
    const additionalEdits = JSON.stringify(collectPayload()) !== saveSnapshot;
    updateVariantOriginals(payload.variants);
    setDirty(additionalEdits);
    syncStatusUi();
    showNote(additionalEdits ? "Earlier changes saved; newer edits still need saving." :
      "Product saved and verified.", "success");
  } catch (err) {
    if (publishSupplier && detailsSaved) {
      // The product details were persisted. Do not report them as unsaved merely
      // because a later provider operation or storefront publication failed.
      document.getElementById("status-sidebar").value = "draft";
      syncStatusUi();
      saveFailed = false;
      setDirty(JSON.stringify(collectPayload()) !== saveSnapshot);
      showNote("Saved as Draft. Publication couldn't finish: " + (err.message || "Unknown error") +
        ". Your artwork, price and selected supplier variants are retained. Retry Publish once the issue is resolved.", "error");
    } else {
      saveFailed = true;
      showNote(err.message, "error");
      setDirty(true);
    }
  } finally {
    saveInFlight = false;
    setDirty(dirty);
  }
}

document.getElementById("save-btn").addEventListener("click", () => saveProduct());
document.getElementById("publish-btn")?.addEventListener("click", () => {
  if (saveInFlight) return;
  document.getElementById("status-sidebar").value = "active";
  saveFailed = false;
  setDirty(true);
  syncStatusUi();
  saveProduct();
});
document.getElementById("discard-btn")?.addEventListener("click", async () => {
  if (!dirty || saveInFlight) return;
  if (!confirm("Discard unsaved changes and restore the last saved product details?")) return;
  saveFailed = false;
  if (isNew) {
    window.location.assign("/admin/products");
    return;
  }
  await loadProduct();
  showNote("Restored last saved product details.", "success");
});

document.getElementById("new-collection-btn")?.addEventListener("click", async () => {
  if (isNew) return;
  const input = document.getElementById("new-collection-name");
  const title = input.value.trim();
  if (!title) {
    showNote("Enter a collection name.", "error");
    return;
  }
  const button = document.getElementById("new-collection-btn");
  button.disabled = true;
  try {
    const { collection } = await adminFetch("/api/admin/collections", {
      method: "POST",
      body: JSON.stringify({
        title,
        status: document.getElementById("new-collection-status").value,
      }),
    });
    availableCollections.push(collection);
    selectedCollectionIds.add(Number(collection.id));
    input.value = "";
    saveFailed = false;
    renderCollections();
    setDirty(true);
    showNote("Collection created. Save product details to assign this product.", "success");
  } catch (error) {
    showNote(error.message || "Collection creation failed", "error");
  } finally {
    button.disabled = false;
  }
});

bindDirtyFields();
bindMediaToolbar();
loadCollections();
loadProduct();
</script>
</body>
</html>
