<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentSam — Fuel & Free Time Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/console.css">
<link rel="stylesheet" href="/admin/css/agentsam-page.css">
</head>
<body class="agentsam-page-body">
<script src="/admin/js/shell.js"></script>
<script>
renderShell("/admin/agentsam", `
  <div class="agentsam-page" id="agentsam-page" data-agent-view="chat">
    <div class="agentsam-page-view-switch" id="agentsam-view-switch" role="tablist" aria-label="Agent view">
      <button type="button" class="is-active" role="tab" aria-selected="true" data-agent-view-option="chat">Chat</button>
      <button type="button" role="tab" aria-selected="false" data-agent-view-option="work">Work</button>
    </div>
    <nav class="agentsam-mini-rail" aria-label="AgentSam navigation">
      <button type="button" data-mini-nav-action="new" aria-label="New conversation" title="New conversation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" data-mini-nav-panel="conversations" aria-label="Conversations" title="Conversations" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5 8 8 0 0 1-3.5-.8L4 20l1.4-4A7.5 7.5 0 1 1 20 11.5Z"/></svg></button>
      <button type="button" data-mini-nav-panel="workspace" aria-label="Workspace navigation" title="Workspace" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
    </nav>
    <aside class="agentsam-mini-panel" id="agentsam-mini-panel" aria-label="AgentSam navigation panel" hidden>
      <header class="agentsam-mini-panel-head"><h2 id="agentsam-mini-panel-title">Conversations</h2><button type="button" id="agentsam-mini-panel-close" aria-label="Close navigation panel" title="Close">×</button></header>
      <div class="agentsam-mini-panel-content" id="agentsam-mini-panel-content"></div>
    </aside>
    <div class="agentsam-page-main">
    <div class="agentsam-page-stage">
      <div class="agentsam-page-hero" id="agentsam-hero">
        <h1>Where should we begin?</h1>
      </div>
      <div class="agentsam-page-thread" id="agentsam-thread" role="log" aria-live="polite" hidden></div>
    </div>
    <div class="agentsam-page-dock">
      <div class="agentsam-page-composer-wrap">
        <form class="agentsam-page-composer" id="agentsam-page-form">
          <div class="agentsam-page-composer-main">
            <div class="agentsam-page-work-heading" id="agentsam-work-heading" hidden>
              <img src="/admin/brand/agentsam-gorilla/v1/ui/mini-composer-idle.svg" alt="" width="22" height="22" aria-hidden="true">
              <div><strong>Work with AgentSam</strong><span>Give a goal; keep project context and tools close.</span></div>
            </div>
            <div class="agentsam-page-compose-modes" id="agentsam-compose-modes" hidden></div>
            <div class="agentsam-page-attachments" id="agentsam-attachments" hidden></div>
            <textarea id="agentsam-page-input" rows="1" placeholder="Ask anything" autocomplete="off"></textarea>
            <div class="agentsam-page-bottom-bar">
              <div class="agentsam-page-bottom-left">
                <div class="agentsam-page-tools">
                  <button type="button" class="agentsam-page-plus" id="agentsam-plus" aria-expanded="false" aria-haspopup="menu" aria-controls="agentsam-tool-menu" aria-label="Tools and attachments">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  </button>
                  <input type="file" id="agentsam-file-input" hidden multiple accept="image/png,image/jpeg,image/webp,image/gif,.txt,.md,.csv,.json">
                </div>
                <div class="agentsam-page-coworker" aria-label="Current coworker: AgentSam" title="Current coworker: AgentSam">
                  <img src="${AGENT_TRIGGER_ICON}" data-agent-pet data-state="idle" alt="" width="20" height="20" aria-hidden="true">
                  <span>AgentSam</span>
                </div>
                <div class="agentsam-page-connection-pills" id="agentsam-connection-pills" hidden></div>
              </div>
              <button type="submit" class="agentsam-page-send" id="agentsam-page-send" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </form>
        <div class="agentsam-page-work-actions" id="agentsam-work-actions" hidden>
          <div class="agentsam-page-work-actions-group">
            <button type="button" data-work-action="files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2h5.5A2.5 2.5 0 0 1 20 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/></svg>Files</button>
            <button type="button" data-work-action="connections"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="12" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="m9.7 10.5 4.6-2M9.7 13.5l4.6 2"/></svg>Connections</button>
            <button type="button" data-work-action="workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>Workspace</button>
          </div>
          <span class="agentsam-page-work-context">Uses the current page and connected tools</span>
        </div>
        <div class="agentsam-page-menu" id="agentsam-tool-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-tool="attach">
            <span class="agentsam-page-menu-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span class="agentsam-page-menu-copy"><strong>Add photos &amp; files</strong><small>Upload images, documents, or data</small></span>
          </button>
          <button type="button" role="menuitem" data-tool="image" id="agentsam-menu-image">
            <span class="agentsam-page-menu-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="m6 17 4-4 3 3 2-2 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="agentsam-page-menu-copy"><strong data-menu-label>Create image</strong><small>Generate a new visual from a prompt</small></span>
          </button>
          <div class="agentsam-page-menu-divider"></div>
          <div class="agentsam-page-menu-label">Connections</div>
          <div id="agentsam-mcp-list"></div>
        </div>
      </div>
      <div class="agentsam-page-chips" id="agentsam-page-chips"></div>
    </div>
    </div>
    <div class="agentsam-tool-modal" id="agentsam-tool-modal" hidden>
      <div class="agentsam-tool-modal-backdrop" data-close-modal></div>
      <div class="agentsam-tool-modal-panel" role="dialog" aria-modal="true" aria-labelledby="agentsam-tool-modal-title">
        <header class="agentsam-tool-modal-head">
          <h2 id="agentsam-tool-modal-title">Tool call</h2>
          <button type="button" class="agentsam-tool-modal-close" data-close-modal aria-label="Close">&times;</button>
        </header>
        <div class="agentsam-tool-modal-body" id="agentsam-tool-modal-body"></div>
        <footer class="agentsam-tool-modal-foot">
          <button type="button" class="agentsam-tool-modal-copy" id="agentsam-tool-modal-copy">Copy</button>
          <button type="button" class="agentsam-tool-modal-close-btn" data-close-modal>Close</button>
        </footer>
      </div>
    </div>
  </div>
`, {
  fullBleed: true,
  onReady() {
    document.body.classList.add("agentsam-page-body");
    const topbar = document.querySelector(".console-topbar");
    const searchWrap = document.querySelector(".console-search-wrap");
    const actions = document.querySelector(".console-topbar-actions");
    const viewSwitch = document.getElementById("agentsam-view-switch");
    if (topbar && searchWrap && actions && viewSwitch) {
      topbar.classList.add("console-topbar--agentsam");
      const center = document.createElement("div");
      center.className = "console-topbar-center";
      center.appendChild(viewSwitch);
      topbar.appendChild(center);
      actions.insertBefore(searchWrap, actions.firstChild);
    }
    const toggle = document.getElementById("agentsam-toggle");
    if (toggle) {
      toggle.addEventListener("click", (e) => {
        if (location.pathname === "/admin/agentsam") {
          e.preventDefault();
          e.stopImmediatePropagation();
          document.getElementById("agentsam-page-input")?.focus();
        }
      }, true);
    }
    const s = document.createElement("script");
    s.src = "/admin/js/agentsam-page.js";
    document.body.appendChild(s);
  },
});
</script>
</body>
</html>
