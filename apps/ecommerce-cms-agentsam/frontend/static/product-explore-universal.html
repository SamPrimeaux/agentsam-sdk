<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Product — AgentSam SDK</title><link rel="stylesheet" href="/admin/css/admin.css"><link rel="stylesheet" href="/admin/css/console.css"></head><body><script src="/admin/js/shell.js"></script><script>
renderShell('/admin/products/create', `
<div style="max-width:1160px;margin:auto"><a href="/admin/products/create" style="font-size:12px">← Back to catalog</a>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);gap:clamp(30px,5vw,70px);margin-top:24px">
<div><div id="hero" style="background:#f9f9f8;min-height:390px;border-radius:15px;display:grid;place-items:center;color:#939d89;font-size:72px;font-weight:700">◈</div><div id="gallery" style="display:flex;gap:9px;margin-top:12px"></div></div>
<div><h1 id="name" style="font-size:clamp(28px,3vw,40px);letter-spacing:-.04em;line-height:1.12">Loading…</h1><p id="type" style="font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#888"></p><div id="version" style="padding:18px 0;border-bottom:1px solid #ddd;font-weight:700"></div><p style="margin:24px 0 8px;font-weight:700">Make it yours</p><p style="font-size:13px;color:#777;line-height:1.65">Start with this product, then configure its media, content, metadata and supported capabilities in one workspace.</p><a id="start" class="btn primary" style="display:block;text-align:center;margin:14px 0;padding:13px">Continue to product editor →</a><details style="border-top:1px solid #ddd;padding:16px 0"><summary>Product details & requirements</summary><div id="facts" style="font-size:12px;line-height:2;margin-top:12px"></div></details></div>
</div></div>`);
const id=decodeURIComponent(location.pathname.split('/').pop());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
fetch('/admin/registry/products-snapshot.json').then(r=>r.json()).then(d=>{const p=(d.items||[]).find(x=>x.id===id);if(!p)throw Error('Product not found');document.querySelector('#name').textContent=p.name;document.querySelector('#type').textContent=p.kind;document.querySelector('#version').textContent=p.version?'Version '+p.version:'Configuration available in editor';document.querySelector('#start').href='/admin/product-edit?id='+encodeURIComponent(id);document.querySelector('#facts').textContent=[p.package_name,p.canonical_path].filter(Boolean).join(' · ');let edits={};try{edits=JSON.parse(localStorage.getItem('iam:registry:product-edits:v1')||'{}')}catch{}const url=edits[id]?.previewUrl;if(url&&(url.startsWith('/admin/')||/^https:\/\/[^\s]+$/.test(url))){const img=document.createElement('img');img.src=url;img.alt=p.name;img.style.cssText='max-width:100%;max-height:390px;object-fit:contain';document.querySelector('#hero').replaceChildren(img)}else document.querySelector('#hero').textContent=p.kind==='theme'?'◫':p.kind==='app'?'▣':'◇';}).catch(e=>document.querySelector('#name').textContent=e.message);
</script></body></html>
