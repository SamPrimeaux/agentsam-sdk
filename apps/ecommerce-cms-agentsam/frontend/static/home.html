<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — Fuel & Free Time Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/console.css">
<link rel="stylesheet" href="/admin/css/home-workspace.css">
<script defer src="/admin/js/agent-composer-menu.js"></script>
<script defer src="/admin/js/home-workspace.js"></script>
</head>
<body>
<script src="/admin/js/shell.js"></script>
<script>
renderShell("/admin/home", `
  <div class="fnf-home">
    <section class="fnf-home-stage" aria-labelledby="fnf-home-heading">
      <div class="fnf-site-preview">
        <span class="fnf-site-preview__label">Your store <span aria-hidden="true">↗</span></span>
        <span class="fnf-site-preview__browser"><span class="fnf-site-preview__address">fuelnfreetime.com</span><span class="fnf-site-preview__browser-dots" aria-hidden="true">···</span></span>
        <span class="fnf-site-preview__viewport"><iframe src="/" title="Published Fuel & Free Time storefront preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></span>
        <span class="fnf-site-preview__hover">Customize Theme <span aria-hidden="true">↗</span></span>
        <a class="fnf-site-preview__link" href="/admin/theme-editor?slug=home" aria-label="Customize Theme" title="Customize Theme"></a>
      </div>
      <h1 id="fnf-home-heading">Your store is taking shape.<br>What would you like to work on next?</h1>
      <form id="home-agent-form" class="commerce-home-composer" aria-label="Ask AgentSam">
        <label class="commerce-home-composer__label" for="home-agent-input">Work with AgentSam</label>
        <textarea id="home-agent-input" rows="2" placeholder="Ask about your store or describe what you want to build" aria-label="Ask AgentSam about your store"></textarea>
        <div class="commerce-home-composer__bottom">
          <span class="commerce-home-composer__brand"><img src="/admin/brand/agentsam-mark.svg" alt=""> AgentSam</span>
          <span class="commerce-home-composer__controls">
            <button type="button" id="home-agent-open" class="commerce-home-composer__text-action" title="Continue in Side Assistant">Open chat</button>
            <button type="button" id="home-agent-plus" class="commerce-home-composer__icon-action" aria-label="Add files, resources, skills or apps" aria-haspopup="menu" aria-expanded="false">+</button>
            <button type="submit" id="home-agent-send" class="commerce-home-composer__send" aria-label="Send to AgentSam">↑</button>
          </span>
        </div>
        <div class="commerce-home-composer__attachments" id="home-agent-attachments" aria-live="polite"></div>
      </form>
      <div class="fnf-home-suggestions" aria-label="Suggestions for AgentSam">
        <button type="button" data-home-suggestion="Help me improve my storefront homepage">Plan my homepage</button>
        <button type="button" data-home-suggestion="Which products should I feature on my homepage based on my real catalog?">Feature products</button>
        <button type="button" data-home-suggestion="Summarize today's store activity using available live records">Review store activity</button>
        <button type="button" data-home-suggestion="Help me create a new homepage section. Show a proposal before applying anything.">Create a section</button>
        <button type="button" data-home-suggestion="What should I publish next based on our existing pages and products?">Plan my next update</button>
      </div>
    </section>

    <nav class="fnf-home-shortcuts" aria-label="Workspace shortcuts">
      <div class="fnf-home-shortcuts__heading"><h2>Quick access</h2><span>Continue where you left off</span></div>
      <div class="fnf-home-shortcuts__grid">
        <a href="/admin/theme-editor?slug=home"><strong>Customize theme</strong><span>Edit pages, sections and brand settings</span><span aria-hidden="true">↗</span></a>
        <a href="/admin/products"><strong>Products &amp; inventory</strong><span>Manage catalog, versions and inventory</span><span aria-hidden="true">↗</span></a>
        <a href="/admin/content"><strong>Content &amp; media</strong><span>Browse assets, collections and content</span><span aria-hidden="true">↗</span></a>
      </div>
    </nav>
    <section class="fnf-home-templates" aria-labelledby="home-templates-title">
      <div class="fnf-home-templates__heading"><div><h2 id="home-templates-title">Templates</h2><p>Choose a starting point for your next build.</p></div><div class="fnf-home-templates__nav"><button id="home-templates-back" type="button" aria-label="Previous templates">←</button><button id="home-templates-forward" type="button" aria-label="Next templates">→</button></div></div>
      <div class="fnf-home-templates__browse"><div class="fnf-home-templates__frame"><div class="fnf-home-templates__edge" data-template-scroll="-1" aria-hidden="true"></div><div class="fnf-home-templates__rail" id="home-templates-rail" role="group" aria-label="Creative templates"></div><div class="fnf-home-templates__edge fnf-home-templates__edge--right" data-template-scroll="1" aria-hidden="true"></div></div>
      <p id="home-templates-feedback" class="fnf-home-templates__feedback" role="status" aria-live="polite"></p>
    </section>
    <section class="fnf-home-discover" aria-labelledby="fnf-home-discover-title">
      <div class="fnf-home-discover__heading"><div><h2 id="fnf-home-discover-title">Explore products</h2><p>Start creating or find something to build on.</p></div><a href="/admin/products/create">Explore catalog <span aria-hidden="true">↗</span></a></div>
      <div class="fnf-home-discover__grid">
        <a class="fnf-home-discover__card fnf-home-discover__card--featured fnf-home-create-hero" href="/admin/products/create">
          <div class="fnf-home-create-hero__copy">
            <span class="fnf-home-create-hero__kicker">A little inspiration. Something entirely yours.</span>
            <h3>Create &amp; explore<br><em>your next idea.</em></h3>
            <p>Discover a product you love. Make it your own.<br>Bring your artwork, or start with a spark.</p>
            <span class="fnf-home-create-hero__action">Explore the catalog <span aria-hidden="true">→</span></span>
          </div>
          <div class="fnf-home-create-hero__scene" id="home-create-hero-scene" aria-hidden="true">
            <div class="fnf-home-create-hero__empty">GOOD IDEAS<br>START HERE.</div>
            <span class="fnf-home-create-hero__stamp">YOUR IDEAS.<br>REAL POSSIBILITIES.</span>
          </div>
        </a>
        <a class="fnf-home-discover__card fnf-home-discover__card--compact fnf-home-discover__card--experience" href="/admin/products/create">
          <div class="fnf-home-discover__copy"><span class="fnf-home-discover__overline">DIGITAL</span><h3>Digital experiences</h3><p>Craft interactive products, reusable systems and experiences with a purpose—not just another app.</p><span class="fnf-home-discover__action">Explore digital products <span aria-hidden="true">↗</span></span></div>
          <img class="fnf-home-discover__glass" src="/admin/assets/digital-experiences-glass.svg" alt="" loading="lazy" decoding="async">
        </a>
      </div>
    </section>
    <section class="fnf-home-operations" hidden aria-labelledby="fnf-home-operations-heading">
      <div class="fnf-home-operations__heading"><div><h2 id="fnf-home-operations-heading">Store activity</h2><p>Your live operations at a glance</p></div><a href="/admin/products">Manage products <span aria-hidden="true">↗</span></a></div>
      <div class="console-stat-grid" id="home-stats">
        <div class="console-stat-card"><div class="label">Products</div><div class="value">—</div></div>
        <div class="console-stat-card"><div class="label">Inventory units</div><div class="value">—</div></div>
        <div class="console-stat-card"><div class="label">Orders</div><div class="value">—</div></div>
        <div class="console-stat-card"><div class="label">Subscribers</div><div class="value">—</div></div>
      </div>

    </section>
  </div>
`);

(async function () {
  try {
    const d = await adminFetch("/api/admin/overview");
    const storeConfigured = Boolean(
      d?.store?.configured === true ||
      d?.store?.installed === true ||
      d?.store?.active_theme_id ||
      d?.store_configured === true ||
      d?.store_installed === true ||
      d?.active_theme_id
    );
    document.querySelector(".fnf-home-operations").hidden = !storeConfigured;
    if (!storeConfigured) return;
    const cards = document.querySelectorAll("#home-stats .value");
    cards[0].textContent = d.products;
    cards[1].textContent = d.inventory_units;
    cards[2].textContent = d.orders;
    cards[3].textContent = d.subscribers;
    if (d.low_stock_variants > 0) {
      cards[1].parentElement.querySelector(".label").textContent = "Inventory units (low stock)";
    }
  } catch (err) {
    console.error(err);
  }
})();
</script>
</body>
</html>
