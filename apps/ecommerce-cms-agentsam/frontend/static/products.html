<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Fuel & Free Time Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/console.css">
<link rel="stylesheet" href="/admin/css/product-edit.css">
</head>
<body>
<script src="/admin/js/shell.js"></script>
<script>
renderShell('/admin/products', `
  <div class="admin-toolbar">
    <div>
      <h1 class="admin-page-title">Products</h1>
      <p class="admin-page-sub">Manage catalog items, pricing, and status.</p>
    </div>
    <a href="/admin/products/create" class="btn primary">Product Studio</a>
  </div>

  <nav class="product-catalog-tabs" aria-label="Product views">
    <a class="btn ghost" href="/admin/products">Store products</a>
    <a class="btn ghost" href="/admin/products?view=collections">Collections</a>
    <a class="btn ghost" href="/admin/products?view=platform">Platform products</a>
  </nav>
  <section id="product-collections" hidden>
    <h2>Collections</h2><p>Organize your created products into collections. Add products from their product details.</p>
    <form id="create-collection" class="product-collection-create-form">
      <label>Collection name<input name="title" maxlength="120" required></label>
      <label>Description<textarea name="description" rows="2"></textarea></label>
      <button class="btn primary" type="submit">Create draft collection</button>
    </form>
    <p id="collections-status" role="status"></p><div id="collections-list" class="admin-card"></div>
  </section>
  <section id="platform-products" class="platform-catalog" hidden>
    <div class="platform-catalog-heading">
      <div>
        <p class="platform-eyebrow">DIGITAL PRODUCT LIBRARY</p>
        <h2>Platform products</h2>
        <p>Manage applications, templates, themes and reusable tools with the same catalog experience as your store products. Release versions remain managed by their release workflow.</p>
      </div>
      <span id="platform-product-count" class="platform-count" aria-live="polite"></span>
    </div>
    <div class="platform-catalog-controls">
      <label class="platform-search-label" for="platform-product-search">Search products
        <input type="search" id="platform-product-search" placeholder="Search name, package or collection…" autocomplete="off">
      </label>
      <label for="platform-product-kind">Product type
        <select id="platform-product-kind"><option value="all">All product types</option></select>
      </label>
      <label for="platform-product-collection">Collection
        <select id="platform-product-collection"><option value="all">All collections</option></select>
      </label>
    </div>
    <p id="platform-status" role="status" aria-live="polite"></p>
    <div id="platform-list" class="admin-card platform-catalog-card">
      <div class="platform-table-scroll">
        <table class="admin-table platform-product-table">
          <thead><tr><th>Product</th><th>Type</th><th>Collection</th><th>Status</th><th>Version</th><th><span class="platform-visually-hidden">Action</span></th></tr></thead>
          <tbody id="platform-products-body"><tr><td colspan="6" class="admin-empty">Loading products…</td></tr></tbody>
        </table>
      </div>
    </div>
    <form id="platform-product-editor" class="product-card platform-product-editor" hidden>
      <div class="platform-editor-header">
        <div>
          <p class="platform-eyebrow">PRODUCT DETAILS</p>
          <h3 id="platform-product-title">Edit product</h3>
          <p>Presentation details only. Package identity, repository provenance and release status stay with their authoritative systems.</p>
        </div>
        <button class="btn ghost" type="button" id="platform-editor-close">Close</button>
      </div>
      <div class="platform-editor-layout">
        <div class="platform-editor-visual">
          <div id="platform-editor-preview" class="platform-editor-preview" aria-label="Product image preview"></div>
          <p>Use an icon, product cover or verified R2/Cloudflare Images URL. This image appears in your catalog without changing the package.</p>
        </div>
        <div class="platform-editor-fields">
          <label>Product name<input name="name" type="text" maxlength="160" required></label>
          <label>Collection / grouping<input name="collection" type="text" maxlength="120" placeholder="e.g. Website Prebuilds"></label>
          <label>Icon or cover image URL<input name="thumbnail_url" type="url" maxlength="2048" placeholder="https://assets.example.com/products/cover.webp"></label>
          <label>Description<textarea name="description" maxlength="8000" rows="5" placeholder="What does this product help customers build or accomplish?"></textarea></label>
        </div>
      </div>
      <div class="platform-editor-actions">
        <span id="platform-editor-meta"></span>
        <button class="btn primary" type="submit">Save product details</button>
      </div>
    </form>
  </section>
  <div class="admin-card" id="store-products-table">
    <table class="admin-table">
      <thead><tr><th>Title</th><th>Collection</th><th>Price</th><th>Status</th><th>Variants</th><th>Inventory</th><th></th></tr></thead>
      <tbody id="products-body"><tr><td colspan="7" class="admin-empty">Loading…</td></tr></tbody>
    </table>
  </div>
`);

function escapeProduct(s) { return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }
function productThumb(p) {
  const url=p.thumbnail_url||p.image_url||p.primary_image_url||p.images?.[0]?.url;
  if(typeof url==='string' && (/^https:\/\/[^\s]+$/i.test(url)||url.startsWith('/admin/'))) return '<img src="'+escapeProduct(url)+'" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover">';
  return '<span style="font-size:11px;color:#aaa">—</span>';
}
function badgeFor(status) {
  return `<span class="badge">${escapeProduct(status || 'draft')}</span>`;
}

const productView = new URLSearchParams(location.search).get('view') || 'store';
document.querySelectorAll('.product-catalog-tabs a').forEach(link => {
  if ((new URL(link.href).searchParams.get('view') || 'store') === productView) link.setAttribute('aria-current', 'page');
});
(async function () {
  if (productView === 'collections' || productView === 'platform') {
    document.getElementById('store-products-table').hidden = true;
    document.getElementById(productView === 'collections' ? 'product-collections' : 'platform-products').hidden = false;
    return;
  }
  try {
    const d = await adminFetch('/api/admin/products');
    const body = document.getElementById('products-body');
    if (!d.products.length) {
      body.innerHTML = '<tr><td colspan="7" class="admin-empty">No products yet — create your first one.</td></tr>';
      return;
    }
    body.innerHTML = d.products.map(p => `
      <tr>
        <td><div style="display:flex;align-items:center;gap:10px"><span style="display:grid;place-items:center;width:38px;height:38px;flex:none;border:1px solid #e9e9e9;border-radius:5px;background:#f5f5f5;overflow:hidden">${productThumb(p)}</span><a href="/admin/product-edit?id=${encodeURIComponent(p.id)}">${escapeProduct(p.title)}</a></div></td>
        <td>${escapeProduct(p.collection || '—')}</td>
        <td>${centsToDollars(p.price_cents)}</td>
        <td>${badgeFor(p.status)}</td>
        <td>${p.variant_count}</td>
        <td>${p.total_inventory}${p.total_inventory <= 3 && p.variant_count > 0 ? ' <span class="badge low">low</span>' : ''}</td>
        <td><a href="/admin/product-edit?id=${p.id}" class="btn ghost small">Edit</a></td>
      </tr>
    `).join('');
  } catch (err) {
    const row = document.createElement('tr');
    const cell = document.createElement('td');
    cell.colSpan = 7; cell.className = 'admin-empty'; cell.setAttribute('role', 'alert');
    cell.textContent = 'Could not load products: ' + (err.message || 'Request failed') + '. Reload to retry.';
    row.appendChild(cell); document.getElementById('products-body').replaceChildren(row);
  }
})();

async function refreshCollections() {
  const status = document.getElementById('collections-status');
  status.textContent = 'Loading collections…';
  try {
    const data = await adminFetch('/api/admin/collections');
    const list = document.getElementById('collections-list'); list.replaceChildren();
    for (const item of data.collections || []) {
      const row = document.createElement('p');
      row.textContent = item.title + ' · ' + Number(item.product_count || 0) + ' products · ' + item.status;
      list.appendChild(row);
    }
    status.textContent = (data.collections || []).length ? '' : 'No collections yet. Create your first draft collection.';
  } catch (error) { status.textContent = error.message; }
}
document.getElementById('create-collection').addEventListener('submit', async event => {
  event.preventDefault(); const form = event.currentTarget; const button = form.querySelector('button');
  button.disabled = true;
  try {
    await adminFetch('/api/admin/collections', { method: 'POST', body: JSON.stringify({ title: form.elements.title.value, description: form.elements.description.value, status: 'draft' }) });
    form.reset(); await refreshCollections(); document.getElementById('collections-status').textContent = 'Draft collection saved.';
  } catch (error) { document.getElementById('collections-status').textContent = error.message; }
  finally { button.disabled = false; }
});
let platformItems = []; let editingPlatformProduct = null;
const platformKindLabels = {
  'app': 'Application', 'theme': 'Theme', 'sdk-package': 'SDK package',
  'ui-component': 'UI component', 'section': 'Section', 'block': 'Block',
  'integration': 'Integration', 'service': 'Service', 'product': 'Digital product',
  'collection': 'Collection', 'product-line': 'Product line', 'script': 'Script',
  'solution': 'Solution',
};
function platformKindLabel(value) {
  return platformKindLabels[value] || String(value || 'Product').replace(/-/g, ' ');
}
function safePlatformImage(value) {
  return typeof value === 'string' && (/^https:\/\/[^\s<>"']+$/i.test(value) || /^\/(?!\/)[^\s<>"']+$/.test(value));
}
function platformIcon(product, className) {
  const wrapper = document.createElement('span');
  wrapper.className = className;
  const image = product.thumbnail_url;
  if (safePlatformImage(image)) {
    const img = document.createElement('img');
    img.alt = ''; img.loading = 'lazy'; img.src = image;
    img.addEventListener('error', () => { wrapper.replaceChildren(platformInitials(product)); }, { once: true });
    wrapper.appendChild(img);
  } else {
    wrapper.appendChild(platformInitials(product));
  }
  return wrapper;
}
function platformInitials(product) {
  const initials = document.createElement('span');
  initials.className = 'platform-initials';
  initials.textContent = String(product.name || 'Product').split(/\s+/).slice(0, 2).map(word => word[0] || '').join('').toUpperCase();
  return initials;
}
function openPlatformProduct(product) {
  editingPlatformProduct = product;
  const form = document.getElementById('platform-product-editor');
  form.hidden = false;
  document.getElementById('platform-product-title').textContent = product.name;
  document.getElementById('platform-editor-preview').replaceChildren(platformIcon(product, 'platform-editor-icon'));
  document.getElementById('platform-editor-meta').textContent =
    [platformKindLabel(product.kind), product.status, product.version && ('v' + product.version)].filter(Boolean).join(' · ');
  for (const key of ['name', 'description', 'collection', 'thumbnail_url']) form.elements[key].value = product[key] || '';
  form.querySelector('[type="submit"]').disabled = !product.revision;
  form.scrollIntoView({ block: 'start', behavior: 'auto' });
  form.elements.name.focus({ preventScroll: true });
}
function renderPlatformProducts() {
  const search = document.getElementById('platform-product-search').value.trim().toLowerCase();
  const kind = document.getElementById('platform-product-kind').value;
  const visible = platformItems.filter(product => {
    if (kind !== 'all' && product.kind !== kind) return false;
    return !search || [product.name, product.slug, product.kind, product.package_name, product.collection, product.description]
      .some(value => String(value || '').toLowerCase().includes(search));
  });
  const tbody = document.getElementById('platform-products-body');
  tbody.replaceChildren();
  const count = document.getElementById('platform-product-count');
  count.textContent = visible.length + ' of ' + platformItems.length + ' products';
  if (!visible.length) {
    const row = tbody.insertRow();
    const cell = row.insertCell();
    cell.colSpan = 6; cell.className = 'admin-empty';
    cell.textContent = platformItems.length ? 'No products match these filters.' : 'No platform products are registered for this account.';
    return;
  }
  for (const product of visible) {
    const row = tbody.insertRow();
    const identityCell = row.insertCell();
    const identity = document.createElement('div');
    identity.className = 'platform-product-identity';
    identity.appendChild(platformIcon(product, 'platform-product-thumb'));
    const copy = document.createElement('div'); copy.className = 'platform-product-copy';
    const name = document.createElement('strong'); name.textContent = product.name;
    const subtitle = document.createElement('small'); subtitle.textContent = product.package_name || product.slug || '';
    copy.append(name, subtitle); identity.appendChild(copy); identityCell.appendChild(identity);
    const kindCell = row.insertCell(); kindCell.textContent = platformKindLabel(product.kind);
    const collectionCell = row.insertCell();
    collectionCell.textContent = product.collection || 'Unassigned';
    if (!product.collection) collectionCell.classList.add('platform-muted');
    const statusCell = row.insertCell();
    const statusBadge = document.createElement('span');
    statusBadge.className = 'platform-product-status platform-product-status--' +
      (['production','wired','scaffolded','prototype','deprecated'].includes(product.status) ? product.status : 'other');
    statusBadge.textContent = product.status || 'Registered';
    statusCell.appendChild(statusBadge);
    const versionCell = row.insertCell(); versionCell.textContent = product.version || '—';
    const actionCell = row.insertCell();
    const edit = document.createElement('button'); edit.type = 'button';
    edit.className = 'btn ghost small'; edit.textContent = 'Edit';
    edit.setAttribute('aria-label', 'Edit ' + product.name);
    edit.addEventListener('click', () => openPlatformProduct(product));
    actionCell.appendChild(edit);
  }
}
async function refreshPlatformProducts() {
  const status = document.getElementById('platform-status');
  status.textContent = 'Loading platform products…';
  try {
    const data = await adminFetch('/api/admin/platform/products');
    platformItems = Array.isArray(data.products) ? data.products : [];
    const select = document.getElementById('platform-product-kind');
    const previousKind = select.value;
    select.replaceChildren(new Option('All product types', 'all'));
    const kinds = [...new Set(platformItems.map(p => p.kind).filter(Boolean))].sort();
    for (const kind of kinds) select.add(new Option(platformKindLabel(kind), kind));
    select.value = kinds.includes(previousKind) ? previousKind : 'all';
    renderPlatformProducts();
    status.textContent = '';
  } catch (error) {
    document.getElementById('platform-product-count').textContent = '';
    const tbody = document.getElementById('platform-products-body');
    tbody.replaceChildren();
    status.textContent = 'Could not load platform products: ' + (error.message || 'Request failed');
  }
}
document.getElementById('platform-product-search').addEventListener('input', renderPlatformProducts);
document.getElementById('platform-product-kind').addEventListener('change', renderPlatformProducts);
document.getElementById('platform-editor-close').addEventListener('click', () => { document.getElementById('platform-product-editor').hidden = true; editingPlatformProduct = null; });
document.getElementById('platform-product-editor').addEventListener('submit', async event => {
  event.preventDefault(); if (!editingPlatformProduct) return;
  const form = event.currentTarget; const button = form.querySelector('[type="submit"]'); button.disabled = true;
  try {
    const input = { revision: editingPlatformProduct.revision };
    for (const key of ['name', 'description', 'collection', 'thumbnail_url']) input[key] = form.elements[key].value;
    await adminFetch('/api/admin/platform/products/' + encodeURIComponent(editingPlatformProduct.id), { method: 'PATCH', body: JSON.stringify(input) });
    form.hidden = true; editingPlatformProduct = null; await refreshPlatformProducts();
    document.getElementById('platform-status').textContent = 'Product details saved.';
  } catch (error) { document.getElementById('platform-status').textContent = error.message; }
  finally { button.disabled = false; }
});
if (productView === 'collections') void refreshCollections();
if (productView === 'platform') void refreshPlatformProducts();
</script>
</body>
</html>
