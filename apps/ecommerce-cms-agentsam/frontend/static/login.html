<!--
  Fuel & Free Time static admin login.
  Visual shell derived from @inneranimalmedia/agentsam-sdk packages/identity.
  Authentication authority intentionally remains POST /api/admin/login.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Fuel & Free Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --auth-bg: #050508;
            --auth-exit-overlay: #030308;
        }
        html {
            background-color: var(--auth-bg);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--auth-bg);
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        #globe-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        body.oauth-globe-exit #globe-canvas {
            z-index: 2;
        }

        .auth-layout {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            pointer-events: none;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top, 0px));
            padding-bottom: max(56px, calc(env(safe-area-inset-bottom, 0px) + 48px));
            box-sizing: border-box;
        }
        .auth-layout .login-card {
            pointer-events: auto;
        }

        .login-card {
            max-width: 380px;
            width: calc(100vw - 40px);
            padding: clamp(24px, 5vw, 36px) clamp(20px, 5vw, 32px);
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            position: relative;
            z-index: 10;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px;
        }

        .oauth-stack {
            margin: 20px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .signup-prompt {
            margin-top: 20px;
            font-size: 14px;
            color: #94A3B8;
        }

        .forgot-prompt {
            margin-top: 8px;
            font-size: 13px;
            color: #94A3B8;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }

        p.subtitle {
            font-size: 13px;
            color: #94A3B8;
            margin-bottom: 32px;
        }

        .input-group {
            width: 100%;
            position: relative;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 16px 14px 44px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .input-field:focus {
            border-color: rgba(0, 122, 255, 0.6);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748B;
            pointer-events: none;
        }

        .input-field:focus + .input-icon { color: #007AFF; }

        .input-wrap {
            position: relative;
            width: 100%;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748B;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-toggle:hover { color: #94A3B8; }
        .password-toggle svg { width: 18px; height: 18px; }

        .btn-primary {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border-radius: 14px;
            font-weight: 600;
            color: white;
            background: #007AFF;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .btn-primary:hover {
            background: #0062CC;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4);
        }

        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        .error-msg {
            color: #FF3B30;
            font-size: 12px;
            margin-top: 16px;
            text-align: center;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.2s;
            font-weight: 500;
        }

        .error-msg.visible { opacity: 1; }

        .transition-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--auth-exit-overlay);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease-out;
        }
        .transition-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .transition-overlay.animating {
            transition: none;
        }
        body.oauth-globe-exit .auth-min-footer,
        body.oauth-globe-exit .auth-layout .login-card {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .auth-min-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px 20px;
            padding: 10px 20px 14px;
            font-size: 12px;
            color: rgba(148, 163, 184, 0.88);
            background: linear-gradient(to top, rgba(5, 5, 8, 0.92) 0%, rgba(5, 5, 8, 0.55) 55%, transparent 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: auto;
        }

        .auth-min-footer a {
            color: rgba(186, 198, 214, 0.95);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-min-footer a:hover {
            color: #e2e8f0;
            text-decoration: underline;
        }

        .auth-min-footer-sep {
            opacity: 0.45;
            user-select: none;
        }

        /* Phone / short viewports — keep card clear of footer + status bar */
        @media (max-width: 480px), (max-height: 780px) {
            .auth-layout {
                padding: 12px 16px;
                padding-top: max(12px, env(safe-area-inset-top, 0px));
                padding-bottom: max(52px, calc(env(safe-area-inset-bottom, 0px) + 44px));
                align-items: center;
            }
            .login-card {
                max-width: 340px;
                width: min(100%, 340px);
                padding: 16px 18px 14px;
                border-radius: 16px;
            }
            .auth-logo {
                width: 64px;
                height: 64px;
                margin: 0 auto 10px;
            }
            h1 {
                font-size: 18px;
                margin-bottom: 2px;
            }
            p.subtitle {
                font-size: 12px;
                margin-bottom: 14px;
            }
            .input-group {
                margin-bottom: 10px;
            }
            .input-field {
                padding: 11px 14px 11px 40px;
                border-radius: 12px;
                font-size: 16px; /* avoid iOS zoom on focus */
            }
            .btn-primary {
                padding: 11px;
                margin-top: 4px;
                border-radius: 12px;
            }
            .oauth-stack {
                margin: 10px 0 6px;
                gap: 8px;
            }
            .oauth-stack .btn-primary {
                padding: 10px 16px !important;
                font-size: 13px !important;
            }
            .signup-prompt {
                margin-top: 10px !important;
                font-size: 13px !important;
            }
            .forgot-prompt {
                margin-top: 4px !important;
                font-size: 12px !important;
            }
            .error-msg {
                margin-top: 8px;
                min-height: 16px;
            }
            .auth-min-footer {
                gap: 8px 12px;
                padding: 8px 12px max(10px, env(safe-area-inset-bottom, 0px));
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
<canvas id="globe-canvas"></canvas>
<div id="transitionOverlay" class="transition-overlay" aria-hidden="true"></div>
<div class="auth-layout">
  <div class="login-card">
    <img class="auth-logo" src="https://fuelnfreetime.com/media/archive/shopify-import/logos/fandft-clear-background.png" alt="Fuel &amp; Free Time">
    <h1 data-company-tagline>Instant Access</h1>
    <p class="subtitle" data-company-subtitle="signin">Sign in to Fuel &amp; Free Time</p>
    <form id="loginForm" style="width:100%">
      <div class="input-group">
        <input type="email" id="email" class="input-field" placeholder="Email Address" required autocomplete="username">
        <span class="input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </span>
      </div>
      <div class="input-group">
        <div class="input-wrap">
          <input type="password" id="password" class="input-field" placeholder="Password" required autocomplete="current-password" style="padding-right:44px">
          <span class="input-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
            <svg id="passwordShowIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <svg id="passwordHideIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 4.2A10.5 10.5 0 0112 4c5 0 9.3 3.3 10.5 8a10.8 10.8 0 01-3 4.8M6.6 6.6A10.8 10.8 0 001.5 12c.7 2.8 2.6 5.1 5.1 6.5A10.7 10.7 0 0012 20c1.2 0 2.4-.2 3.4-.6"></path>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" id="submitBtn" class="btn-primary">Connect</button>
      <div id="errorMsg" class="error-msg" aria-live="polite"></div>
    </form>
  </div>
</div>
<footer class="auth-min-footer" aria-label="Fuel &amp; Free Time">
  <a href="/">Fuel &amp; Free Time</a><span class="auth-min-footer-sep">|</span>
  <a href="/privacy">Privacy</a><span class="auth-min-footer-sep">|</span>
  <a href="/terms">Terms</a><span class="auth-min-footer-sep">|</span>
  <a href="/contact">Contact</a>
</footer>
<script>
var passwordToggle = document.getElementById('passwordToggle');
var passwordInput = document.getElementById('password');
var passwordShowIcon = document.getElementById('passwordShowIcon');
var passwordHideIcon = document.getElementById('passwordHideIcon');

if (passwordToggle && passwordInput && passwordShowIcon && passwordHideIcon) {
  passwordToggle.addEventListener('click', function () {
    var showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    passwordToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    passwordShowIcon.style.display = showing ? 'block' : 'none';
    passwordHideIcon.style.display = showing ? 'none' : 'block';
  });
}

document.getElementById('loginForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  var button = document.getElementById('submitBtn');
  var error = document.getElementById('errorMsg');
  error.textContent = '';
  error.classList.remove('visible');
  button.disabled = true;
  button.textContent = 'Connecting...';
  try {
    var response = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      })
    });
    var data = await response.json().catch(function () { return {}; });
    if (!response.ok || !data.ok) throw new Error(data.error || 'Login failed');
    button.textContent = 'Success';
    button.style.background = '#10B981';
    if (typeof window.runGlobeExitTransition === 'function') {
      window.runGlobeExitTransition('/admin/home');
    } else {
      window.location.href = '/admin/home';
    }
  } catch (err) {
    error.textContent = err && err.message ? err.message : 'Login failed';
    error.classList.add('visible');
    button.disabled = false;
    button.textContent = 'Connect';
  }
});
</script>

<script>
(function() {
    var canvas = document.getElementById('globe-canvas');
    var transitionOverlay = document.getElementById('transitionOverlay');
    if (typeof THREE !== 'undefined') {
        var scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.0012);

        var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 35);

        var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: false, antialias: true, powerPreference: 'high-performance' });
        renderer.setClearColor(0x050508, 1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        var starGeo = new THREE.BufferGeometry();
        var starCount = 4000;
        var starPos = new Float32Array(starCount * 3);
        for (var i = 0; i < starCount; i++) {
            starPos[i * 3] = (Math.random() - 0.5) * 1200;
            starPos[i * 3 + 1] = (Math.random() - 0.5) * 1200;
            starPos[i * 3 + 2] = (Math.random() - 0.5) * 1200;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        var starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.9, sizeAttenuation: true });
        var stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        var globeGroup = new THREE.Group();
        globeGroup.position.set(0, 0, 0);
        scene.add(globeGroup);

        var glowGeo = new THREE.SphereGeometry(8.2, 48, 48);
        var glowMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9, transparent: true, opacity: 0.12 });
        globeGroup.add(new THREE.Mesh(glowGeo, glowMat));

        var wireGeo = new THREE.IcosahedronGeometry(8.5, 3);
        var wireMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.35 });
        globeGroup.add(new THREE.Mesh(wireGeo, wireMat));

        var pGeo = new THREE.BufferGeometry();
        var pCount = 1200;
        var pPos = new Float32Array(pCount * 3);
        var rad = 9;
        for (var i = 0; i < pCount; i++) {
            var phi = Math.acos(-1 + (2 * i) / pCount);
            var theta = Math.sqrt(pCount * Math.PI) * phi;
            pPos[i * 3] = rad * Math.cos(theta) * Math.sin(phi);
            pPos[i * 3 + 1] = rad * Math.sin(theta) * Math.sin(phi);
            pPos[i * 3 + 2] = rad * Math.cos(phi);
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        var pMat = new THREE.PointsMaterial({ color: 0x7dd3fc, size: 0.18, transparent: true, opacity: 0.95 });
        globeGroup.add(new THREE.Points(pGeo, pMat));

        var ringMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
        var ring1 = new THREE.Mesh(new THREE.TorusGeometry(12, 0.03, 8, 80), ringMat);
        ring1.rotation.x = Math.PI / 2.2;
        globeGroup.add(ring1);
        var ring2 = new THREE.Mesh(new THREE.TorusGeometry(15, 0.025, 8, 80), ringMat);
        ring2.rotation.x = Math.PI / 2.8;
        ring2.rotation.y = 0.3;
        globeGroup.add(ring2);
        var ring3 = new THREE.Mesh(new THREE.TorusGeometry(18, 0.02, 8, 80), ringMat);
        ring3.rotation.x = Math.PI / 3.5;
        ring3.rotation.y = -0.4;
        globeGroup.add(ring3);

        var animating = false;
        function animate() {
            requestAnimationFrame(animate);
            if (!animating) {
                globeGroup.rotation.y += 0.002;
                ring1.rotation.z -= 0.003;
                ring2.rotation.z += 0.002;
                ring3.rotation.z -= 0.0015;
                stars.rotation.y += 0.0001;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.runGlobeExitTransition = function(redirectUrl) {
            if (animating || !redirectUrl) return;
            animating = true;
            var start = performance.now();
            var duration = 2200;
            var camZ0 = 35;
            var camZ1 = -15;
            var globeScale0 = 1;
            var globeScale1 = 4.5;
            var fogDensity0 = 0.0012;
            var fogDensity1 = 0.028;
            if (transitionOverlay) {
                transitionOverlay.classList.add('animating');
                transitionOverlay.style.opacity = '0';
            }

            function tick(now) {
                var t = (now - start) / duration;
                if (t >= 1) {
                    if (transitionOverlay) {
                        transitionOverlay.style.opacity = '1';
                        transitionOverlay.classList.add('visible');
                    }
                    setTimeout(function() {
                        window.location.href = redirectUrl;
                    }, 260);
                    return;
                }
                var ease = 1 - Math.pow(1 - t, 1.6);
                camera.position.z = camZ0 + (camZ1 - camZ0) * ease;
                globeGroup.scale.setScalar(globeScale0 + (globeScale1 - globeScale0) * ease);
                globeGroup.rotation.y += 0.02;
                ring1.rotation.z -= 0.04;
                ring2.rotation.z += 0.03;
                ring3.rotation.z -= 0.025;
                stars.rotation.y += 0.002;
                stars.material.opacity = Math.max(0, 0.9 - t * 1.2);
                scene.fog.density = fogDensity0 + (fogDensity1 - fogDensity0) * ease;
                if (t > 0.7 && transitionOverlay) {
                    transitionOverlay.style.opacity = ((t - 0.7) / 0.3).toString();
                    transitionOverlay.classList.add('visible');
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        };

        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    } else {
        window.runGlobeExitTransition = function(url) { window.location.href = url; };
    }
})();
</script>
<script src="/admin/js/company-branding.js" defer></script>
</body>
</html>
