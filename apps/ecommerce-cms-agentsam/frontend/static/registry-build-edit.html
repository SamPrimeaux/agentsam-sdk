<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build — AgentSam SDK Commerce</title><link rel="stylesheet" href="/admin/css/admin.css"><link rel="stylesheet" href="/admin/css/console.css"></head><body>
<script src="/admin/js/shell.js"></script><script>
renderShell('/admin/products', `
<div class="admin-toolbar"><div><p class="admin-page-sub"><a href="/admin/products">Products</a> › Product catalog</p><h1 class="admin-page-title" id="build-title">Edit product</h1></div><div style="display:flex;gap:8px"><button id="save-build" class="btn primary">Save draft</button><button id="export-build" class="btn ghost">Export</button></div></div>
<div style="display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,.8fr);gap:16px;align-items:start">
<div>
<section class="admin-card" style="margin-bottom:16px"><h2>Product details</h2><div style="display:grid;gap:14px">
<label>Title<input id="b-name" style="display:block;width:100%;padding:9px;margin-top:6px"></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><label>SKU<input id="b-sku" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Kind<select id="b-kind" style="display:block;width:100%;padding:9px;margin-top:6px"><option>app</option><option>website</option><option>physical</option><option>ui-component</option><option>section</option><option>block</option><option>theme</option><option>sdk-package</option><option>integration</option><option>service</option><option>script</option><option>product</option><option>collection</option><option>solution</option></select></label></div>
<label>Collection / category<input id="b-collection" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Description<textarea id="b-description" style="display:block;width:100%;min-height:100px;padding:9px;margin-top:6px"></textarea></label><label>Tags<input id="b-tags" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Notes<textarea id="b-notes" style="display:block;width:100%;min-height:100px;padding:9px;margin-top:6px"></textarea></label>
</div></section>
<section class="admin-card" style="margin-bottom:16px"><h2>Search engine listing</h2><p class="admin-page-sub">Preview how this product will appear when published.</p><div id="seo-preview" style="border:1px solid #e8e8e8;border-radius:7px;padding:15px;margin:10px 0"><a href="#" id="seo-title-preview">Product title</a><p id="seo-desc-preview" style="font-size:12px"></p></div><label>SEO page title<input id="b-seo-title" maxlength="180" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Meta description<textarea id="b-seo-desc" maxlength="320" style="display:block;width:100%;min-height:80px;padding:9px;margin-top:6px"></textarea></label><label>URL handle<input id="b-handle" style="display:block;width:100%;padding:9px;margin-top:6px"></label></section><section class="admin-card"><h2>Source and version</h2><p id="b-source" style="white-space:pre-wrap;font-size:12px"></p><p class="admin-page-sub">Source and version apply to software products. Other product types may use different fulfillment, inventory and access records.</p></section>
</div><aside>
<section class="admin-card" style="margin-bottom:16px"><h2>Media</h2><div id="b-photo" style="aspect-ratio:4/3;display:grid;place-items:center;background:#f2f0f7;border:1px solid #ddd;border-radius:7px;margin-bottom:12px;font-weight:650;color:#665978">Preview not linked</div><label>Thumbnail asset URL<input id="b-image" style="display:block;width:100%;padding:9px;margin-top:6px" placeholder="/admin/... or https://..."></label><button id="b-apply" class="btn ghost" style="margin-top:10px">Preview</button></section>
<section class="admin-card"><h2>Organization</h2><p id="b-evidence" class="admin-page-sub"></p><p id="b-feedback" role="status" class="admin-page-sub">Local draft only. No D1 writes.</p></section>
</aside></div>
`);
const qs=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('id'),key='iam:registry:product-edits:v1';
const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};
let record;const sourceKind=['app','sdk-package','theme','service','ui-component','section','block','integration','script'];const prefix={app:'APP','ui-component':'CMP','sdk-package':'SDK',theme:'THM',website:'WEB',physical:'PHY',section:'SEC',block:'BLK',integration:'INT',service:'SVC',script:'TOOL'};
const photo=()=>{const url=qs('#b-image').value.trim(),el=qs('#b-photo');el.replaceChildren();if(url&&(url.startsWith('/admin/')||/^https:\/\/[^\s]+$/i.test(url))){const img=document.createElement('img');img.alt='Product thumbnail';img.style.cssText='width:100%;height:100%;object-fit:contain';img.onerror=()=>{el.textContent='Preview unavailable'};img.src=url;el.append(img)}else el.textContent='Preview not linked'};
fetch('/admin/registry/products-snapshot.json').then(r=>r.json()).then(data=>{const local=read()[id]||{};const fromSource=data.items.find(p=>p.id===id);if(!fromSource&&!id?.startsWith('draft_'))throw Error('Product not found');record=fromSource||{id,slug:id,name:local.name||'Untitled product',kind:local.kind||'product',status:'draft'};const draft=local;qs('#build-title').textContent=draft.name||record.name;qs('#b-name').value=draft.name||record.name;qs('#b-sku').value=draft.sku||('IAM-'+(prefix[record.kind]||'ITEM')+'-'+record.slug.toUpperCase().replace(/[^A-Z0-9]+/g,'-'));qs('#b-kind').value=draft.kind||record.kind;qs('#b-collection').value=draft.collection||'';qs('#b-tags').value=draft.tags||'';qs('#b-notes').value=draft.notes||'';qs('#b-description').value=draft.description||record.description||'';qs('#b-seo-title').value=draft.seoTitle||record.name;qs('#b-seo-desc').value=draft.seoDescription||'';qs('#b-handle').value=draft.handle||record.slug;qs('#b-image').value=draft.previewUrl||'';qs('#b-source').textContent=[record.repository_id,record.canonical_path,record.package_name,record.version].filter(Boolean).join(' · ')||'New draft — not yet registered';qs('#b-evidence').textContent=record.id+' · '+record.status+' (not deployment-verified)';photo();syncSeo()}).catch(e=>qs('#b-feedback').textContent=e.message);
const syncSeo=()=>{qs('#seo-title-preview').textContent=qs('#b-seo-title').value||qs('#b-name').value;qs('#seo-desc-preview').textContent=qs('#b-seo-desc').value||qs('#b-description').value};
['#b-seo-title','#b-seo-desc','#b-description','#b-name'].forEach(x=>qs(x).addEventListener('input',syncSeo));
qs('#b-apply').onclick=photo;
const proposal=()=>({name:qs('#b-name').value.trim(),sku:qs('#b-sku').value.trim(),kind:qs('#b-kind').value,collection:qs('#b-collection').value.trim(),tags:qs('#b-tags').value.trim(),notes:qs('#b-notes').value.trim(),description:qs('#b-description').value.trim(),seoTitle:qs('#b-seo-title').value.trim(),seoDescription:qs('#b-seo-desc').value.trim(),handle:qs('#b-handle').value.trim(),previewUrl:qs('#b-image').value.trim(),savedAt:new Date().toISOString()});
qs('#save-build').onclick=()=>{if(!record)return;const p=proposal();if(!/^[A-Z0-9]+(?:-[A-Z0-9]+)+$/.test(p.sku)){qs('#b-feedback').textContent='SKU requires uppercase hyphenated segments';return}try{const all=read();all[id]=p;localStorage.setItem(key,JSON.stringify(all));qs('#build-title').textContent=p.name;qs('#b-feedback').textContent='Saved locally. D1 unchanged.'}catch(e){qs('#b-feedback').textContent=e.message}};
qs('#export-build').onclick=()=>{if(!record)return;const data=JSON.stringify({source:record,proposal:proposal(),status:'pending_review'},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=record.slug+'-proposal.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
