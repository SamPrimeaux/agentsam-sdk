<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build — AgentSam SDK Commerce</title><link rel="stylesheet" href="/admin/css/admin.css"><link rel="stylesheet" href="/admin/css/console.css"><link rel="stylesheet" href="/admin/css/product-edit.css"><style>.product-editor .product-card,.product-editor .product-sidebar-card{margin-bottom:12px}.product-editor .product-card h3,.product-editor .product-sidebar-card h3{font-size:13px;margin:0 0 12px}.product-editor label{font-size:12px}.product-editor .admin-page-sub{font-size:11px;line-height:1.5}@media(max-width:860px){.product-editor-grid{grid-template-columns:1fr}}</style></head><body>
<script src="/admin/js/shell.js"></script><script>
renderShell('/admin/products', `
<div class="product-editor">
<div class="admin-toolbar"><div><p class="admin-page-sub"><a href="/admin/products">Products</a> › Product catalog</p><h1 class="admin-page-title" id="build-title">Edit product</h1></div><div style="display:flex;gap:8px"><button id="save-build" class="btn primary">Save draft</button><button id="export-build" class="btn ghost">Export</button></div></div>
<div class="product-editor-grid">
<div class="product-editor-main">
<section class="product-card" style="margin-bottom:16px"><h3>Product details</h3><div style="display:grid;gap:14px">
<label>Title<input id="b-name" style="display:block;width:100%;padding:9px;margin-top:6px"></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><label>SKU<input id="b-sku" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Kind<select id="b-kind" style="display:block;width:100%;padding:9px;margin-top:6px"><option>app</option><option>website</option><option>physical</option><option>ui-component</option><option>section</option><option>block</option><option>theme</option><option>sdk-package</option><option>integration</option><option>service</option><option>script</option><option>product</option><option>collection</option><option>solution</option></select></label></div>
<label>Collection / category<input id="b-collection" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Description<textarea id="b-description" style="display:block;width:100%;min-height:100px;padding:9px;margin-top:6px"></textarea></label><label>Tags<input id="b-tags" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Notes<textarea id="b-notes" style="display:block;width:100%;min-height:100px;padding:9px;margin-top:6px"></textarea></label>
</div></section>
<section class="product-card" style="margin-bottom:16px"><h3>Media</h3>
<p class="admin-page-sub">Product imagery, screenshots and installation previews.</p>
<div id="b-photo" style="aspect-ratio:4/3;display:grid;place-items:center;background:#f8f8f8;border:1px solid #ddd;border-radius:7px;margin-bottom:12px;overflow:hidden">No media assigned</div>
<div id="b-gallery" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px"></div>
<div style="display:flex;gap:8px"><button id="b-choose-icon" class="btn ghost" type="button">App icon</button><button id="b-choose-screen" class="btn ghost" type="button">Studio screen</button></div>
<div class="admin-page-sub" style="margin-top:10px">Media is linked by asset identity when the CMS provider is connected.</div>
<input id="b-image" type="hidden"></section>
<section class="product-card"><h3>Source and version</h3><p id="b-source" style="white-space:pre-wrap;font-size:12px"></p><p class="admin-page-sub">Source and version apply to software products. Other product types may use different fulfillment, inventory and access records.</p></section>
</div><aside class="product-editor-sidebar">
<section class="product-sidebar-card" style="margin-bottom:16px"><h3>Search engine listing</h3><p class="admin-page-sub">Preview how this product will appear when published.</p><div id="seo-preview" style="border:1px solid #e8e8e8;border-radius:7px;padding:15px;margin:10px 0"><a href="#" id="seo-title-preview">Product title</a><p id="seo-desc-preview" style="font-size:12px"></p></div><label>SEO page title<input id="b-seo-title" maxlength="180" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Meta description<textarea id="b-seo-desc" maxlength="320" style="display:block;width:100%;min-height:80px;padding:9px;margin-top:6px"></textarea></label><label>URL handle<input id="b-handle" style="display:block;width:100%;padding:9px;margin-top:6px"></label></section><section class="product-sidebar-card"><h3>Organization</h3><p id="b-evidence" class="admin-page-sub"></p><p id="b-feedback" role="status" class="admin-page-sub">Local draft only. No D1 writes.</p></section>
</aside></div></div>
`);
const qs=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('id'),key='iam:registry:product-edits:v1';
const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};
let record;const sourceKind=['app','sdk-package','theme','service','ui-component','section','block','integration','script'];const prefix={app:'APP','ui-component':'CMP','sdk-package':'SDK',theme:'THM',website:'WEB',physical:'PHY',section:'SEC',block:'BLK',integration:'INT',service:'SVC',script:'TOOL'};
const LOCAL_STUDIO_ID='prod_f7deb9f03c9429e4';
const studioAssets=[
 {id:'cf-image:9017b9cc-c5e7-4d48-e38f-456e9dd55100',role:'app-icon',label:'App icon',url:'https://imagedelivery.net/g7wf09fCONpnidkRnR_5vw/9017b9cc-c5e7-4d48-e38f-456e9dd55100/thumbnail'},
 {id:'cf-image:a39b5154-8b51-4efa-4b71-6a97a37ff900',role:'desktop-screenshot',label:'Local Studio · Dark',url:'https://imagedelivery.net/g7wf09fCONpnidkRnR_5vw/a39b5154-8b51-4efa-4b71-6a97a37ff900/medium'}
];
const mediaFor=()=>record?.id===LOCAL_STUDIO_ID?studioAssets:((read()[record?.id]?.media||[]));
let activeMedia=1;
function photo(){
 const gallery=qs('#b-gallery'),main=qs('#b-photo'),assets=mediaFor();gallery.replaceChildren();main.replaceChildren();
 if(!assets.length){main.textContent='No media assigned';return}
 activeMedia=Math.min(activeMedia,assets.length-1);
 const selected=assets[activeMedia],img=document.createElement('img');img.src=selected.url;img.alt=selected.label;img.style.cssText='width:100%;height:100%;object-fit:contain';main.append(img);
 assets.forEach((asset,i)=>{const btn=document.createElement('button');btn.type='button';btn.title=asset.label;btn.setAttribute('aria-label',asset.label);btn.style.cssText='width:58px;height:58px;background:#f7f7f7;border:1px solid '+(i===activeMedia?'#6c82c4':'#ddd')+';border-radius:5px;overflow:hidden;padding:3px;cursor:pointer';const thumb=document.createElement('img');thumb.src=asset.url;thumb.alt='';thumb.style.cssText='width:100%;height:100%;object-fit:contain';btn.append(thumb);btn.onclick=()=>{activeMedia=i;photo()};gallery.append(btn)})
}
qs('#b-choose-icon').onclick=()=>{activeMedia=0;photo()};
qs('#b-choose-screen').onclick=()=>{activeMedia=1;photo()};
fetch('/admin/registry/products-snapshot.json').then(r=>r.json()).then(data=>{const local=read()[id]||{};const fromSource=data.items.find(p=>p.id===id);if(!fromSource&&!id?.startsWith('draft_'))throw Error('Product not found');record=fromSource||{id,slug:id,name:local.name||'Untitled product',kind:local.kind||'product',status:'draft'};const draft=local;qs('#build-title').textContent=draft.name||record.name;qs('#b-name').value=draft.name||record.name;qs('#b-sku').value=draft.sku||('IAM-'+(prefix[record.kind]||'ITEM')+'-'+record.slug.toUpperCase().replace(/[^A-Z0-9]+/g,'-'));qs('#b-kind').value=draft.kind||record.kind;qs('#b-collection').value=draft.collection||(record.id===LOCAL_STUDIO_ID?'Applications':'');qs('#b-tags').value=draft.tags||(record.id===LOCAL_STUDIO_ID?'desktop, developer-workspace, files, terminal, workbench, agentsam-sdk':'');qs('#b-notes').value=draft.notes||'';qs('#b-description').value=draft.description||(record.id===LOCAL_STUDIO_ID?'AgentSam Local Studio is a desktop workspace for working with AgentSam SDK. Explore projects, files, terminal sessions, goals, and developer workflows in a unified interface.':'')||record.description||'';qs('#b-seo-title').value=draft.seoTitle||(record.id===LOCAL_STUDIO_ID?'AgentSam Local Studio | Desktop Developer Workspace':record.name);qs('#b-seo-desc').value=draft.seoDescription||(record.id===LOCAL_STUDIO_ID?'Explore AgentSam Local Studio, a desktop workspace integrating projects, files, terminal sessions and developer tools with AgentSam SDK.':'');qs('#b-handle').value=draft.handle||record.slug;qs('#b-image').value=draft.previewUrl||'';qs('#b-source').textContent=[record.repository_id,record.canonical_path,record.package_name,record.version].filter(Boolean).join(' · ')||'New draft — not yet registered';qs('#b-evidence').textContent=record.id+' · '+record.status+' (not deployment-verified)';photo();syncSeo()}).catch(e=>qs('#b-feedback').textContent=e.message);
const syncSeo=()=>{qs('#seo-title-preview').textContent=qs('#b-seo-title').value||qs('#b-name').value;qs('#seo-desc-preview').textContent=qs('#b-seo-desc').value||qs('#b-description').value};
['#b-seo-title','#b-seo-desc','#b-description','#b-name'].forEach(x=>qs(x).addEventListener('input',syncSeo));

const proposal=()=>({name:qs('#b-name').value.trim(),sku:qs('#b-sku').value.trim(),kind:qs('#b-kind').value,collection:qs('#b-collection').value.trim(),tags:qs('#b-tags').value.trim(),notes:qs('#b-notes').value.trim(),description:qs('#b-description').value.trim(),seoTitle:qs('#b-seo-title').value.trim(),seoDescription:qs('#b-seo-desc').value.trim(),handle:qs('#b-handle').value.trim(),previewUrl:qs('#b-image').value.trim(),media:mediaFor(),savedAt:new Date().toISOString()});
qs('#save-build').onclick=()=>{if(!record)return;const p=proposal();if(!/^[A-Z0-9]+(?:-[A-Z0-9]+)+$/.test(p.sku)){qs('#b-feedback').textContent='SKU requires uppercase hyphenated segments';return}try{const all=read();all[id]=p;localStorage.setItem(key,JSON.stringify(all));qs('#build-title').textContent=p.name;qs('#b-feedback').textContent='Saved locally. D1 unchanged.'}catch(e){qs('#b-feedback').textContent=e.message}};
qs('#export-build').onclick=()=>{if(!record)return;const data=JSON.stringify({source:record,proposal:proposal(),status:'pending_review'},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=record.slug+'-proposal.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
