<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build — AgentSam SDK Commerce</title><link rel="stylesheet" href="/admin/css/admin.css"><link rel="stylesheet" href="/admin/css/console.css"><link rel="stylesheet" href="/admin/css/product-edit.css"><style>.product-editor .product-card,.product-editor .product-sidebar-card{margin-bottom:12px}.product-editor .product-card h3,.product-editor .product-sidebar-card h3{font-size:13px;margin:0 0 12px}.product-editor label{font-size:12px}.product-editor .admin-page-sub{font-size:11px;line-height:1.5}@media(max-width:860px){.product-editor-grid{grid-template-columns:1fr}}</style></head><body>
<script src="/admin/js/shell.js"></script><script>
renderShell('/admin/products', `
<div class="product-editor">
<header class="product-editor-top"><div class="product-editor-crumb"><a href="/admin/products">Products</a><span>›</span><h1 id="build-title">Edit product</h1><span class="product-status-badge product-status-badge--draft">Draft</span></div><div class="product-editor-top-actions"><button type="button" class="btn ghost small" id="discard-build">Discard</button><button id="save-build" class="btn ghost small">Save</button><button type="button" class="btn ghost small" id="view-build">View</button><button id="export-build" class="btn ghost small">More actions</button></div></header>
<div class="product-editor-grid">
<div class="product-editor-main">
<section class="product-card"><label for="b-name">Title</label><input id="b-name" type="text"></section><section class="product-card"><label for="b-description">Description</label><textarea id="b-description" rows="5"></textarea></section>
<section class="product-card"><h3>Media</h3>
<div style="display:flex;gap:8px;margin:10px 0"><button type="button" class="btn primary small" id="b-choose-screen">Browse library</button><button type="button" class="btn ghost small" id="b-choose-icon">Upload new</button></div>
<div style="display:flex;align-items:start;gap:10px;flex-wrap:wrap"><div id="b-gallery" class="product-media-grid" style="display:flex;gap:9px;flex-wrap:wrap"></div><button type="button" class="product-media-upload-tile" id="b-add-media" style="display:grid;place-items:center;width:112px;height:118px;border:1px dashed #c5c5c5;background:#fff;border-radius:6px;font-size:11px;color:#666">＋<span>Browse library</span></button></div>
<div id="b-photo" hidden></div>

<input id="b-image" type="hidden"></section>
<section class="product-card"><label for="b-collection">Category</label><select id="b-collection"><option value="">Select category</option><option value="Applications">Applications</option><option value="Apparel">Apparel</option><option value="Accessories">Accessories</option><option value="Automations">Automations</option><option value="Templates">Templates</option></select></section><section class="product-card"><div class="product-card-head"><label>Collections</label><small>A product can belong to several</small></div><div id="b-collections-list"></div><button type="button" class="btn ghost small" id="b-add-collection" style="margin-top:10px">+ Add collection</button><div id="b-collection-create" hidden style="margin-top:10px"><input id="b-new-collection" aria-label="Collection name" placeholder="Collection name"><select id="b-new-collection-kind" style="margin-top:8px"><option value="manual">Manual collection</option><option value="smart">Smart collection</option></select><button type="button" id="b-create-collection" class="btn ghost small" style="margin-top:8px">Create</button></div></section><section class="product-card"><label for="b-tags">Tags</label><input id="b-tags" type="text"></section><section class="product-card"><label for="b-notes">Notes</label><textarea id="b-notes" rows="3"></textarea></section><section class="product-card"><label>Source and version</label><p id="b-source" style="font-size:12px;overflow-wrap:anywhere"></p></section>
</div><aside class="product-editor-sidebar">
<section class="product-sidebar-card"><h3>Search engine listing</h3><p class="admin-page-sub">Preview how this product will appear when published.</p><div id="seo-preview" style="border:1px solid #e8e8e8;border-radius:7px;padding:15px;margin:10px 0"><a href="#" id="seo-title-preview">Product title</a><p id="seo-desc-preview" style="font-size:12px"></p></div><label>SEO page title<input id="b-seo-title" maxlength="180" style="display:block;width:100%;padding:9px;margin-top:6px"></label><label>Meta description<textarea id="b-seo-desc" maxlength="320" style="display:block;width:100%;min-height:80px;padding:9px;margin-top:6px"></textarea></label><label>URL handle<input id="b-handle" style="display:block;width:100%;padding:9px;margin-top:6px"></label></section><section class="product-sidebar-card"><h3>Organization</h3><p id="b-evidence" class="admin-page-sub"></p><p id="b-feedback" role="status" class="admin-page-sub">Local draft only. No D1 writes.</p><label for="b-sku" style="display:block;margin:10px 0 5px">SKU</label><input id="b-sku" type="text" style="width:100%"><label for="b-kind" style="display:block;margin:10px 0 5px">Product type</label><select id="b-kind" style="width:100%"><option>app</option><option>website</option><option>physical</option><option>ui-component</option><option>section</option><option>block</option><option>theme</option><option>sdk-package</option><option>integration</option><option>service</option><option>script</option><option>product</option><option>collection</option><option>solution</option></select></section>
</aside></div></div>
`);
const qs=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('id'),key='iam:registry:product-edits:v1';
const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};
let selectedCollections=[];
let record;const sourceKind=['app','sdk-package','theme','service','ui-component','section','block','integration','script'];const prefix={app:'APP','ui-component':'CMP','sdk-package':'SDK',theme:'THM',website:'WEB',physical:'PHY',section:'SEC',block:'BLK',integration:'INT',service:'SVC',script:'TOOL'};
const LOCAL_STUDIO_ID='prod_f7deb9f03c9429e4';
const studioAssets=[
 {id:'cf-image:9017b9cc-c5e7-4d48-e38f-456e9dd55100',role:'app-icon',label:'App icon',url:'https://imagedelivery.net/g7wf09fCONpnidkRnR_5vw/9017b9cc-c5e7-4d48-e38f-456e9dd55100/thumbnail'},
 {id:'cf-image:a39b5154-8b51-4efa-4b71-6a97a37ff900',role:'desktop-screenshot',label:'Local Studio · Dark',url:'https://imagedelivery.net/g7wf09fCONpnidkRnR_5vw/a39b5154-8b51-4efa-4b71-6a97a37ff900/medium'}
];
const mediaFor=()=>record?.id===LOCAL_STUDIO_ID?studioAssets:((read()[record?.id]?.media||[]));
let activeMedia=0;
function photo(){
 const gallery=qs('#b-gallery'),main=qs('#b-photo'),assets=mediaFor();gallery.replaceChildren();main.replaceChildren();
 if(!assets.length){main.textContent='No media assigned';return}
 activeMedia=Math.min(activeMedia,assets.length-1);
 
 assets.forEach((asset,i)=>{const btn=document.createElement('button');btn.type='button';btn.title=asset.label;btn.setAttribute('aria-label',asset.label);btn.style.cssText='width:112px;height:118px;background:#f7f7f7;border:2px solid '+(i===activeMedia?'#2c6ecb':'#ddd')+';border-radius:6px;overflow:hidden;padding:3px;cursor:pointer';const thumb=document.createElement('img');thumb.src=asset.url;thumb.alt='';thumb.style.cssText='width:100%;height:100%;object-fit:cover';btn.append(thumb);btn.onclick=()=>{activeMedia=i;photo()};gallery.append(btn)})
}
qs('#b-choose-icon').onclick=()=>{activeMedia=0;photo()};
qs('#b-choose-screen').onclick=()=>{activeMedia=1;photo()};
qs('#b-add-media').onclick=()=>{activeMedia=1;photo()};
fetch('/admin/registry/products-snapshot.json').then(r=>r.json()).then(data=>{const local=read()[id]||{};const fromSource=data.items.find(p=>p.id===id);if(!fromSource&&!id?.startsWith('draft_'))throw Error('Product not found');record=fromSource||{id,slug:id,name:local.name||'Untitled product',kind:local.kind||'product',status:'draft'};const draft=local;qs('#build-title').textContent=draft.name||record.name;qs('#b-name').value=draft.name||record.name;qs('#b-sku').value=draft.sku||('IAM-'+(prefix[record.kind]||'ITEM')+'-'+record.slug.toUpperCase().replace(/[^A-Z0-9]+/g,'-'));qs('#b-kind').value=draft.kind||record.kind;qs('#b-collection').value=draft.collection||(record.id===LOCAL_STUDIO_ID?'Applications':'');selectedCollections=draft.collectionIds||[qs('#b-collection').value].filter(Boolean);renderCollections();qs('#b-tags').value=draft.tags||(record.id===LOCAL_STUDIO_ID?'desktop, developer-workspace, files, terminal, workbench, agentsam-sdk':'');qs('#b-notes').value=draft.notes||'';qs('#b-description').value=draft.description||(record.id===LOCAL_STUDIO_ID?'AgentSam Local Studio is a desktop workspace for working with AgentSam SDK. Explore projects, files, terminal sessions, goals, and developer workflows in a unified interface.':'')||record.description||'';qs('#b-seo-title').value=draft.seoTitle||(record.id===LOCAL_STUDIO_ID?'AgentSam Local Studio | Desktop Developer Workspace':record.name);qs('#b-seo-desc').value=draft.seoDescription||(record.id===LOCAL_STUDIO_ID?'Explore AgentSam Local Studio, a desktop workspace integrating projects, files, terminal sessions and developer tools with AgentSam SDK.':'');qs('#b-handle').value=draft.handle||record.slug;qs('#b-image').value=draft.previewUrl||'';qs('#b-source').textContent=[record.repository_id,record.canonical_path,record.package_name,record.version].filter(Boolean).join(' · ')||'New draft — not yet registered';qs('#b-evidence').textContent=record.id+' · '+record.status+' (not deployment-verified)';photo();syncSeo()}).catch(e=>qs('#b-feedback').textContent=e.message);
function renderCollections(){
 const area=qs('#b-collections-list');area.replaceChildren();
 const list=['Applications','Apparel','Accessories','Automations','Templates',...selectedCollections.filter(x=>!['Applications','Apparel','Accessories','Automations','Templates'].includes(x))];
 list.forEach(name=>{const label=document.createElement('label');label.style.cssText='display:flex;align-items:center;gap:10px;border:1px solid #e4e4e4;border-radius:7px;padding:11px;margin:6px 0;font-size:12px';const c=document.createElement('input');c.type='checkbox';c.checked=selectedCollections.includes(name);c.onchange=()=>{selectedCollections=c.checked?[...new Set([...selectedCollections,name])]:selectedCollections.filter(x=>x!==name)};label.append(c,document.createTextNode(name));area.append(label)});
}
qs('#b-add-collection').onclick=()=>{qs('#b-collection-create').hidden=!qs('#b-collection-create').hidden};
qs('#b-create-collection').onclick=()=>{const name=qs('#b-new-collection').value.trim();if(!name)return;selectedCollections=[...new Set([...selectedCollections,name])];renderCollections();qs('#b-new-collection').value='';qs('#b-collection-create').hidden=true;qs('#b-feedback').textContent='Collection added to this draft; not published.'};
const syncSeo=()=>{qs('#seo-title-preview').textContent=qs('#b-seo-title').value||qs('#b-name').value;qs('#seo-desc-preview').textContent=qs('#b-seo-desc').value||qs('#b-description').value};
['#b-seo-title','#b-seo-desc','#b-description','#b-name'].forEach(x=>qs(x).addEventListener('input',syncSeo));

const proposal=()=>({name:qs('#b-name').value.trim(),sku:qs('#b-sku').value.trim(),kind:qs('#b-kind').value,collection:qs('#b-collection').value,collectionIds:selectedCollections,tags:qs('#b-tags').value.trim(),notes:qs('#b-notes').value.trim(),description:qs('#b-description').value.trim(),seoTitle:qs('#b-seo-title').value.trim(),seoDescription:qs('#b-seo-desc').value.trim(),handle:qs('#b-handle').value.trim(),previewUrl:qs('#b-image').value.trim(),media:mediaFor(),savedAt:new Date().toISOString()});
qs('#discard-build').onclick=()=>location.reload();
qs('#view-build').onclick=()=>{if(record)location.href='/admin/products/create/'+encodeURIComponent(record.id)};
qs('#save-build').onclick=()=>{if(!record)return;const p=proposal();if(!/^[A-Z0-9]+(?:-[A-Z0-9]+)+$/.test(p.sku)){qs('#b-feedback').textContent='SKU requires uppercase hyphenated segments';return}try{const all=read();all[id]=p;localStorage.setItem(key,JSON.stringify(all));qs('#build-title').textContent=p.name;qs('#b-feedback').textContent='Draft saved in this browser; not published.';}catch(e){qs('#b-feedback').textContent=e.message}};
qs('#export-build').onclick=()=>{if(!record)return;const data=JSON.stringify({source:record,proposal:proposal(),status:'pending_review'},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=record.slug+'-proposal.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
