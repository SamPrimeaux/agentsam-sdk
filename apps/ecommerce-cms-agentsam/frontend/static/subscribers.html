<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscribers — Fuel &amp; Free Time Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/console.css">
<style>
.subs-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}
.subs-metric{padding:16px 18px}.subs-metric span{display:block;color:var(--muted,#777);font-size:12px}.subs-metric strong{display:block;margin-top:7px;font-size:25px;font-weight:800}
.subs-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.subs-control{min-height:40px;border:1px solid var(--border,#ddd);border-radius:10px;padding:9px 12px;background:var(--surface,#fff);color:inherit;font:inherit}.subs-search{flex:1;min-width:220px}
.subs-table-wrap{overflow:auto}.subs-table{min-width:850px;width:100%}.subs-contact small{display:block;margin-top:4px;color:var(--muted,#777);font-size:12px}.subs-status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;text-transform:capitalize;white-space:nowrap}
.subs-error{padding:12px 14px;color:#a32d18;background:#fff0eb;border-radius:10px;margin:12px 0}.subs-muted{color:var(--muted,#777);font-size:12px}
</style>
</head>
<body>
<script src="/admin/js/shell.js"></script>
<script>
renderShell('/admin/subscribers', `
  <div class="admin-toolbar">
    <div>
      <h1 class="admin-page-title">Subscribers</h1>
      <p class="admin-page-sub">One list for every signup form, with consent and confirmation status.</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="refresh-btn" type="button">Refresh</button>
      <button class="btn ghost" id="export-btn" type="button">Export CSV</button>
    </div>
  </div>
  <div class="subs-summary">
    <div class="admin-card subs-metric"><span>Confirmed subscribers</span><strong id="count-subscribed">—</strong></div>
    <div class="admin-card subs-metric"><span>Awaiting confirmation</span><strong id="count-pending">—</strong></div>
    <div class="admin-card subs-metric"><span>Unsubscribed</span><strong id="count-unsubscribed">—</strong></div>
    <div class="admin-card subs-metric"><span>Bounced / complained</span><strong id="count-suppressed">—</strong></div>
    <div class="admin-card subs-metric"><span>All contacts</span><strong id="count-total">—</strong></div>
  </div>
  <div class="admin-card" style="padding:14px;margin-bottom:14px">
    <div class="subs-controls">
      <input class="subs-control subs-search" id="subs-search" type="search" placeholder="Search email, name, or signup path" autocomplete="off">
      <select class="subs-control" id="subs-status" aria-label="Filter subscribers by status">
        <option value="all">All statuses</option><option value="subscribed">Subscribed</option><option value="pending">Pending confirmation</option><option value="unsubscribed">Unsubscribed</option><option value="bounced">Bounced</option><option value="complained">Complained</option>
      </select>
      <span class="subs-muted" id="subs-result-count">Loading contacts…</span>
    </div>
    <div id="subs-error" class="subs-error" hidden role="alert"></div>
  </div>
  <div class="admin-card">
    <div class="subs-table-wrap"><table class="admin-table subs-table">
      <thead><tr><th>Contact</th><th>Status</th><th>Signup source</th><th>Signed up</th><th>Confirmed</th><th>Last activity</th></tr></thead>
      <tbody id="subs-body"><tr><td colspan="6" class="admin-empty">Loading contacts…</td></tr></tbody>
    </table></div>
  </div>
`);

let allSubs = [];
let searchTimer = null;
const byId = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusColors = {
  subscribed: 'background:#e8f7ee;color:#176b3a', pending: 'background:#fff3dc;color:#8a5600',
  unsubscribed: 'background:#ececec;color:#555', bounced: 'background:#fff0e8;color:#9b3e16',
  complained: 'background:#fde8e8;color:#9f2222'
};
const dateText = value => value ? (typeof fmtDate === 'function' ? fmtDate(value) : String(value)) : '—';

function renderRows() {
  const body = byId('subs-body');
  byId('subs-result-count').textContent = `${allSubs.length} contact${allSubs.length === 1 ? '' : 's'} shown`;
  if (!allSubs.length) {
    body.innerHTML = '<tr><td colspan="6" class="admin-empty">No contacts match this filter.</td></tr>';
    return;
  }
  body.innerHTML = allSubs.map(s => {
    const fullName = [s.first_name, s.last_name].filter(Boolean).join(' ');
    const contact = `<div class="subs-contact"><strong>${escapeHtml(fullName || s.email)}</strong>${fullName ? `<small>${escapeHtml(s.email)}</small>` : ''}</div>`;
    const status = String(s.status || 'pending').toLowerCase();
    const source = [s.source_type || 'form', s.source_path || s.source_page].filter(Boolean).join(' · ');
    return `<tr><td>${contact}</td><td><span class="subs-status" style="${statusColors[status] || 'background:#eee;color:#444'}">${escapeHtml(status)}</span></td><td>${escapeHtml(source || '—')}</td><td>${escapeHtml(dateText(s.created_at))}</td><td>${escapeHtml(dateText(s.confirmed_at || s.subscribed_at))}</td><td>${escapeHtml(dateText(s.last_event_at || s.updated_at))}</td></tr>`;
  }).join('');
}

function renderSummary(summary = {}) {
  byId('count-subscribed').textContent = Number(summary.subscribed || 0).toLocaleString();
  byId('count-pending').textContent = Number(summary.pending || 0).toLocaleString();
  byId('count-unsubscribed').textContent = Number(summary.unsubscribed || 0).toLocaleString();
  byId('count-suppressed').textContent = (Number(summary.bounced || 0) + Number(summary.complained || 0)).toLocaleString();
  byId('count-total').textContent = Number(summary.total || 0).toLocaleString();
}

async function loadSubscribers() {
  const error = byId('subs-error');
  error.hidden = true;
  byId('subs-body').innerHTML = '<tr><td colspan="6" class="admin-empty">Loading contacts…</td></tr>';
  const params = new URLSearchParams();
  const q = byId('subs-search').value.trim();
  const status = byId('subs-status').value;
  if (q) params.set('q', q);
  if (status !== 'all') params.set('status', status);
  try {
    const d = await adminFetch('/api/admin/subscribers' + (params.size ? `?${params}` : ''));
    allSubs = Array.isArray(d.subscribers) ? d.subscribers : [];
    renderSummary(d.summary || {});
    renderRows();
  } catch (err) {
    allSubs = [];
    byId('subs-result-count').textContent = 'Unable to load contacts';
    byId('subs-body').innerHTML = '<tr><td colspan="6" class="admin-empty">Subscriber data could not be loaded.</td></tr>';
    error.textContent = err && err.message ? err.message : 'Request failed. Refresh to try again.';
    error.hidden = false;
  }
}

byId('refresh-btn').addEventListener('click', loadSubscribers);
byId('subs-status').addEventListener('change', loadSubscribers);
byId('subs-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadSubscribers, 220);
});
byId('export-btn').addEventListener('click', () => {
  if (!allSubs.length) return;
  const columns = ['email','first_name','last_name','status','source_type','source_ref','source_path','created_at','confirmed_at','subscribed_at','unsubscribed_at','consent_text','tags_json'];
  const rows = [columns, ...allSubs.map(s => columns.map(key => s[key] ?? ''))];
  const csv = rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(',')).join('
');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  const href = URL.createObjectURL(blob);
  a.href = href;
  a.download = 'fuel-free-time-subscribers.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(href), 1000);
});

loadSubscribers();
</script>
</body>
</html>
