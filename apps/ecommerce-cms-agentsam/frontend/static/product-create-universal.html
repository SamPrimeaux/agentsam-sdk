<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Product — AgentSam SDK</title><link rel="stylesheet" href="/admin/css/admin.css"><link rel="stylesheet" href="/admin/css/console.css"></head><body><script src="/admin/js/shell.js"></script><script>
renderShell('/admin/products/create', `
<div class="admin-toolbar"><div><p class="admin-page-sub"><a href="/admin/products">Products</a> › Create product</p><h1 class="admin-page-title">Create & explore your next idea.</h1><p class="admin-page-sub">Start with what you offer. The same product catalog supports physical goods, software, websites, services, and reusable creative assets.</p></div></div>
<div style="background:#eff0e9;border-radius:18px;padding:clamp(24px,4vw,55px);margin-bottom:24px"><p style="font-size:12px;letter-spacing:.09em;color:#718268">YOUR IDEAS. REAL POSSIBILITIES.</p><h2 style="font-size:clamp(28px,4vw,48px);max-width:700px;margin:10px 0">What would you like to create?</h2><p>Pick a product type, then continue to its full product editor for media, collections, SKU, SEO, release details and publishing.</p></div>
<div id="types" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:30px"></div>
<div class="admin-card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><h2 style="margin:0">Explore the catalog</h2><a href="/admin/products" class="btn ghost">View all products</a></div><p class="admin-page-sub">Choose an existing SDK app/package or create a new product draft.</p><input id="catalog-search" type="search" placeholder="Search apps, packages, components…" style="padding:12px;width:100%;max-width:550px;border:1px solid #ddd;border-radius:8px;margin:14px 0"><div id="catalog-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px"></div></div>
`);
const categories=[['All types','all','Find your next idea'],['Apps','app','Applications and tools'],['Packages','sdk-package','Reusable SDK packages'],['Websites','website','Sites and experiences'],['Services','service','Expertise and subscriptions'],['Components','ui-component','Reusable UI elements'],['Themes','theme','Design systems'],['Physical goods','physical','Apparel, objects and more']];
let current='all',products=[];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function draft(kind){const id='draft_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36));let entries={};try{entries=JSON.parse(localStorage.getItem('iam:registry:product-edits:v1')||'{}')}catch{}entries[id]={name:'Untitled '+kind,kind,sku:'',status:'draft',savedAt:new Date().toISOString()};localStorage.setItem('iam:registry:product-edits:v1',JSON.stringify(entries));location.href='/admin/product-edit?id='+encodeURIComponent(id);}
document.getElementById('types').innerHTML=categories.map(([label,key,sub],i)=>'<button type="button" data-type="'+esc(key)+'" style="text-align:left;min-height:106px;border:1px solid #dedee3;background:'+(i===0?'#e5ebd7':'#fff')+';border-radius:12px;padding:15px;cursor:pointer"><span style="display:block;font-size:12px;color:#8d9385">'+String(i+1).padStart(2,'0')+'</span><strong style="display:block;margin:7px 0">'+esc(label)+'</strong><small>'+esc(sub)+'</small></button>').join('');
document.querySelectorAll('[data-type]').forEach(btn=>btn.onclick=()=>{current=btn.dataset.type;document.querySelectorAll('[data-type]').forEach(el=>el.style.borderColor=el===btn?'#83976b':'#dedee3');render()});
function render(){const q=document.getElementById('catalog-search').value.toLowerCase();const filtered=products.filter(p=>(current==='all'||p.kind===current||(current==='website'&&p.slug.includes('site')))&&(!q||[p.name,p.slug,p.package_name,p.kind].some(x=>String(x||'').toLowerCase().includes(q)))).slice(0,80);document.getElementById('catalog-grid').innerHTML='<button type="button" id="new-draft" style="text-align:left;min-height:185px;background:#f4f3f8;border:1px dashed #adabb7;border-radius:12px;padding:18px;cursor:pointer"><span style="font-size:25px">＋</span><strong style="display:block;margin:12px 0 7px">Create new product</strong><small>Start a '+esc(current==='all'?'product':current)+' draft</small></button>'+filtered.map(p=>'<a href="/admin/product-edit?id='+encodeURIComponent(p.id)+'" style="display:block;border:1px solid #e3e3e7;background:#fff;border-radius:12px;overflow:hidden;color:inherit;text-decoration:none"><div style="background:#f1f0f5;min-height:115px;display:grid;place-items:center;font-size:18px;color:#797186;font-weight:700">'+esc(p.kind.toUpperCase())+'</div><div style="padding:13px"><strong>'+esc(p.name)+'</strong><small style="display:block;margin-top:7px;color:#777">'+esc(p.version||p.kind)+'</small></div></a>').join('');document.getElementById('new-draft').onclick=()=>draft(current==='all'?'product':current);}
document.getElementById('catalog-search').oninput=render;
fetch('/admin/registry/products-snapshot.json').then(r=>r.json()).then(d=>{products=d.items||[];render()}).catch(()=>render());
</script></body></html>
