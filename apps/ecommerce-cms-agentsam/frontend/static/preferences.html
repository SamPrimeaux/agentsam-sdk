<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferences — Online Store</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/console.css">
  <link rel="stylesheet" href="/admin/css/preferences.css">
</head>
<body>
  <script src="/admin/js/shell.js"></script>
  <script>
    renderShell("/admin/preferences", `
      <div class="store-preferences" id="store-preferences">
        <header class="sp-header">
          <div class="sp-header-copy">
            <div class="sp-eyebrow">SALES CHANNELS <span>/</span> ONLINE STORE</div>
            <h1>Preferences</h1>
            <p>Shape how your website appears, who can access it, and how people discover it.</p>
          </div>
          <div class="sp-header-actions">
            <a class="sp-button sp-button-secondary" id="view-store-link" href="#" target="_blank" rel="noopener" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11.5 3.5h5v5M16.2 3.8 9 11M15 10.5v4A1.5 1.5 0 0 1 13.5 16h-8A1.5 1.5 0 0 1 4 14.5v-8A1.5 1.5 0 0 1 5.5 5H10"/></svg>
              View store
            </a>
          </div>
        </header>

        <section class="sp-site-context" aria-label="Selected website">
          <div class="sp-site-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 9.2 5.3 5h13.4L20 9.2M4 9.2h16v2.1a2 2 0 0 1-2 2h-.5a2 2 0 0 1-2-2 2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9.2ZM6 13.3V20h12v-6.7M9 20v-4h6v4"/></svg>
          </div>
          <div class="sp-site-copy">
            <div class="sp-site-name" id="site-name">Loading website…</div>
            <div class="sp-site-meta">
              <span id="site-domain">Resolving selected website</span>
              <span class="sp-meta-dot" aria-hidden="true">·</span>
              <span class="sp-site-status" id="site-status">Loading status</span>
            </div>
          </div>
          <label class="sp-site-select-wrap" for="site-select">
            <span>Website</span>
            <select id="site-select" aria-label="Select website" disabled>
              <option>Loading websites…</option>
            </select>
          </label>
        </section>

        <div class="sp-layout">
          <nav class="sp-section-nav" aria-label="Preferences sections">
            <div class="sp-nav-label">SETTINGS</div>
            <button type="button" class="is-active" data-section-link="access"><span class="sp-nav-icon">⌑</span><span>Access</span></button>
            <button type="button" data-section-link="search"><span class="sp-nav-icon">⌕</span><span>Search & sharing</span></button>
            <button type="button" data-section-link="identity"><span class="sp-nav-icon">◈</span><span>Storefront identity</span></button>
            <button type="button" data-section-link="navigation"><span class="sp-nav-icon">☷</span><span>Navigation</span></button>
            <button type="button" data-section-link="announcement"><span class="sp-nav-icon">▤</span><span>Announcement</span></button>
            <button type="button" data-section-link="discovery"><span class="sp-nav-icon">◎</span><span>Search discovery</span></button>
            <div class="sp-nav-footnote">Settings apply to the selected website only.</div>
          </nav>

          <main class="sp-content">
            <fieldset id="preferences-controls" class="sp-controls" disabled>
            <section class="sp-section" id="section-access" data-section="access">
              <div class="sp-section-heading">
                <div class="sp-section-kicker">01 / ACCESS</div>
                <h2>Store access</h2>
                <p>Control whether visitors can browse your website and how they enter.</p>
              </div>

              <article class="sp-card sp-access-card">
                <div class="sp-card-topline">
                  <div class="sp-card-icon"><svg viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="2"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/><circle cx="12" cy="15.2" r="1"/></svg></div>
                  <div class="sp-card-title-group">
                    <h3>Password protection</h3>
                    <p>Choose the password visitors must enter before browsing your storefront. You can change or remove it at any time.</p>
                  </div>
                  <label class="sp-switch" for="password-protection">
                    <input type="checkbox" id="password-protection" disabled>
                    <span aria-hidden="true"></span>
                  </label>
                </div>
                <div class="sp-password-panel" id="password-panel" hidden>
                  <div class="sp-password-state" id="password-state">
                    <span class="sp-status-dot"></span>
                    <span id="password-state-text">No store password has been set.</span>
                  </div>
                  <div class="sp-password-fields" id="password-fields" hidden>
                    <label class="sp-field">
                      <span id="password-label">Store access password</span>
                      <input type="password" id="store-password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="At least 8 characters">
                    </label>
                    <label class="sp-field">
                      <span>Confirm password</span>
                      <input type="password" id="store-password-confirm" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Enter it again">
                    </label>
                    <p class="sp-field-help">This is a shared storefront password, not a customer account password. Visitors stay signed in on this device for 7 days. Changing it ends existing access sessions. Your password is never shown again after saving.</p>
                  </div>
                  <div class="sp-password-actions">
                    <button type="button" class="sp-text-button" id="change-password-button" hidden>Change password</button>
                    <button type="button" class="sp-text-button sp-danger-link" id="remove-password-button" hidden>Remove saved password</button>
                  </div>
                </div>
                <div class="sp-card-note" id="password-note">When enabled, your storefront and its public data endpoints require the password. Your admin workspace remains accessible.</div>
              </article>

              <article class="sp-card sp-inline-card">
                <div>
                  <h3>Publishing status</h3>
                  <p id="publishing-summary">Your published pages determine what visitors can see when the store is public.</p>
                </div>
                <a class="sp-inline-link" id="manage-pages-link" href="/admin/pages">Manage pages <span aria-hidden="true">↗</span></a>
              </article>
            </section>

            <section class="sp-section" id="section-search" data-section="search">
              <div class="sp-section-heading">
                <div class="sp-section-kicker">02 / SEARCH & SHARING</div>
                <h2>Search appearance</h2>
                <p>Set the default metadata for your website. Individual pages can override these values in the page editor.</p>
              </div>

              <article class="sp-card">
                <div class="sp-seo-grid">
                  <div class="sp-fields-column">
                    <label class="sp-field" for="home-title">
                      <span>Homepage title</span>
                      <input type="text" id="home-title" maxlength="70" placeholder="Your website name">
                      <small class="sp-counter" id="home-title-count">0 / 70</small>
                    </label>
                    <label class="sp-field" for="meta-description">
                      <span>Default meta description</span>
                      <textarea id="meta-description" rows="4" maxlength="320" placeholder="Describe what visitors can find on your website."></textarea>
                      <small class="sp-counter" id="meta-description-count">0 / 320</small>
                    </label>
                    <div class="sp-field">
                      <span>Social sharing image</span>
                      <div class="sp-image-control">
                        <div class="sp-image-thumb" id="social-image-thumb"><span>OG</span></div>
                        <div class="sp-image-control-copy">
                          <strong id="social-image-name">No image selected</strong>
                          <small>Recommended 1200 × 630 px</small>
                          <div class="sp-inline-actions">
                            <button type="button" class="sp-small-button" data-pick-asset="social">Choose image</button>
                            <button type="button" class="sp-text-button" data-clear-asset="social">Remove</button>
                          </div>
                        </div>
                      </div>
                      <details class="sp-advanced">
                        <summary>Advanced image URL</summary>
                        <input type="text" id="social-image-url-advanced" placeholder="/media/... or https://…">
                      </details>
                    </div>
                    <details class="sp-advanced sp-seo-advanced">
                      <summary>Advanced metadata</summary>
                      <div class="sp-advanced-grid">
                        <label class="sp-field" for="seo-site-name"><span>Structured data site name</span><input type="text" id="seo-site-name" maxlength="120" placeholder="Your website name"></label>
                        <label class="sp-field" for="seo-title-template"><span>Default page title template</span><input type="text" id="seo-title-template" maxlength="160" placeholder="{title} | {site_name}"><small>Use {title} and {site_name} as placeholders.</small></label>
                        <label class="sp-field" for="seo-twitter-handle"><span>Social profile handle</span><input type="text" id="seo-twitter-handle" maxlength="64" placeholder="@yourbrand"></label>
                        <label class="sp-field" for="seo-locale"><span>Open Graph locale</span><input type="text" id="seo-locale" maxlength="32" placeholder="en_US"></label>
                      </div>
                    </details>
                    <div class="sp-visibility-setting">
                      <div>
                        <strong>Allow search engines to index this website</strong>
                        <p>Turn this off to add a site-wide noindex directive. Password-protected stores are excluded automatically.</p>
                      </div>
                      <label class="sp-switch" for="search-indexing"><input type="checkbox" id="search-indexing" checked><span aria-hidden="true"></span></label>
                    </div>
                  </div>

                  <aside class="sp-preview-column" aria-label="Search and social preview">
                    <div class="sp-preview-label">SEARCH RESULT PREVIEW</div>
                    <div class="sp-search-preview">
                      <div class="sp-preview-domain" id="search-preview-domain">yourwebsite.com</div>
                      <div class="sp-preview-title" id="search-preview-title">Your homepage title</div>
                      <div class="sp-preview-description" id="search-preview-description">Your meta description will appear here when available.</div>
                    </div>
                    <div class="sp-preview-label sp-preview-label-social">SOCIAL SHARING PREVIEW</div>
                    <div class="sp-social-preview">
                      <div class="sp-social-image" id="social-preview-image"><span>Choose a sharing image</span></div>
                      <div class="sp-social-preview-copy">
                        <div class="sp-preview-domain" id="social-preview-domain">yourwebsite.com</div>
                        <div class="sp-social-preview-title" id="social-preview-title">Your homepage title</div>
                        <div class="sp-social-preview-description" id="social-preview-description">Your meta description will appear here.</div>
                      </div>
                    </div>
                    <p class="sp-preview-disclaimer">Previews are illustrative. Search engines and social platforms decide how they display shared pages.</p>
                  </aside>
                </div>
                <div class="sp-card-footer">
                  <div><strong>Page-specific metadata</strong><p>Set unique titles, descriptions, canonical URLs, and indexing rules on individual pages.</p></div>
                  <a class="sp-inline-link" id="edit-page-seo-link" href="/admin/pages">Edit page SEO <span aria-hidden="true">↗</span></a>
                </div>
              </article>
            </section>

            <section class="sp-section" id="section-identity" data-section="identity">
              <div class="sp-section-heading">
                <div class="sp-section-kicker">03 / IDENTITY</div>
                <h2>Storefront identity</h2>
                <p>Control the logo and brand accents used by your installed storefront theme.</p>
              </div>
              <article class="sp-card">
                <div class="sp-identity-grid">
                  <div class="sp-field">
                    <span>Storefront logo</span>
                    <div class="sp-image-control sp-logo-control">
                      <div class="sp-logo-thumb" id="nav-logo-thumb"><span>Logo</span></div>
                      <div class="sp-image-control-copy">
                        <strong id="nav-logo-name">Use the installed theme logo</strong>
                        <small>PNG, SVG, WEBP or transparent artwork</small>
                        <div class="sp-inline-actions">
                          <button type="button" class="sp-small-button" data-pick-asset="nav">Choose logo</button>
                          <button type="button" class="sp-text-button" data-clear-asset="nav">Use theme default</button>
                        </div>
                      </div>
                    </div>
                    <details class="sp-advanced">
                      <summary>Advanced logo URL</summary>
                      <input type="text" id="nav-logo-url-advanced" placeholder="/media/... or https://…">
                    </details>
                  </div>
                  <label class="sp-field" for="nav-logo-height">
                    <span>Logo height</span>
                    <div class="sp-range-control"><input type="range" id="nav-logo-height" min="40" max="120" step="1"><output id="nav-logo-height-value">58 px</output></div>
                    <small>Controls the logo height in the storefront header.</small>
                  </label>
                  <label class="sp-field" for="nav-brand-accent">
                    <span>Brand accent</span>
                    <div class="sp-color-field"><input type="color" id="nav-brand-accent"><input type="text" id="nav-brand-accent-text" maxlength="7" aria-label="Brand accent hex value"></div>
                  </label>
                  <label class="sp-field" for="nav-brand-accent-light">
                    <span>Accent highlight</span>
                    <div class="sp-color-field"><input type="color" id="nav-brand-accent-light"><input type="text" id="nav-brand-accent-light-text" maxlength="7" aria-label="Accent highlight hex value"></div>
                  </label>
                </div>
              </article>
            </section>

            <section class="sp-section" id="section-navigation" data-section="navigation">
              <div class="sp-section-heading">
                <div class="sp-section-kicker">04 / NAVIGATION</div>
                <h2>Website menus</h2>
                <p>Manage published header and footer menus for this website using the existing CMS navigation records.</p>
              </div>
              <div class="sp-card" id="preferences-navigation" data-site-id=""><p class="sp-menu-panel sp-menu-muted" role="status">Select a website to load its menus.</p></div>
            </section>

            <section class="sp-section" id="section-announcement" data-section="announcement">
              <div class="sp-section-heading">
                <div class="sp-section-kicker">05 / ANNOUNCEMENT</div>
                <h2>Announcement banner</h2>
                <p>Share a short, timely message across your storefront without editing every page.</p>
              </div>
              <article class="sp-card">
                <div class="sp-card-topline">
                  <div class="sp-card-icon"><svg viewBox="0 0 24 24"><path d="M4 9.5h3l10-4v13l-10-4H4zM7 14.5l1.5 5h3l-2-5M17 9a3 3 0 0 1 0 6"/></svg></div>
                  <div class="sp-card-title-group"><h3>Show announcement</h3><p>Display a banner at the top of your storefront.</p></div>
                  <label class="sp-switch" for="announcement-enabled"><input type="checkbox" id="announcement-enabled"><span aria-hidden="true"></span></label>
                </div>
                <div class="sp-announcement-editor" id="announcement-editor">
                  <div class="sp-announcement-preview-wrap">
                    <div class="sp-preview-label">LIVE PREVIEW</div>
                    <div class="sp-announcement-preview" id="announcement-preview"><span id="announcement-preview-text">Your announcement will appear here.</span><span aria-hidden="true">↗</span></div>
                  </div>
                  <div class="sp-announcement-fields">
                    <label class="sp-field" for="announcement-text"><span>Message</span><input type="text" id="announcement-text" maxlength="160" placeholder="A short message for your visitors"><small class="sp-counter" id="announcement-count">0 / 160</small></label>
                    <label class="sp-field" for="announcement-href"><span>Link destination</span><input type="text" id="announcement-href" maxlength="512" placeholder="/shop or https://…"><small>Use a site path, section anchor, or HTTPS URL.</small></label>
                    <label class="sp-field" for="announcement-style"><span>Display style</span><select id="announcement-style"><option value="static">Static banner</option><option value="marquee">Scrolling announcement</option></select></label>
                    <div class="sp-color-pair">
                      <label class="sp-field" for="announcement-bg-color"><span>Background</span><div class="sp-color-field"><input type="color" id="announcement-bg-color"><input type="text" id="announcement-bg-color-text" maxlength="7" aria-label="Announcement background hex value"></div></label>
                      <label class="sp-field" for="announcement-text-color"><span>Text</span><div class="sp-color-field"><input type="color" id="announcement-text-color"><input type="text" id="announcement-text-color-text" maxlength="7" aria-label="Announcement text hex value"></div></label>
                    </div>
                  </div>
                </div>
              </article>
            </section>

            <section class="sp-section" id="section-discovery" data-section="discovery">
              <div class="sp-section-heading">
                <div class="sp-section-kicker">06 / DISCOVERY</div>
                <h2>Search discovery</h2>
                <p>Check the public files search engines use to discover your published pages and products.</p>
              </div>
              <article class="sp-card">
                <div class="sp-discovery-head">
                  <div><h3>Search engine files</h3><p id="crawler-site-domain">Checking the selected website…</p></div>
                  <span class="sp-discovery-status" id="crawler-status-pill">Checking</span>
                </div>
                <div class="sp-discovery-links">
                  <a id="crawler-robots-link" href="/robots.txt" target="_blank" rel="noopener"><span>robots.txt</span><small>Access and crawl rules</small><b>↗</b></a>
                  <a id="crawler-sitemap-link" href="/sitemap.xml" target="_blank" rel="noopener"><span>sitemap.xml</span><small>Published page and product URLs</small><b>↗</b></a>
                </div>
                <div class="sp-discovery-checks" id="crawler-checks">
                  <div class="sp-check-row" data-check="robots"><span class="sp-check-indicator"></span><span>robots.txt</span><small id="crawler-robots-state">Waiting to check</small></div>
                  <div class="sp-check-row" data-check="sitemap"><span class="sp-check-indicator"></span><span>sitemap.xml</span><small id="crawler-sitemap-state">Waiting to check</small></div>
                </div>
                <div class="sp-discovery-metrics">
                  <div><strong id="crawler-routes-count">—</strong><span>Published pages</span></div>
                  <div><strong id="crawler-products-count">—</strong><span>Active products</span></div>
                  <div><strong id="crawler-sitemap-count">—</strong><span>Live sitemap URLs</span></div>
                </div>
                <div class="sp-discovery-footer">
                  <p id="crawler-notice" role="status">Checks run against the selected website's public domain.</p>
                  <button type="button" class="sp-small-button" id="crawler-refresh-btn">Re-check files</button>
                </div>
              </article>
            </section>

            </fieldset>
            <div class="sp-page-end sp-save-footer">
              <span id="save-state" role="status" aria-live="polite">Loading preferences…</span>
              <div class="sp-inline-actions">
                <button class="sp-small-button" type="button" id="retry-preferences" hidden>Retry</button>
                <button class="sp-button" type="button" id="save-preferences-fallback" disabled hidden>Save changes</button>
              </div>
            </div>
          </main>
        </div>

        <dialog class="sp-media-dialog" id="prefs-assets-dialog" aria-labelledby="prefs-assets-title">
          <div class="sp-media-dialog-head">
            <div><div class="sp-section-kicker">MEDIA LIBRARY</div><h2 id="prefs-assets-title">Choose an image</h2></div>
            <button type="button" class="sp-icon-button" id="prefs-assets-close" aria-label="Close media picker">×</button>
          </div>
          <div class="sp-media-toolbar">
            <input type="search" id="prefs-assets-search" placeholder="Search your media library" aria-label="Search media">
            <label class="sp-small-button sp-upload-button">Upload image<input type="file" id="prefs-assets-upload" accept="image/*" multiple hidden></label>
          </div>
          <p class="sp-media-status" id="prefs-assets-status" role="status">Choose an existing image or upload a new one.</p>
          <div class="sp-assets-grid" id="prefs-assets-grid" role="list"></div>
        </dialog>
      </div>
    `);
  </script>
  <script src="/admin/js/preferences.js"></script>
  <script src="/admin/js/preferences-navigation.js" defer></script>
</body>
</html>
