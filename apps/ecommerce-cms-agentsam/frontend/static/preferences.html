function setDirty(next = true) {
  dirty = next;
  document.getElementById("save-prefs-btn").disabled = !dirty;
  syncDockEdit();
}

/** Mirrors the fixed save bar into the mobile dock (admin-dock edit mode). */
function syncDockEdit(saving = false) {
  window.publishDockEdit?.({
    active: true,
    hint: saving ? "Saving…" : dirty ? "Unsaved changes" : "All changes saved",
    dirty,
    canSave: dirty && !saving,
    saveLabel: saving ? "Saving…" : "Save",
    onSave: () => document.getElementById("save-prefs-btn")?.click(),
  });
}

function showNote(msg, kind) {
  const el = document.getElementById("prefs-note");
  if (!msg) {
    el.className = "prefs-note";
    el.textContent = "";
    return;
  }
  el.className = `prefs-note is-visible is-${kind || "success"}`;
  el.textContent = msg;
}

const TITLE_SOFT_LIMIT = 60;
const DESC_SOFT_LIMIT = 160;
function clip(text, max) {
  const t = String(text || "").trim();
  return t.length > max ? t.slice(0, max - 1).trimEnd() + "…" : t;
}
function updateCounters() {
  const title = document.getElementById("home-title").value;
  const meta = document.getElementById("meta-description").value;
  document.getElementById("title-count").textContent = title.length;
  document.getElementById("meta-count").textContent = meta.length;
  const titleLong = title.length > TITLE_SOFT_LIMIT;
  const metaLong = meta.length > DESC_SOFT_LIMIT;
  document.getElementById("title-counter").classList.toggle("is-long", titleLong);
  document.getElementById("meta-counter").classList.toggle("is-long", metaLong);
  document.getElementById("title-hint").textContent = titleLong
    ? ` · search results usually show about ${TITLE_SOFT_LIMIT}` : "";
  document.getElementById("meta-hint").textContent = metaLong
    ? ` · search results usually show about ${DESC_SOFT_LIMIT}` : "";
  const desc = meta || "Enter a description to be shown on search engines like Google.";
  document.getElementById("social-preview-title").textContent = title || domain;
  document.getElementById("social-preview-desc").textContent = desc;
  document.getElementById("serp-url").textContent = domain;
  document.getElementById("serp-title").textContent = clip(title || domain, TITLE_SOFT_LIMIT);
  document.getElementById("serp-desc").textContent = clip(desc, DESC_SOFT_LIMIT);
}

function setChosenAsset(kind, url, { notify = true } = {}) {
  const input = document.getElementById(kind === "nav" ? "nav-logo-url" : "social-image-url");
  const preview = document.getElementById(kind === "nav" ? "nav-asset-thumb" : "social-asset-thumb");
  const name = document.getElementById(kind === "nav" ? "nav-asset-name" : "social-asset-name");
  const advanced = document.getElementById(kind === "nav" ? "nav-logo-url-advanced" : "social-image-url-advanced");
  input.value = url || "";
  advanced.value = url || "";
  preview.hidden = !url;
  preview.onerror = () => { preview.hidden = true; };
  preview.onload = () => { preview.hidden = false; };
  if (url) preview.src = url;
  else preview.removeAttribute("src");
  name.textContent = url ? decodeURIComponent(url.split("/").pop().split("?")[0] || "Selected asset") :
    (kind === "nav" ? "Use current logo" : "No image selected");
  if (kind === "social") updateSocialImage();
  if (notify) setDirty(true);
}

const SOCIAL_IDEAL_RATIO = 1200 / 630;
let socialImageToken = 0;
async function explainImageFailure(url) {
  try {
    const res = await fetch(url, { method: "HEAD", credentials: "same-origin", cache: "no-store" });
    if (res.status === 404) return "This image no longer exists in your media library. Choose another image.";
    if (!res.ok) return `This image could not be loaded (HTTP ${res.status}). Choose another image.`;
    const type = res.headers.get("content-type") || "";
    if (!type.startsWith("image/")) return `This file is not an image (${type || "unknown type"}). Choose another image.`;
    return "Your browser could not display this image file. It may be damaged or in an unsupported format. Choose another image.";
  } catch {
    return "This image address could not be reached. Check the address or choose another image.";
  }
}
function updateSocialImage() {
  const url = document.getElementById("social-image-url").value.trim();
  const img = document.getElementById("social-image");
  const placeholder = document.getElementById("social-placeholder");
  const hint = document.getElementById("social-image-hint");
  const token = ++socialImageToken;
  hint.hidden = true;
  hint.className = "prefs-image-hint";
  img.hidden = true;
  if (!url) {
    img.removeAttribute("src");
    placeholder.hidden = false;
    placeholder.textContent = "Choose a sharing image to preview your store’s social card.";
    return;
  }
  placeholder.hidden = false;
  placeholder.textContent = "Loading preview…";
  img.onload = () => {
    if (token !== socialImageToken) return;
    placeholder.hidden = true;
    img.hidden = false;
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    const off = Math.abs(w / h - SOCIAL_IDEAL_RATIO) / SOCIAL_IDEAL_RATIO > 0.25;
    const small = w < 600;
    if (off || small) {
      hint.textContent = `${w} × ${h} px. ` +
        (small ? "This is small for a social card. " : "") +
        (off ? "Platforms will crop it to a wide card, so keep the subject centered. " : "") +
        "Recommended 1200 × 630 px.";
      hint.classList.add("is-warning");
      hint.hidden = false;
    }
  };
  img.onerror = async () => {
    if (token !== socialImageToken) return;
    img.hidden = true;
    placeholder.hidden = false;
    placeholder.textContent = "Preview unavailable";
    hint.textContent = await explainImageFailure(url);
    hint.classList.add("is-error");
    hint.hidden = false;
  };
  img.src = url;
}

function updateAnnouncementPreview() {
  const element = document.getElementById("announcement-preview");
  const value = document.getElementById("announcement-text").value.trim() || "Your announcement will appear here";
  const marquee = document.getElementById("announcement-style").value === "marquee";
  element.style.backgroundColor = document.getElementById("announcement-bg").value;
  element.style.color = document.getElementById("announcement-color").value;
  element.dataset.style = marquee ? "marquee" : "static";
  element.replaceChildren();
  const track = document.createElement("span");
  track.className = "prefs-announcement-preview__track";
  for (let i = 0; i < (marquee ? 4 : 1); i++) {
    const segment = document.createElement("span");
    segment.textContent = value;
    track.appendChild(segment);
  }
  element.appendChild(track);
}

function togglePasswordField() {
  const on = document.getElementById("password-protection").checked;
  document.getElementById("password-field").hidden = !on;
}

function escapeAttr(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function renderNavItems() {
  const root = document.getElementById("nav-items-root");
  if (!root) return;
  root.innerHTML = navItems
    .map(
      (item, idx) => `
    <div class="prefs-nav-row" data-idx="${idx}" data-id="${escapeAttr(item.id || `nav-${idx}`)}">
      <div class="prefs-field" style="margin:0">
        <label>Label</label>
        <input type="text" class="nav-label" value="${escapeAttr(item.label)}" maxlength="40">
      </div>
      <div class="prefs-field" style="margin:0">
        <label>Destination</label>
        <input type="text" class="nav-href" value="${escapeAttr(item.href)}" placeholder="/about">
      </div>
      <details class="prefs-nav-advanced"><summary>Advanced: active menu paths</summary><label>Additional matching paths</label><input type="text" class="nav-prefixes" value="${escapeAttr((item.matchPrefixes || []).join(", "))}" placeholder="/about"><span>Only needed when several URLs share one navigation item.</span></details>
      <label class="prefs-switch" title="Visible in menu" style="margin-bottom:.35rem"><input type="checkbox" class="nav-visible" ${item.visible !== false ? "checked" : ""}><span class="prefs-switch-slider"></span></label>
      <div class="prefs-nav-actions"><button type="button" class="btn ghost small nav-up" aria-label="Move up" ${idx === 0 ? "disabled" : ""}>↑</button><button type="button" class="btn ghost small nav-down" aria-label="Move down" ${idx === navItems.length - 1 ? "disabled" : ""}>↓</button><button type="button" class="btn ghost small nav-remove" aria-label="Remove">×</button></div>
    </div>`
    )
    .join("");

  root.querySelectorAll(".nav-label, .nav-href, .nav-prefixes, .nav-visible").forEach((el) => {
    el.addEventListener("input", () => setDirty(true));
    el.addEventListener("change", () => setDirty(true));
  });
  root.querySelectorAll(".nav-remove").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.closest(".prefs-nav-row").dataset.idx);
      navItems.splice(idx, 1);
      renderNavItems();
      setDirty(true);
    });
  });
  root.querySelectorAll(".nav-up, .nav-down").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.closest(".prefs-nav-row").dataset.idx);
      const nextIdx = btn.classList.contains("nav-up") ? idx - 1 : idx + 1;
      if (nextIdx < 0 || nextIdx >= navItems.length) return;
      [navItems[idx], navItems[nextIdx]] = [navItems[nextIdx], navItems[idx]];
      renderNavItems();
      setDirty(true);
    });
  });
}

function collectNavItemsFromDom() {
  return Array.from(document.querySelectorAll(".prefs-nav-row")).map((row) => ({
    id: row.dataset.id || `nav-${row.dataset.idx}`,
    label: row.querySelector(".nav-label")?.value.trim() || "",
    href: row.querySelector(".nav-href")?.value.trim() || "",
    matchPrefixes: (row.querySelector(".nav-prefixes")?.value || "")
      .split(",")
      .map((s) => s.trim())
      .filter(Boolean),
    visible: row.querySelector(".nav-visible")?.checked !== false,
  }));
}

function applySettings(data) {
  settings = data.settings || {};
  domain = data.domain || domain;
  navItems = (data.nav?.items || settings.navItems || []).map((item) => ({ ...item }));
  document.getElementById("social-domain").textContent = domain.toUpperCase();

  document.getElementById("password-protection").checked = !!settings.passwordProtection;
  document.getElementById("b2b-only").checked = !!settings.b2bOnly;
  document.getElementById("geo-redirect").checked = !!settings.geoRedirect;
  document.getElementById("language-redirect").checked = !!settings.languageRedirect;
  document.getElementById("hcaptcha-contact").checked = !!settings.hcaptchaContact;
  document.getElementById("hcaptcha-account").checked = !!settings.hcaptchaAccount;

  document.getElementById("home-title").value = settings.homeTitle || "";
  document.getElementById("meta-description").value = settings.metaDescription || "";
  setChosenAsset("social", settings.socialImageUrl || "", { notify: false });
  document.getElementById("store-password").value = settings.storePassword || "";

  setChosenAsset("nav", settings.navLogoUrl || data.nav?.logoUrl || "", { notify: false });
  document.getElementById("nav-logo-height").value = data.nav?.logoHeight || settings.navLogoHeight || 68;
  document.getElementById("nav-brand-accent").value = data.nav?.brandAccent || settings.navBrandAccent || "#ff4500";
  document.getElementById("nav-brand-accent-light").value =
    data.nav?.brandAccentLight || settings.navBrandAccentLight || "#E5A558";
  document.getElementById("announcement-enabled").checked = data.nav?.announcement?.enabled === true;
  document.getElementById("announcement-text").value = data.nav?.announcement?.text || "";
  document.getElementById("announcement-href").value = settings.announcementHref || data.nav?.announcement?.href || "";
  document.getElementById("announcement-style").value = settings.announcementStyle === "marquee" ? "marquee" : "static";
  document.getElementById("announcement-bg").value = /^#[0-9a-f]{6}$/i.test(settings.announcementBgColor || "") ? settings.announcementBgColor : "#161616";
  document.getElementById("announcement-color").value = /^#[0-9a-f]{6}$/i.test(settings.announcementTextColor || "") ? settings.announcementTextColor : "#ffffff";
  updateAnnouncementPreview();

  renderNavItems();
  togglePasswordField();
  updateCounters();
  updateSocialImage();
  setDirty(false);
}

function collectSettings() {
  return {
    passwordProtection: document.getElementById("password-protection").checked,
    b2bOnly: document.getElementById("b2b-only").checked,
    geoRedirect: document.getElementById("geo-redirect").checked,
    languageRedirect: document.getElementById("language-redirect").checked,
    hcaptchaContact: document.getElementById("hcaptcha-contact").checked,
    hcaptchaAccount: document.getElementById("hcaptcha-account").checked,
    homeTitle: document.getElementById("home-title").value.trim(),
    metaDescription: document.getElementById("meta-description").value.trim(),
    socialImageUrl: document.getElementById("social-image-url").value.trim(),
    storePassword: document.getElementById("store-password").value,
    navLogoUrl: document.getElementById("nav-logo-url").value.trim(),
    navLogoHeight: Number(document.getElementById("nav-logo-height").value || 68),
    navBrandAccent: document.getElementById("nav-brand-accent").value,
    navBrandAccentLight: document.getElementById("nav-brand-accent-light").value,
    navItems: collectNavItemsFromDom(),
    announcementEnabled: document.getElementById("announcement-enabled").checked,
    announcementText: document.getElementById("announcement-text").value.trim(),
    announcementHref: document.getElementById("announcement-href").value.trim(),
    announcementStyle: document.getElementById("announcement-style").value,
    announcementBgColor: document.getElementById("announcement-bg").value,
    announcementTextColor: document.getElementById("announcement-color").value,
  };
}

document.getElementById("nav-add-item")?.addEventListener("click", () => {
  navItems.push({
    id: `nav-${Date.now()}`,
    label: "New page",
    href: "/",
    matchPrefixes: ["/"],
    visible: true,
  });
  renderNavItems();
  setDirty(true);
});

["nav-logo-url", "nav-logo-height", "nav-brand-accent", "nav-brand-accent-light"].forEach((id) => {
  document.getElementById(id)?.addEventListener("input", () => setDirty(true));
  document.getElementById(id)?.addEventListener("change", () => setDirty(true));
});

["announcement-enabled", "announcement-text", "announcement-href", "announcement-style", "announcement-bg", "announcement-color"].forEach((id) => {
  document.getElementById(id)?.addEventListener("input", () => { setDirty(true); updateAnnouncementPreview(); });
  document.getElementById(id)?.addEventListener("change", () => { setDirty(true); updateAnnouncementPreview(); });
});

document.querySelectorAll("[data-pref]").forEach((el) => {
  el.addEventListener("input", () => {
    setDirty(true);
    if (el.id === "home-title" || el.id === "meta-description") updateCounters();
    if (el.id === "social-image-url") updateSocialImage();
  });
  el.addEventListener("change", () => {
    setDirty(true);
    if (el.id === "password-protection") togglePasswordField();
  });
});

document.getElementById("save-prefs-btn").addEventListener("click", async () => {
  const btn = document.getElementById("save-prefs-btn");
  btn.disabled = true;
  syncDockEdit(true);
  try {
    const d = await adminFetch("/api/admin/store/preferences", {
      method: "POST",
      body: JSON.stringify({ settings: collectSettings() }),
    });
    applySettings(d);
    showNote("Preferences saved.", "success");
  } catch (err) {
    showNote(err.message, "error");
    setDirty(true);
  }
});

function crawlerNotice(message, kind = "info") {
  const notice = document.getElementById("crawler-notice");
  notice.textContent = message || "";
  notice.hidden = !message;
  notice.className = `prefs-crawler-notice${message ? ` is-${kind}` : ""}`;
}

function setCheck(name, ok, text) {
  const li = document.querySelector(`#crawler-checks [data-check="${name}"]`);
  if (!li) return;
  li.dataset.state = ok === null ? "pending" : ok ? "ok" : "bad";
  li.querySelector("em").textContent = text;
}
async function verifyDiscoveryFiles(site) {
  setCheck("robots", null, "Checking…");
  setCheck("sitemap", null, "Checking…");
  let sitemapUrls = null;
  const fetchText = async (url) => {
    const res = await fetch(url, { cache: "no-store", credentials: "omit" });
    return { res, body: res.ok ? await res.text() : "" };
  };
  try {
    const { res, body } = await fetchText(site.robots_url || "/robots.txt");
    if (!res.ok) setCheck("robots", false, `Not reachable (HTTP ${res.status})`);
    else if (!/user-agent/i.test(body)) setCheck("robots", false, "Reachable, but no rules found");
    else setCheck("robots", true, /sitemap:/i.test(body) ? "Live, and points to your sitemap" : "Live, but does not list your sitemap");
  } catch { setCheck("robots", false, "Could not be checked from this browser"); }
  try {
    const { res, body } = await fetchText(site.sitemap_url || "/sitemap.xml");
    if (!res.ok) setCheck("sitemap", false, `Not reachable (HTTP ${res.status})`);
    else {
      sitemapUrls = (body.match(/<loc>/g) || []).length;
      setCheck("sitemap", sitemapUrls > 0, sitemapUrls > 0 ? `Live, ${sitemapUrls} URLs` : "Reachable, but empty");
    }
  } catch { setCheck("sitemap", false, "Could not be checked from this browser"); }
  return sitemapUrls;
}

async function refreshCrawlerDashboard() {
  const button = document.getElementById("crawler-refresh-btn");
  const pill = document.getElementById("crawler-status-pill");
  if (button) button.disabled = true;
  try {
    const data = await adminFetch("/api/admin/store/crawler");
    const site = data.site || {};
    const counts = data.public_discovery || {};
    const bindingPresent = data.crawler_binding_present === true;
    document.getElementById("crawler-site-name").textContent = site.name || "Storefront";
    document.getElementById("crawler-site-domain").textContent = site.domain || "Configure a public HTTPS website URL in Company settings.";
    document.getElementById("crawler-robots-link").href = site.robots_url || "/robots.txt";
    document.getElementById("crawler-sitemap-link").href = site.sitemap_url || "/sitemap.xml";
    const expected = Number(counts.sitemap_url_count || 0);
    document.getElementById("crawler-routes-count").textContent = String(Number(counts.indexable_routes || 0));
    document.getElementById("crawler-products-count").textContent = String(Number(counts.active_products || 0));
    const runtime = document.getElementById("crawler-runtime-status");
    runtime.textContent = bindingPresent ? "Connected" : "Not connected";
    runtime.className = `prefs-status-pill${bindingPresent ? " is-ready" : ""}`;
    const live = await verifyDiscoveryFiles(site);
    document.getElementById("crawler-sitemap-count").textContent = live === null ? "—" : String(live);
    const sync = document.getElementById("crawler-sync-status");
    if (live === null) sync.textContent = "—";
    else sync.textContent = live === expected ? "In sync" : `${live > expected ? "+" : "−"}${Math.abs(live - expected)} off`;
    const filesOk = document.querySelectorAll('#crawler-checks [data-state="bad"]').length === 0;
    const ready = Boolean(site.origin) && filesOk && live !== null && live === expected;
    pill.textContent = !site.origin ? "Domain required" : ready ? "Search-ready" : "Needs attention";
    pill.className = `prefs-status-pill${ready ? " is-ready" : " is-warning"}`;
    crawlerNotice(counts.sitemap_truncated
      ? "The sitemap listing reached its 48,000-product cap. A sitemap index is needed before this catalog can publish more product URLs."
      : (live !== null && live !== expected
        ? "The live sitemap does not match your catalog. Refresh in a minute; if it persists, the sitemap cache may be stale."
        : ""), counts.sitemap_truncated || (live !== null && live !== expected) ? "warning" : "info");
  } catch (error) {
    pill.textContent = "Unavailable";
    pill.className = "prefs-status-pill is-warning";
    if (error.status === 409) crawlerNotice("Configure a valid public HTTPS storefront domain before publishing search discovery files.", "warning");
    else crawlerNotice(error.message || "Search discovery status could not be loaded.", "error");
    for (const id of ["crawler-routes-count", "crawler-products-count", "crawler-sitemap-count", "crawler-sync-status"]) {
      document.getElementById(id).textContent = "—";
    }
    setCheck("robots", false, "Status unavailable");
    setCheck("sitemap", false, "Status unavailable");
  } finally {
    if (button) button.disabled = false;
  }
}

document.getElementById("crawler-refresh-btn").addEventListener("click", refreshCrawlerDashboard);
refreshCrawlerDashboard();

const assetDialog = document.getElementById("prefs-assets-dialog");
let pickerKind = "social";
let availableAssets = [];

function showAssetStatus(message) {
  document.getElementById("prefs-assets-status").textContent = message || "";
}
function renderAvailableAssets(query = "") {
  const list = document.getElementById("prefs-assets-grid");
  const needle = query.trim().toLowerCase();
  const assets = availableAssets.filter((asset) =>
    String(asset.content_type || "").startsWith("image/") &&
    ((asset.filename || "") + " " + (asset.folder || "")).toLowerCase().includes(needle));
  list.replaceChildren();
  if (!assets.length) {
    const empty = document.createElement("p");
    empty.className = "prefs-assets-empty";
    empty.textContent = availableAssets.length ? "No matching images." : "No images in the library yet. Upload one to begin.";
    list.appendChild(empty);
    return;
  }
  for (const asset of assets) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "prefs-asset-tile";
    button.setAttribute("role", "listitem");
    const img = document.createElement("img");
    img.src = asset.url;
    img.loading = "lazy";
    img.alt = "";
    const label = document.createElement("span");
    label.textContent = asset.filename || "Uploaded asset";
    button.append(img, label);
    button.addEventListener("click", () => {
      setChosenAsset(pickerKind, asset.url);
      assetDialog.close();
    });
    list.append(button);
  }
}
async function loadAvailableAssets() {
  showAssetStatus("Loading your uploaded media…");
  const data = await adminFetch("/api/admin/media?limit=120");
  availableAssets = data.assets || data.items || [];
  renderAvailableAssets(document.getElementById("prefs-assets-search").value);
  showAssetStatus(availableAssets.length + " assets available.");
}
document.querySelectorAll("[data-pick-asset]").forEach((button) => button.addEventListener("click", async () => {
  pickerKind = button.dataset.pickAsset;
  document.getElementById("prefs-assets-title").textContent = pickerKind === "nav" ? "Choose a storefront logo" : "Choose a social sharing image";
  assetDialog.showModal();
  try { await loadAvailableAssets(); } catch (error) { showAssetStatus(error.message || "Unable to load media."); }
}));
document.getElementById("prefs-assets-close").addEventListener("click", () => assetDialog.close());
document.getElementById("prefs-assets-search").addEventListener("input", (event) => renderAvailableAssets(event.target.value));
document.querySelectorAll("[data-clear-asset]").forEach((button) => button.addEventListener("click", () => {
  setChosenAsset(button.dataset.clearAsset, "");
}));
["social", "nav"].forEach((kind) => {
  const id = kind === "social" ? "social-image-url-advanced" : "nav-logo-url-advanced";
  document.getElementById(id).addEventListener("change", (event) => {
    const value = event.target.value.trim();
    if (value && !value.startsWith("/") && !/^https:\/\//i.test(value)) {
      showNote("Image URL must be an internal path or an HTTPS address.", "error");
      return;
    }
    setChosenAsset(kind, value);
  });
});
document.getElementById("prefs-assets-upload").addEventListener("change", async (event) => {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  if (files.some((file) => !file.type.startsWith("image/"))) {
    showAssetStatus("Please choose image files only."); return;
  }
  const form = new FormData();
  for (const file of files) form.append("files", file);
  form.append("prefix", "uploads/store-preferences/");
  showAssetStatus("Uploading your image…");
  try {
    const response = await fetch("/api/admin/media", { method: "POST", credentials: "include", body: form });
    if (!response.ok) throw new Error("Upload failed (" + response.status + ")");
    const data = await response.json();
    availableAssets = (data.assets || []).concat(availableAssets);
    renderAvailableAssets();
    showAssetStatus("Uploaded. Select the image to use it.");
  } catch (error) { showAssetStatus(error.message || "Upload failed."); }
  finally { event.target.value = ""; }
});
(async function () {
  try {
    const d = await adminFetch("/api/admin/store/preferences");
    applySettings(d);
  } catch (err) {
    showNote(err.message, "error");
  }
})();
</script>
