<!doctype html>
<html lang="en" class="dark antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <title>AgentSam Local Studio</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #070708; }
      #agentsam-desktop-boot {
        position: fixed; inset: 0; z-index: 2147483647;
        display: grid; place-items: center;
        background: #070708; opacity: 1;
        transition: opacity 220ms ease;
      }
      #agentsam-desktop-boot img {
        display: block; width: 88px; max-width: 24vw; height: auto;
        animation: agentsam-desktop-mark-pulse 2.4s ease-in-out infinite;
      }
      #agentsam-desktop-boot.is-exiting { opacity: 0; pointer-events: none; }
      #agentsam-desktop-boot.is-error .agentsam-desktop-boot-error {
        display: grid; justify-items: center; gap: 14px; padding: 24px;
        color: #e8eaef;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      #agentsam-desktop-boot .agentsam-desktop-boot-error p { margin: 0; color: #a1a1aa; }
      #agentsam-desktop-boot .agentsam-desktop-boot-error button {
        border: 1px solid rgba(255,255,255,.14); border-radius: 9px;
        padding: 8px 14px; background: #19191f; color: #f4f4f5;
        font: inherit; cursor: pointer;
      }
      @keyframes agentsam-desktop-mark-pulse {
        0%, 100% { opacity: .86; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #agentsam-desktop-boot, #agentsam-desktop-boot img {
          transition: none; animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-background font-sans text-foreground">
    <div id="agentsam-desktop-boot" role="status" aria-label="Opening AgentSam">
      <img src="/brand/agentsam-mark-on-dark.svg" alt="" draggable="false" />
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const boot = document.getElementById("agentsam-desktop-boot");
        if (!boot) return;
        const petWindow = new URLSearchParams(window.location.search).get("window") === "agent-sam-pet";
        if (petWindow) {
          boot.remove();
          return;
        }
        const finishBoot = () => {
          window.__AGENTSAM_DESKTOP_SHELL_READY__ = true;
          window.clearTimeout(window.__AGENTSAM_DESKTOP_BOOT_GUARD__);
          boot.classList.add("is-exiting");
          window.setTimeout(() => boot.remove(), 240);
        };
        window.addEventListener("agentsam:desktop-shell-ready", finishBoot, { once: true });
        window.__AGENTSAM_DESKTOP_BOOT_GUARD__ = window.setTimeout(() => {
          if (window.__AGENTSAM_DESKTOP_SHELL_READY__) return;
          boot.setAttribute("role", "alert");
          boot.classList.add("is-error");
          boot.innerHTML =
            '<div class="agentsam-desktop-boot-error">' +
            '<img src="./brand/agentsam-mark-on-dark.svg" alt="" draggable="false" />' +
            '<p>Local Studio couldn\'t finish opening.</p>' +
            '<button type="button" id="agentsam-desktop-boot-retry">Try again</button>' +
            '</div>';
          document.getElementById("agentsam-desktop-boot-retry")?.addEventListener("click", () => window.location.reload());
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
