<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* Requires the shared ASBD token layer (asbd-tokens.css). */
  :root {
    --asbd-color-navy: #0A1628;
    --asbd-color-blue: #167BFC;
    --asbd-header-height: 76px;
  }

  #asbd-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9000;
    height: var(--asbd-header-height);
    display: flex;
    align-items: center;
    background: transparent;
    transform: translateY(0);
    transition:
      transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
      background 0.3s ease,
      box-shadow 0.3s ease,
      border-color 0.3s ease;
    border-bottom: 1px solid transparent;
    will-change: transform;
  }

  #asbd-header.hide    { transform: translateY(-100%); }

  #asbd-header.scrolled,
  #asbd-header.asbd-header--light-bg {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.07);
  }

  /* Light page theme: solid dark navy chrome so header stays visible */
  html[data-asbd-theme="light"] #asbd-header,
  #asbd-header.asbd-header--on-light-page,
  html[data-asbd-theme="light"] #asbd-header.scrolled,
  html[data-asbd-theme="light"] #asbd-header.asbd-header--light-bg,
  #asbd-header.asbd-header--on-light-page.scrolled,
  #asbd-header.asbd-header--on-light-page.asbd-header--light-bg {
    background: var(--asbd-color-navy, #0A1628);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  html[data-asbd-theme="light"] #asbd-header .asbd-logo-light,
  #asbd-header.asbd-header--on-light-page .asbd-logo-light { opacity: 1; }
  html[data-asbd-theme="light"] #asbd-header .asbd-logo-dark,
  #asbd-header.asbd-header--on-light-page .asbd-logo-dark { opacity: 0; }

  html[data-asbd-theme="light"] #asbd-header .asbd-nav a,
  #asbd-header.asbd-header--on-light-page .asbd-nav a { color: rgba(255, 255, 255, 0.72); }
  html[data-asbd-theme="light"] #asbd-header .asbd-nav a:hover,
  #asbd-header.asbd-header--on-light-page .asbd-nav a:hover { color: #fff; }
  html[data-asbd-theme="light"] #asbd-header .asbd-nav a.active,
  #asbd-header.asbd-header--on-light-page .asbd-nav a.active { color: var(--asbd-color-blue); }
  html[data-asbd-theme="light"] #asbd-header .asbd-nav a::after,
  #asbd-header.asbd-header--on-light-page .asbd-nav a::after { background: var(--asbd-color-blue); }

  html[data-asbd-theme="light"] #asbd-header .asbd-menu-toggle .asbd-menu-bar,
  #asbd-header.asbd-header--on-light-page .asbd-menu-toggle .asbd-menu-bar {
    background: #fff;
  }

  /* ── INNER ── */
  .asbd-header-inner {
    width: 100%;
    max-width: var(--asbd-layout-max);
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ── LOGO ── */
  .asbd-logo-wrap {
    display: block;
    flex-shrink: 0;
    width: 60px;
    height: 60px;
    position: relative;
  }

  .asbd-logo-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: opacity 0.3s ease;
  }

  .asbd-logo-light { opacity: 1; }
  .asbd-logo-dark  { opacity: 0; }

  #asbd-header.scrolled .asbd-logo-light,
  #asbd-header.asbd-header--light-bg .asbd-logo-light { opacity: 0; }
  #asbd-header.scrolled .asbd-logo-dark,
  #asbd-header.asbd-header--light-bg .asbd-logo-dark  { opacity: 1; }

  /* ── DESKTOP NAV (center) ── */
  .asbd-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .asbd-nav a {
    font-family: var(--asbd-font-sans);
    font-size: 15px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.78);
    text-decoration: none;
    padding: 6px 14px;
    letter-spacing: 0.01em;
    position: relative;
    transition: color 0.2s ease;
    white-space: nowrap;
  }

  .asbd-nav a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 14px;
    right: 14px;
    height: 2px;
    background: #fff;
    border-radius: 2px;
    transform: scaleX(0);
    transition: transform 0.22s ease;
    transform-origin: center;
  }

  .asbd-nav a:hover { color: #fff; }
  .asbd-nav a:hover::after { transform: scaleX(0.5); }
  .asbd-nav a.active { color: #fff; }
  .asbd-nav a.active::after { transform: scaleX(1); }

  #asbd-header.scrolled .asbd-nav a,
  #asbd-header.asbd-header--light-bg .asbd-nav a       { color: rgba(10, 22, 40, 0.55); }
  #asbd-header.scrolled .asbd-nav a::after,
  #asbd-header.asbd-header--light-bg .asbd-nav a::after { background: var(--asbd-color-blue); }
  #asbd-header.scrolled .asbd-nav a:hover,
  #asbd-header.asbd-header--light-bg .asbd-nav a:hover  { color: var(--asbd-color-navy); }
  #asbd-header.scrolled .asbd-nav a.active,
  #asbd-header.asbd-header--light-bg .asbd-nav a.active { color: var(--asbd-color-blue); }

  /* ── RIGHT SIDE ── */
  .asbd-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  /* Open Workbench = ASFB glass CTA (see asbd-cta-asfb.css / --asfb tokens) */
  .asbd-header-cta {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 40px;
    padding: 0 18px;
    border-radius: 10px;
    border: 1px solid var(--asfb-border, rgba(255, 255, 255, 0.55));
    font-family: var(--asbd-font-sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--asfb-on, #fff) !important;
    text-decoration: none !important;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    background:
      linear-gradient(145deg, var(--asfb-glass-hi, rgba(255, 255, 255, 0.32)) 0%, var(--asfb-glass-lo, rgba(255, 255, 255, 0.1)) 100%),
      color-mix(in srgb, var(--asfb, #9CB5BC) 58%, transparent);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow:
      0 0 0 1px var(--asfb-glow, rgba(156, 181, 188, 0.45)),
      0 8px 22px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
    transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
  }

  .asbd-header-cta:hover {
    transform: translateY(-1px);
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.14) 100%),
      color-mix(in srgb, var(--asfb-bright, #B8D0D6) 62%, transparent);
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--asfb-bright, #B8D0D6) 65%, transparent),
      0 12px 28px rgba(0, 0, 0, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }

  /* ── HAMBURGER ── */
  .asbd-menu-toggle {
    display: none;
    width: 44px;
    height: 44px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }

  .asbd-menu-toggle .asbd-menu-bar {
    display: block;
    width: 22px;
    height: 1.5px;
    background: #fff;
    border-radius: 2px;
    transition: background 0.2s, transform 0.3s ease, opacity 0.3s ease;
    transform-origin: center;
  }

  #asbd-header.scrolled .asbd-menu-toggle .asbd-menu-bar,
  #asbd-header.asbd-header--light-bg .asbd-menu-toggle .asbd-menu-bar { background: var(--asbd-color-navy); }

  .asbd-menu-toggle.open .asbd-menu-bar:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .asbd-menu-toggle.open .asbd-menu-bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .asbd-menu-toggle.open .asbd-menu-bar:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  /* ── OVERLAY ── */
  .asbd-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8998;
    background: rgba(5, 10, 20, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .asbd-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  /* ── SIDENAV: glassmorphic, 50vw, slides from right ── */
  .asbd-sidenav {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 8999;
    width: 50vw;
    max-width: 420px;
    min-width: 260px;

    /* GLASSMORPHIC */
    background: rgba(10, 22, 40, 0.78);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: -8px 0 48px rgba(0, 0, 0, 0.25);

    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: calc(var(--asbd-header-height) + 24px) 40px 48px;
    gap: 0;

    transform: translateX(100%);
    transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .asbd-sidenav.active { transform: translateX(0); }

  .asbd-sidenav a {
    font-family: var(--asbd-font-sans);
    font-size: 1.35rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.72);
    text-decoration: none;
    padding: 13px 0;
    letter-spacing: -0.01em;
    transition: color 0.2s ease;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    display: block;
  }

  .asbd-sidenav a:last-of-type { border-bottom: none; }
  .asbd-sidenav a:hover,
  .asbd-sidenav a.active { color: #fff; }

  .asbd-sidenav-cta {
    margin-top: 32px;
    box-sizing: border-box;
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    font-family: var(--asbd-font-sans);
    font-size: 15px !important;
    font-weight: 700 !important;
    letter-spacing: -0.015em;
    color: var(--asfb-on, #fff) !important;
    text-align: center;
    text-decoration: none !important;
    padding: 0 28px !important;
    border-radius: var(--asfb-radius, 12px) !important;
    border: 1px solid var(--asfb-border, rgba(255, 255, 255, 0.55)) !important;
    background:
      linear-gradient(145deg, var(--asfb-glass-hi, rgba(255, 255, 255, 0.32)) 0%, var(--asfb-glass-lo, rgba(255, 255, 255, 0.1)) 100%),
      color-mix(in srgb, var(--asfb, #9CB5BC) 58%, transparent) !important;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow:
      0 0 0 1px var(--asfb-glow, rgba(156, 181, 188, 0.45)),
      0 10px 28px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .asbd-nav          { display: none; }
    .asbd-header-cta   { display: none; }
    .asbd-menu-toggle    { display: flex; }
    .asbd-overlay.active { display: block; }
    .asbd-header-inner { padding: 0 20px; }
  }

  @media (max-width: 480px) {
    .asbd-sidenav { width: 75vw; }
  }
</style>

<header id="asbd-header">
  <div class="asbd-header-inner">

    <!-- LEFT: Logo -->
    <a href="/" class="asbd-logo-wrap" aria-label="AgentSam home">
      <img
        src="https://imagedelivery.net/g7wf09fCONpnidkRnR_5vw/dbb316af-9c97-4959-f09f-bf58b2783d00/avatar"
        alt="AgentSam" class="asbd-logo-light"
        width="60" height="60" loading="eager" fetchpriority="high"
      >
      <img
        src="https://imagedelivery.net/g7wf09fCONpnidkRnR_5vw/11f6af46-0a3c-482a-abe8-83edc5a8a200/avatar"
        alt="AgentSam" class="asbd-logo-dark"
        width="60" height="60" loading="eager"
      >
    </a>

    <!-- CENTER: Desktop nav -->
    <nav class="asbd-nav" aria-label="Main navigation">
      <a href="/"                    data-asbd-nav="home">Home</a>
      <a href="/docs/sam/"           data-asbd-nav="docs">Docs</a>
      <a href="/learn/"              data-asbd-nav="learn">Learn</a>
      <a href="/themes/"             data-asbd-nav="themes">Themes</a>
      <a href="/packages/sdk/help/"  data-asbd-nav="sdk">SDK</a>
    </nav>

    <!-- RIGHT: Sign Up + Hamburger -->
    <div class="asbd-header-right">
      <a href="/auth/login?next=/agentsam" class="asbd-header-cta asbd-cta-asfb asbd-cta-asfb--sm">Open Workbench</a>
      <button class="asbd-menu-toggle" id="asbdMenuToggle" aria-label="Open menu" aria-expanded="false">
        <span class="asbd-menu-bar"></span>
        <span class="asbd-menu-bar"></span>
        <span class="asbd-menu-bar"></span>
      </button>
    </div>

  </div>
</header>

<!-- Overlay -->
<div class="asbd-overlay" id="asbdOverlay" aria-hidden="true"></div>

<!-- Glassmorphic sidenav -->
<nav class="asbd-sidenav" id="asbdSidenav" aria-label="Mobile navigation" aria-hidden="true">
  <a href="/"                   data-asbd-nav="home">Home</a>
  <a href="/docs/sam/"          data-asbd-nav="docs">Docs</a>
  <a href="/learn/"             data-asbd-nav="learn">Learn</a>
  <a href="/themes/"            data-asbd-nav="themes">Themes</a>
  <a href="/packages/sdk/help/" data-asbd-nav="sdk">SDK</a>
  <a href="/auth/login?next=/agentsam" class="asbd-sidenav-cta asbd-cta-asfb">Open Workbench</a>
</nav>

<script>
(function () {
  var header    = document.getElementById('asbd-header');
  var hamburger = document.getElementById('asbdMenuToggle');
  var overlay   = document.getElementById('asbdOverlay');
  var sidenav   = document.getElementById('asbdSidenav');

  var pageIsLight =
    document.documentElement.getAttribute('data-asbd-theme') === 'light' ||
    document.body.getAttribute('data-asbd-theme') === 'light';

  if (pageIsLight) {
    header.classList.add('asbd-header--on-light-page');
  }

  var forceLightHeader = !pageIsLight && (
    document.body.classList.contains('asbd-light-header') ||
    document.body.getAttribute('data-asbd-header') === 'light' ||
    /^\/(sitemap|terms|privacy)\b/.test(window.location.pathname)
  );

  if (forceLightHeader) {
    header.classList.add('asbd-header--light-bg');
  }

  window.addEventListener('asbd:theme', function (ev) {
    var theme = ev && ev.detail && ev.detail.theme;
    var light = theme === 'light';
    header.classList.toggle('asbd-header--on-light-page', light);
    if (light) header.classList.remove('asbd-header--light-bg');
  });

  // ── Active nav ──────────────────────────────────────────────
  var path = window.location.pathname || '/';
  var seg = path === '/' ? 'home' : path.split('/').filter(Boolean)[0];
  if (path.indexOf('/packages/sdk') === 0) seg = 'sdk';
  document.querySelectorAll('[data-asbd-nav]').forEach(function (a) {
    if (a.dataset.asbdNav === seg) a.classList.add('active');
  });

  // ── Hide on scroll down / show on scroll up ─────────────────
  var lastY   = window.scrollY;
  var ticking = false;

  function handleScroll() {
    var y     = window.scrollY;
    var delta = y - lastY;

    if (forceLightHeader) {
      header.classList.add('scrolled');
      header.classList.add('asbd-header--light-bg');
    } else {
      header.classList.toggle('scrolled', y > 50);
    }

    if (y > 80) {
      if (delta > 4)       header.classList.add('hide');
      else if (delta < -4) header.classList.remove('hide');
    } else {
      header.classList.remove('hide');
    }

    lastY   = y;
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) { requestAnimationFrame(handleScroll); ticking = true; }
  }, { passive: true });

  handleScroll();

  // ── Mobile menu ─────────────────────────────────────────────
  function openMenu() {
    sidenav.classList.add('active');
    sidenav.setAttribute('aria-hidden', 'false');
    overlay.classList.add('active');
    hamburger.classList.add('open');
    hamburger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    sidenav.classList.remove('active');
    sidenav.setAttribute('aria-hidden', 'true');
    overlay.classList.remove('active');
    hamburger.classList.remove('open');
    hamburger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  hamburger.addEventListener('click', function () {
    sidenav.classList.contains('active') ? closeMenu() : openMenu();
  });

  overlay.addEventListener('click', closeMenu);
  sidenav.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', closeMenu);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMenu();
  });
})();
</script>
