# Live deploy config — vault API Worker
# Account: Inner Animal Media (ede6590ac0d2fb7daf155b35653457b2)
# Domain: simple.inneranimalmedia.com (path routes; UI Worker owns /*)
#
# Deploy from IAM desk:
#   ./scripts/with-cloudflare-env.sh npx wrangler deploy -c wrangler.workmode.toml

name = "agentsam-workmode"
account_id = "ede6590ac0d2fb7daf155b35653457b2"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "inneranimalmedia-business"
database_id = "cf87b717-d4e2-4cf8-bab0-a81268e32d49"

# Path routes on the product hostname (more specific than UI /*)
[[routes]]
pattern = "simple.inneranimalmedia.com/api/vault*"
zone_name = "inneranimalmedia.com"

[[routes]]
pattern = "simple.inneranimalmedia.com/health"
zone_name = "inneranimalmedia.com"

[vars]
WORKMODE_APP = "agentsam-workmode"
D1_DATABASE_NAME = "inneranimalmedia-business"
CLOUDFLARE_ACCOUNT_ID = "ede6590ac0d2fb7daf155b35653457b2"
PRODUCT_HOST = "simple.inneranimalmedia.com"
UI_WORKER = "agentsam-grok-workmode"
