[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsam-sdk"
version = "0.1.0"
description = "Stdlib-only D1/repository audit toolkit for inneranimalmedia (Agent Sam)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentsam = "agentsam_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["agentsam_sdk*"]
